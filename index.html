{id:610,th:"nietzsche",ti:"Deviens ce que tu es",s:"'Deviens ce que tu es.' Tu n'as pas à te 'trouver'. Tu as à te CRÉER. Nietzsche contre la conformité.",img:"🌄",body:`<p>Nietzsche, Ecce Homo :</p><p style="font-size:20px;text-align:center" class="sf"><em>"Deviens ce que tu es."</em></p><p>Tu n'as pas à te "trouver" — tu as à te <strong>créer</strong>. Tu n'as pas une essence cachée qui attend d'être révélée — tu es un projet en construction.</p><p>Le danger : la conformité. Devenir ce que les AUTRES attendent. "Personne ne peut te construire le pont sur lequel tu dois traverser le fleuve de la vie — personne d'autre que toi."</p><blockquote>"Il faut encore avoir du chaos en soi pour enfanter une étoile qui danse."<small>— Nietzsche, Zarathoustra</small></blockquote>`},
{id:611,th:"seneca",ti:"Sur la colère",s:"Tu es furieux ? Ne supprime pas la colère. Attends demain. 90% de sa force aura disparu. Sénèque savait ça il y a 2 millénaires.",img:"🌋",body:`<p>Sénèque consacre un traité entier à la colère — <em>De Ira</em>.</p><p><strong>La colère est une folie temporaire.</strong> "Le résultat de la colère est la folie."</p><p>Son conseil le plus pratique :</p><p style="font-size:18px;text-align:center" class="sf"><em>"Le meilleur remède contre la colère est le délai."</em></p><p>Tu ressens la colère monter ? "Je traiterai ça demain." Demain, la colère aura perdu 90% de sa force.</p><blockquote>"Ce n'est pas parce que les choses sont difficiles que nous n'osons pas — c'est parce que nous n'osons pas qu'elles sont difficiles."<small>— Sénèque, Lettres à Lucilius, 104</small></blockquote>`},
{id:612,th:"epictetus",ti:"L'archer stoïcien",s:"L'archer contrôle sa posture, sa visée, le moment du tir. Après ? Le vent, la cible, le hasard. La sérénité stoïcienne en une métaphore.",img:"🏹",body:`<p>L'archer contrôle sa posture, sa visée, le moment où il lâche la flèche. <strong>Mais une fois la flèche partie, il ne contrôle plus rien.</strong></p><p>L'archer sage met toute son excellence dans la préparation et le tir. Puis il <strong>accepte le résultat</strong>.</p><p>• Tu prépares un entretien du mieux possible → <strong>ta tâche</strong><br>• Le recruteur décide → <strong>sa tâche</strong></p><p>Fais de ton mieux, puis lâche prise.</p><blockquote>"Fais ce qui dépend de toi. Accepte ce qui n'en dépend pas."<small>— Synthèse stoïcienne</small></blockquote>`},
{id:613,th:"socrates",ti:"Le taon d'Athènes",s:"'Je suis un taon attaché à la cité. La cité est un grand cheval endormi.' Si tu tues le taon, le cheval dort. Socrate à ses juges.",img:"🐝",body:`<p>Lors de son procès, Socrate offre une métaphore inoubliable :</p><p><strong>"Je suis une sorte de taon que le dieu a attaché à la cité. La cité est comme un grand cheval noble mais un peu lent, qui a besoin d'être stimulé."</strong></p><p>Le taon pique. Le cheval se réveille. C'est désagréable — mais vital.</p><p>Qui est le taon dans ta vie ? Qui te dit les vérités que tu ne veux pas entendre ?</p><blockquote>"Si vous me tuez, vous ne trouverez pas facilement un autre homme comme moi."<small>— Socrate, Apologie, 30e</small></blockquote>`},
{id:620,th:"descartes",ti:"La nuit des trois songes",s:"10 novembre 1619. Un soldat de 23 ans, enfermé dans une chambre au poêle. Trois rêves. Au matin, il décide de refonder toute la connaissance humaine.",img:"🌙",body:`<p>10 novembre 1619. Descartes est enfermé dans une chambre chauffée par un poêle, en Allemagne. Cette nuit-là, trois rêves le visitent.</p><p>Au matin, Descartes est convaincu : <strong>il doit refonder toute la connaissance humaine.</strong> Repartir de zéro. Douter de tout. Ne garder que ce qui résiste au doute le plus radical.</p><p>22 ans plus tard naît le Cogito. Mais tout commence cette nuit-là, avec un homme de 23 ans qui ose douter de tout.</p><blockquote>"Pour atteindre la vérité, il faut une fois dans sa vie se défaire de toutes les opinions qu'on a reçues."<small>— Descartes</small></blockquote>`},
{id:621,th:"kant",ti:"La vie la plus réglée de l'histoire",s:"80 ans. Jamais quitté sa ville. Une seule fois en retard sur sa promenade : le jour où il a reçu l'Émile de Rousseau.",img:"🕐",body:`<p>Emmanuel Kant n'a jamais quitté Königsberg. En 80 ans, il n'est pas sorti de sa ville natale.</p><p>Sa routine était si précise que les habitants réglaient leurs montres sur l'heure de sa promenade. Une seule fois il a perturbé son horaire : le jour où il a reçu l'Émile de Rousseau.</p><p>De cette vie minuscule est sortie une œuvre colossale : les trois Critiques. Le plus grand philosophe moderne n'avait pas besoin de voir le monde — il avait besoin de le penser.</p><blockquote>"Deux choses remplissent le cœur d'admiration : le ciel étoilé au-dessus de moi et la loi morale en moi."<small>— Kant</small></blockquote>`},
{id:622,th:"peterson",ti:"Le chaos et le dragon",s:"Le dragon garde l'or. Ce que tu veux le plus au monde se trouve exactement là où tu as le plus peur d'aller. Peterson et la mythologie.",img:"🐉",body:`<p>Le dragon, dans presque toutes les cultures, représente le <strong>chaos</strong> — l'inconnu menaçant. Le héros est celui qui ENTRE dans la caverne du dragon au lieu de fuir.</p><p>Ce que tu trouves dans la caverne ? De l'or. Le trésor. Autrement dit : <strong>ce que tu veux le plus se trouve exactement là où tu as le plus peur d'aller</strong>.</p><p>La confiance ne vient pas AVANT l'action — elle vient APRÈS.</p><blockquote>"Ce que tu veux le plus se trouve exactement là où tu as le plus peur d'aller."<small>— Jordan Peterson</small></blockquote>`},
{id:623,th:"sun_tzu",ti:"Les 5 défauts fatals d'un général",s:"5 défauts. Si tu ne connais pas le tien, tes adversaires le trouveront pour toi. Sun Tzu : lequel es-tu ?",img:"⚠️",body:`<p>Sun Tzu identifie 5 défauts qui condamnent un chef :</p><p><strong>1. La témérité</strong> — mène à la destruction.<br><strong>2. La lâcheté</strong> — mène à la capture.<br><strong>3. Le tempérament colérique</strong> — exploitable par les insultes.<br><strong>4. L'excès d'honneur</strong> — sensible à la honte.<br><strong>5. La sollicitude excessive</strong> — vulnérable au chantage émotionnel.</p><p><strong>Lequel de ces 5 défauts est le TIEN ?</strong> Si tu ne le sais pas, tes adversaires le trouveront pour toi.</p><blockquote>"Ces cinq défauts sont ruineux pour un général."<small>— Sun Tzu, VIII.12-14</small></blockquote>`},
{id:624,th:"carnegie",ti:"Le nom : le son le plus doux",s:"Napoléon III mémorisait le nom de chaque personne rencontrée. Jim Farley se rappelait de 50 000 prénoms. Carnegie explique pourquoi ça change tout.",img:"👤",body:`<p>Jim Farley, directeur de campagne de Roosevelt, pouvait se rappeler du prénom de <strong>50 000 personnes</strong>.</p><p>Carnegie : <em>"Le nom d'une personne est, pour elle, le son le plus doux et le plus important de toute langue."</em></p><p>Oublier le nom de quelqu'un envoie le signal : "Tu n'es pas assez important."</p><p><strong>Exercice :</strong> La prochaine personne que tu rencontres, utilise son prénom 3 fois dans les 5 premières minutes.</p><blockquote>"Le nom d'une personne est, pour elle, le son le plus doux de toute langue."<small>— Dale Carnegie, Ch. 6</small></blockquote>`},
{id:625,th:"joule_beauvois",ti:"Le ce-n'est-pas-tout",s:"'75 cents le cookie.' Pause. 'Attendez — pour ce prix, vous en avez DEUX.' 73% achètent. Prix direct de 2 cookies à 75 cents ? 40%.",img:"🎁",body:`<p>La technique du <strong>ce-n'est-pas-tout</strong> (Burger, 1986) : vous annoncez un prix, puis AVANT le refus, vous ajoutez des bonus.</p><p>"75 cents le cookie." Avant la décision : "Attendez, ce soir c'est 2 cookies pour 75 cents !" <strong>73% achètent</strong> (vs 40% en direct).</p><p>Le mécanisme : ce n'est PAS le prix final qui compte — c'est la perception d'une <strong>concession</strong>. La norme de réciprocité vous pousse à "faire un effort" en retour.</p><blockquote>"Ce n'est pas la valeur objective de l'offre qui compte — c'est la perception d'une concession."<small>— Burger, 1986</small></blockquote>`},
{id:626,th:"adler",ti:"Le courage d'être détesté",s:"Si tout le monde t'aime, tu n'as probablement jamais rien fait d'important. Le titre du livre d'Adler/Kishimi dit tout.",img:"🛡️",body:`<p><strong>Le désir d'être aimé par tout le monde est la source de presque toute ta souffrance.</strong></p><p>Si tu modifies ton comportement pour plaire à chacun, tu deviens une marionnette tirée par autant de fils qu'il y a de personnes.</p><p>L'antidote : ce que les autres pensent de toi ? <strong>Leur tâche.</strong> Ce que TU fais de ta vie ? <strong>Ta tâche.</strong></p><p>Socrate, Jésus, Gandhi, Mandela — tous ont été détestés par beaucoup.</p><blockquote>"La liberté, c'est être détesté par d'autres personnes. C'est la preuve que tu vis selon tes propres principes."<small>— Kishimi</small></blockquote>`},
{id:627,th:"james_allen",ti:"La santé du corps suit la santé de l'esprit",s:"'Des pensées de peur ont été connues pour tuer un homme aussi sûrement qu'une balle.' Excessif ? La psychosomatique moderne dit que non.",img:"💪",body:`<p>Allen : <strong>les pensées impures affectent directement le corps.</strong></p><p>"Des pensées de peur ont été connues pour tuer un homme aussi sûrement qu'une balle." La psychosomatique confirme : le stress chronique détruit le système immunitaire.</p><p>Pensées fortes → caractère fort → habitudes fortes → santé forte.</p><blockquote>"Le corps est le serviteur de l'esprit. Il obéit aux opérations de l'esprit."<small>— James Allen</small></blockquote>`},
{id:628,th:"greene",ti:"Occuper le terrain moral",s:"Gandhi ne se battait pas contre les Britanniques. Il se battait pour la justice. Attaquer Gandhi revenait à attaquer la vertu elle-même.",img:"⚖️",body:`<p>Greene, Stratégie 25 : <strong>la cause que tu défends doit sembler plus juste que celle de l'ennemi.</strong></p><p>Ce n'est pas une question de vérité — c'est une question de <strong>perception</strong>.</p><p>Gandhi se battait pour la justice, la dignité, la non-violence. Attaquer Gandhi revenait à attaquer la vertu elle-même.</p><p>Quand tu es attaqué moralement, contre-attaque sur le terrain moral. Retourne l'accusation.</p><blockquote>"Questionnez les motifs de vos adversaires et faites-les paraître malfaisants."<small>— Robert Greene, Stratégie 25</small></blockquote>`},
{id:629,th:"rumelt",ti:"L'objectif proximate : ni trop loin, ni trop proche",s:"Kennedy, 1961. 'Un homme sur la Lune avant la fin de la décennie.' Ni trop facile, ni impossible. C'est ça, un objectif proximate.",img:"🌙",body:`<p>Rumelt introduit l'<strong>objectif proximate</strong> — assez ambitieux pour mobiliser, assez réaliste pour être faisable.</p><p><strong>Kennedy, 1961 :</strong> "Envoyer un homme sur la Lune avant la fin de la décennie."</p><p>1. <strong>Spécifique</strong><br>2. <strong>Mesurable</strong><br>3. <strong>Temporellement borné</strong><br>4. <strong>Proximate</strong> — dur mais faisable</p><p>Un objectif trop lointain ne mobilise personne. Trop facile ne crée pas d'énergie.</p><blockquote>"Un objectif proximate est celui dont la réalisation est réellement faisable."<small>— Rumelt, Ch. 7</small></blockquote>`},
{id:630,th:"marcus_aurelius",ti:"Memento mori",s:"'Bientôt tu auras tout oublié. Bientôt tous t'auront oublié.' Steve Jobs au miroir chaque matin : 'Si c'était mon dernier jour, est-ce que je ferais ça ?'",img:"💀",body:`<p>Le memento mori n'est pas du masochisme. C'est un <strong>outil de clarté</strong>.</p><p>Marc Aurèle se répétait chaque matin : <em>"Bientôt tu auras tout oublié, et bientôt tous t'auront oublié."</em></p><p>L'effet est <strong>libérateur</strong> : cette dispute qui te consume ? Tu seras mort dans 50 ans. Ce statut que tu poursuis ? Cette procrastination ?</p><p>Steve Jobs : <em>"Se rappeler que l'on va bientôt mourir est le meilleur outil pour prendre les grandes décisions de sa vie."</em></p><blockquote>"Tu pourrais quitter la vie en cet instant même. Que cette pensée guide ce que tu fais."<small>— Marc Aurèle, Pensées, II.11</small></blockquote>`},
{id:700,th:"montaigne",ti:"Que sais-je ? — L'art du doute joyeux",s:"Il se retire dans une tour à 38 ans. Grave des citations sur les poutres. Parle de ses calculs rénaux et de ses érections. Et invente un genre littéraire.",img:"📖",body:`<p>Michel de Montaigne invente un genre littéraire — l'essai — et une méthode : <strong>s'observer soi-même sans certitudes.</strong></p><p>Il se retire dans sa tour à 38 ans. Sa devise : <em>"Que sais-je ?"</em></p><p>Les Essais sont un autoportrait de 1 000 pages. Le fil conducteur : <strong>aucune certitude, que des expériences.</strong></p><p>Montaigne est le premier relativiste culturel. "Chacun appelle barbarie ce qui n'est pas de son usage." Premier philosophe du corps aussi.</p><blockquote>"La plus grande chose du monde, c'est de savoir être à soi."<small>— Montaigne, Essais, I, 39</small></blockquote>`},
{id:701,th:"rousseau",ti:"L'homme naît bon — la société le corrompt",s:"'Le premier qui, ayant enclos un terrain, dit : ceci est à moi, fut le fondateur de la société civile.' Rousseau dynamite 10 000 ans de civilisation.",img:"🌳",body:`<p>1755. Rousseau : l'homme à l'état de nature est bon, libre, égal. <strong>C'est la société — la propriété, la comparaison — qui le corrompt.</strong></p><p>"Le premier qui, ayant enclos un terrain, s'avisa de dire : <em>Ceci est à moi</em>, et trouva des gens assez simples pour le croire, fut le vrai fondateur de la société civile."</p><p>Le <strong>Contrat social</strong> (1762) : un pacte où chacun abandonne sa liberté naturelle pour la liberté civile. Le souverain, c'est le peuple.</p><blockquote>"L'homme est né libre, et partout il est dans les fers."<small>— Rousseau, Du contrat social, I, 1</small></blockquote>`},
{id:702,th:"marx",ti:"Les philosophes ont interprété le monde — il s'agit de le transformer",s:"15 mots ont changé l'histoire : 'Les philosophes n'ont fait qu'interpréter le monde — ce qui importe, c'est de le transformer.'",img:"⚒️",body:`<p>Marx renverse la philosophie : penser ne suffit pas. <strong>Il faut agir.</strong></p><p>Sa thèse : ce ne sont pas les idées qui font l'histoire, mais les <strong>conditions matérielles</strong>. Qui possède quoi ? Qui travaille pour qui ?</p><p>L'aliénation : le travailleur est séparé de son produit, de son activité, de son essence.</p><p>L'idéologie : les idées dominantes sont les idées de la classe dominante. La religion console le pauvre ("opium du peuple").</p><blockquote>"Les philosophes n'ont fait qu'interpréter le monde — ce qui importe, c'est de le transformer."<small>— Marx, Thèses sur Feuerbach, XI</small></blockquote>`},
{id:703,th:"foucault",ti:"Le Panoptique — ou pourquoi tu te surveilles toi-même",s:"Imagine une prison ronde. Au centre, une tour. Le gardien voit tout. Personne ne voit le gardien. Les prisonniers se surveillent eux-mêmes. C'est ton open space.",img:"👁️",body:`<p>Imagine une prison circulaire. Au centre : une tour. Le gardien voit toutes les cellules. <strong>Aucun prisonnier ne peut voir le gardien.</strong></p><p>Résultat : ils ne savent jamais s'ils sont observés. Ils se comportent COMME S'ILS L'ÉTAIENT TOUJOURS. <strong>Ils se surveillent eux-mêmes.</strong></p><p>Foucault montre que ce mécanisme est le principe de la société moderne : l'école, l'hôpital, l'open space, Instagram.</p><p>Le pouvoir moderne n'a pas besoin de violence. Il a besoin de <strong>visibilité</strong>.</p><blockquote>"La visibilité est un piège."<small>— Foucault, Surveiller et punir, 1975</small></blockquote>`},
{id:704,th:"schopenhauer",ti:"Le monde est Volonté — et la Volonté est souffrance",s:"'La vie oscille comme un pendule, de la souffrance à l'ennui.' Des porcs-épics frigorifiés se serrent et se piquent. La métaphore la plus juste sur les relations.",img:"🌑",body:`<p>Schopenhauer : derrière toute apparence se cache une force aveugle, insatiable. <strong>la Volonté</strong>.</p><p><strong>"La vie oscille comme un pendule, de la souffrance à l'ennui."</strong> Le désir non comblé = souffrance. Le désir comblé = ennui.</p><p>Trois échappatoires : l'art (la musique), la compassion, l'ascèse.</p><p>Le dilemme du porc-épic : des porcs-épics frigorifiés se serrent et se piquent. Ils trouvent la bonne distance. <strong>Cette distance, c'est la politesse.</strong></p><blockquote>"La vie oscille comme un pendule, de la souffrance à l'ennui."<small>— Schopenhauer, §57</small></blockquote>`},
{id:705,th:"hegel",ti:"La dialectique du maître et de l'esclave",s:"Un maître et un esclave. Le maître ne fait rien — il stagne. L'esclave travaille — il progresse. Qui est vraiment libre ? Hegel renverse tout.",img:"↻",body:`<p>Hegel raconte un combat à mort entre deux consciences. L'une risque sa vie — elle devient le <strong>maître</strong>. L'autre se soumet — l'<strong>esclave</strong>.</p><p>Mais : <strong>c'est l'esclave qui progresse.</strong> Le maître stagne. L'esclave <strong>travaille</strong>, transforme le monde, développe des compétences.</p><p>Le confort tue la croissance. Celui qui affronte l'adversité dépasse celui qui vit dans le luxe.</p><blockquote>"La chouette de Minerve ne prend son envol qu'à la tombée de la nuit."<small>— Hegel</small></blockquote>`},
{id:312,th:"foucault",ti:"Foucault — Surveiller et punir expliqué",s:"Tu ne vois pas la tour centrale — mais elle te voit. Foucault montre que ton open space, ton smartphone et tes réseaux sociaux sont des Panoptiques.",img:"🎬",t:"video",vid:"9CT-VJB1y-E"},
{id:313,th:"rousseau",ti:"Rousseau — Le Contrat Social",s:"'L'homme est né libre, et partout il est dans les fers.' Rousseau dynamite la monarchie en 1762 et invente la démocratie moderne.",img:"🎬",t:"video",vid:"P9tIsJFfX-I"},
{id:314,th:"marx",ti:"Marx — Le Capital en 10 minutes",s:"Marx en 10 minutes : l'aliénation, la plus-value, la lutte des classes. Que tu sois d'accord ou non — impossible de comprendre le XXe siècle sans lui.",img:"🎬",t:"video",vid:"fSQgCy_iIcc"},
{id:315,th:"schopenhauer",ti:"Schopenhauer — le philosophe pessimiste",s:"La vie oscille entre souffrance et ennui. Des porcs-épics qui se piquent. Schopenhauer — le pessimiste le plus brillant.",img:"🎬",t:"video",vid:"q0zmfNx7OM4"},
{id:710,th:"carnegie",ti:"Lincoln et la lettre jamais envoyée",s:"Lincoln écrit une lettre furieuse au général Meade. Chaque reproche, chaque frustration. Puis il ne l'envoie jamais. Carnegie explique pourquoi.",img:"✉️",body:`<p>Lincoln avait une technique secrète : quand il était furieux, il écrivait une <strong>lettre incendiaire</strong>. Puis il <strong>ne l'envoyait jamais</strong>.</p><p>Après Gettysburg, le général Meade avait laissé s'échapper l'armée confédérée. Lincoln écrivit une lettre cinglante. Retrouvée après sa mort avec la mention : <em>"Jamais signée. Jamais envoyée."</em></p><p><strong>Écrire la lettre purge l'émotion. Ne pas l'envoyer préserve la relation.</strong></p><blockquote>"Ne les jugez pas, car dans les mêmes circonstances, nous ferions probablement la même chose."<small>— Lincoln, cité par Carnegie</small></blockquote>`},
{id:711,th:"carnegie",ti:"Pourquoi Rockefeller souriait",s:"1914. Des gardes nationaux tuent des femmes et des enfants de mineurs de Rockefeller. Sa réponse ? Il va danser avec les femmes des mineurs.",img:"😊",body:`<p>John D. Rockefeller était détesté. Pendant la grève de 1914, des gardes tuèrent des femmes et des enfants dans un campement de mineurs.</p><p>Sa réponse ? Il est allé dans les camps. Il a serré des mains. Mémorisé des noms. Dansé avec les femmes des mineurs.</p><p>Carnegie : <strong>"En deux semaines, il avait transformé une haine meurtrière en admiration."</strong></p><p>Les gens réagissent aux <strong>émotions</strong>, pas aux faits.</p><blockquote>"L'action semble suivre le sentiment, mais en réalité action et sentiment vont ensemble."<small>— William James, via Carnegie</small></blockquote>`},
{id:720,th:"greene",ti:"Prenez de petites bouchées",s:"Bismarck n'a jamais fait de coup d'éclat. Petite guerre ici, traité là, alliance ailleurs. Quand l'Europe a compris, l'Allemagne était unie.",img:"🐍",body:`<p>Greene, Stratégie 29 : les prises de pouvoir ouvertes créent envie et résistance. La solution : <strong>prenez de petites bouchées.</strong></p><p>Chaque petite avancée est trop insignifiante pour provoquer une réaction. Multipliée par 100, elles deviennent irrésistibles.</p><p>Bismarck a unifié l'Allemagne ainsi — une guerre ici, un traité là. Quand l'Europe a compris, il était trop tard.</p><p><strong>Application :</strong> ne demande pas une promotion spectaculaire. Prends des responsabilités une à une.</p><blockquote>"Les prises de pouvoir ouvertes créent envie et méfiance. Les petites bouchées passent inaperçues."<small>— Robert Greene, Stratégie 29</small></blockquote>`},
{id:721,th:"greene",ti:"Pénétrer les esprits",s:"Le Jour J : les Alliés créent une armée FICTIVE avec de faux chars gonflables. Hitler garde ses meilleures divisions au mauvais endroit. Pendant des semaines.",img:"📡",body:`<p>Greene, Stratégie 30 : <strong>La communication est une guerre.</strong> L'objectif : infiltrer tes idées derrière les lignes de défense.</p><p><strong>1. Par les détails</strong> — les gens absorbent les histoires, pas les arguments.<br><strong>2. Par l'attente</strong> — laisse-les arriver eux-mêmes à ta conclusion.<br><strong>3. Par l'émotion</strong> — la raison convainc, l'émotion fait agir.</p><blockquote>"Envoyez vos messages à travers de petits détails, attirant les gens vers les conclusions que vous désirez."<small>— Robert Greene, Stratégie 30</small></blockquote>`},
{id:730,th:"sun_tzu",ti:"9 types de terrain — 9 façons de penser",s:"9 types de terrain. 9 psychologies différentes. Sur le terrain de mort, bats-toi. Sur le terrain dispersif, ne te bats pas. Le chapitre le plus subtil de Sun Tzu.",img:"🗺️",body:`<p>Chapitre XI — le plus subtil. Sun Tzu identifie <strong>9 types de terrain</strong> :</p><p>1. Dispersif (ton territoire) → ne te bats pas.<br>2. Facile → ne t'arrête pas.<br>3. Disputé → n'attaque pas frontalement.<br>4. Ouvert → ne bloque pas l'ennemi.<br>5. Carrefour → forge des alliances.<br>6. Sérieux (profond en territoire ennemi) → pille pour te nourrir.<br>7. Difficile → traverse vite.<br>8. Encerclé → utilise la ruse.<br>9. De mort → BATS-TOI.</p><p>Chaque situation exige une psychologie différente.</p><blockquote>"Sur le terrain de mort, bats-toi. Sur le terrain dispersif, ne te bats pas."<small>— Sun Tzu, XI</small></blockquote>`},
{id:740,th:"joule_beauvois",ti:"Le pied-dans-la-bouche",s:"'Comment allez-vous ?' — 'Ça va, merci.' Ce 'ça va' anodin fait passer l'acceptation de cookies de charité de 10% à 25%.",img:"👄",body:`<p>Howard (1990) vendait des cookies pour les Restos du Cœur par téléphone. Taux normal : <strong>10%.</strong></p><p>Avant de demander, il ajoute : <em>"Comment allez-vous aujourd'hui ?"</em> "Ça va, merci." Puis : <em>"Je suis content de savoir que vous allez bien."</em></p><p>Taux : <strong>25%.</strong> Plus que doublé.</p><p>Si tu vas bien et que quelqu'un te demande d'aider des gens qui ne vont PAS bien, <strong>refuser devient inconfortable</strong>.</p><blockquote>"Comment allez-vous aujourd'hui ? — Je suis content de savoir que vous allez bien."<small>— Howard, 1990</small></blockquote>`},
{id:741,th:"joule_beauvois",ti:"La crainte-puis-soulagement",s:"Tu trouves un papier sous ton essuie-glace. Ton cœur s'arrête : un PV ? Non — une pub. Le soulagement te rend 2x plus généreux.",img:"😮‍💨",body:`<p>Dolinsky & Nawrat. Des automobilistes mal garés trouvent un papier. Certains : une <strong>injonction de police</strong> (terreur). D'autres : une <strong>pub</strong> (soulagement).</p><p>• Contrôle : <strong>32%</strong> acceptent un questionnaire<br>• PV réel (peur) : <strong>8%</strong><br>• Fausse alerte (crainte PUIS soulagement) : <strong>62%</strong></p><p>Ce n'est pas la peur qui rend docile — c'est le <strong>soulagement qui suit</strong>. C'est le mécanisme "good cop / bad cop".</p><blockquote>"C'est le soulagement, et non la peur, qui joue un rôle déterminant."<small>— Dolinsky & Nawrat</small></blockquote>`},
{id:750,th:"adler",ti:"Le sentiment communautaire",s:"'Quel bénéfice mon existence apporte-t-elle aux autres ?' Adler dit que la réponse à cette question EST le sens de la vie.",img:"🌐",body:`<p>Le concept le plus sous-estimé d'Adler : le <strong>Gemeinschaftsgefühl</strong> — le sentiment communautaire.</p><p>Le bonheur n'est pas dans la réalisation de soi isolée. Il est dans la <strong>contribution</strong>.</p><p>Trois tâches de vie : le travail, l'amitié, l'amour. Tous les problèmes psychologiques viennent d'un déficit dans l'une de ces trois.</p><p>En cessant de se concentrer sur soi et en se concentrant sur sa contribution, on trouve exactement ce qu'on cherchait.</p><blockquote>"Ce n'est que lorsque quelqu'un se sent capable de contribuer à la communauté qu'il peut avoir le sentiment d'avoir de la valeur."<small>— Alfred Adler</small></blockquote>`},
{id:751,th:"peterson",ti:"Règle 6 : mets de l'ordre chez toi avant de critiquer le monde",s:"'Range ta chambre avant de critiquer le monde.' La règle la plus moquée de Peterson — et la plus profonde.",img:"🧹",body:`<p><strong>"Mets de l'ordre dans ta propre maison avant de critiquer le monde."</strong></p><p>Si ta vie personnelle est un chaos, de quel droit prétends-tu savoir comment le monde devrait fonctionner ?</p><p>Le désordre physique reflète le désordre mental. Mettre de l'ordre dans ton espace MET DE L'ORDRE dans ton esprit.</p><p>Commence par ce qui est devant toi. La vaisselle. Le bureau. Puis élargis.</p><blockquote>"Avant de pouvoir changer le monde, il faut changer sa propre vie. Commencez par nettoyer votre chambre."<small>— Jordan Peterson</small></blockquote>`},
{id:760,th:"montaigne",ti:"Des cannibales",s:"Des Tupinamba du Brésil visitent la France. 3 choses les choquent. Dont : que des gens crèvent de faim pendant que d'autres regorgent de richesses. 1580.",img:"🌎",body:`<p>1580. Montaigne rencontre des Tupinamba du Brésil. Il écrit "Des cannibales".</p><p><strong>"Chacun appelle barbarie ce qui n'est pas de son usage."</strong></p><p>Les Tupinamba mangent leurs ennemis morts ? Barbare. Mais brûler un homme vif pour hérésie (ce que l'Europe fait), n'est-ce pas pire ?</p><p>Les trois Tupinamba trouvent absurde : qu'un enfant commande à des adultes armés ; que des gens crèvent de faim pendant que d'autres regorgent de richesses.</p><blockquote>"Chacun appelle barbarie ce qui n'est pas de son usage."<small>— Montaigne, Essais, I, 31</small></blockquote>`},
{id:770,th:"rumelt",ti:"La question qui change tout",s:"5 questions. 5 penseurs. 10 minutes chaque dimanche. En 4 semaines, tu ne verras plus ta vie de la même manière.",img:"🔑",body:`<h3>🧠 L'exercice de la semaine stratégique</h3><p>Chaque dimanche soir, 10 minutes :</p><p><strong>1. DIAGNOSTIC (Rumelt)</strong> — Mon principal obstacle cette semaine ?</p><p><strong>2. TERRAIN (Sun Tzu)</strong> — Sur quel terrain suis-je ?</p><p><strong>3. ENGAGEMENT (Joule & Beauvois)</strong> — Quel micro-engagement public ?</p><p><strong>4. SÉPARATION DES TÂCHES (Adler)</strong> — Sur quoi ai-je gaspillé de l'énergie qui ne dépendait pas de moi ?</p><p><strong>5. MEMENTO MORI (Marc Aurèle)</strong> — Si c'était ma dernière semaine, est-ce que je la passerais ainsi ?</p><blockquote>"Une vie sans examen ne vaut pas d'être vécue."<small>— Socrate</small></blockquote>`},
{id:800,th:"machiavel",ti:"Le Prince — la vérité effective des choses",s:"1513. Exilé, torturé, ruiné. Il écrit un livre pour regagner les faveurs des puissants. Il ne les regagnera jamais — mais il invente la science politique.",img:"♟️",body:`<p>1513. Machiavel est exilé, torturé, ruiné. Il écrit Le Prince pour regagner les faveurs des Médicis. Il ne les regagnera jamais — mais il invente la science politique.</p><p><strong>"Il m'a paru plus convenable de suivre la vérité effective de la chose que son imagination."</strong></p><p>Avant : on écrit comment un prince DEVRAIT gouverner. Machiavel décrit comment ils gouvernent RÉELLEMENT.</p><p><strong>Vaut-il mieux être aimé ou craint ?</strong> Si tu dois choisir, craint. L'amour dépend des autres. La crainte dépend de toi. Mais JAMAIS haï.</p><blockquote>"Il m'a paru plus convenable de suivre la vérité effective de la chose que son imagination."<small>— Machiavel, Le Prince, XV</small></blockquote>`},
{id:801,th:"pascal",ti:"Le roseau pensant",s:"'L'homme n'est qu'un roseau. Le plus faible de la nature. Mais c'est un roseau pensant.' L'univers peut l'écraser — mais l'univers ne SAIT PAS qu'il écrase.",img:"🌾",body:`<p>Pascal, 1660 :</p><p style="font-size:18px;text-align:center" class="sf"><em>"L'homme n'est qu'un roseau, le plus faible de la nature ; mais c'est un roseau pensant."</em></p><p>L'univers peut l'écraser — une goutte d'eau suffit. Mais l'univers ne SAIT PAS qu'il écrase. L'homme, lui, sait qu'il meurt. <strong>Toute sa dignité est dans la pensée.</strong></p><p>Le divertissement : nous fuyons la pensée de la mort dans le bruit. Pascal anticipe le scroll infini de 400 ans.</p><blockquote>"Le silence éternel de ces espaces infinis m'effraie."<small>— Pascal, Pensées</small></blockquote>`},
{id:802,th:"hobbes",ti:"Le Léviathan — la vie sans État",s:"'Solitaire, pauvre, méchante, brutale et courte.' 5 mots pour décrire la vie sans État. Hobbes écrit pendant la guerre civile. Il a vu le chaos.",img:"🐉",body:`<p>Hobbes écrit pendant la guerre civile anglaise. Sa question : que se passe-t-il SANS État ?</p><p>Sa réponse : l'état de nature est une <strong>guerre de tous contre tous</strong>. La vie y est <em>"solitaire, pauvre, méchante, brutale et courte."</em></p><p>La solution : un contrat. Chacun abandonne sa liberté à un souverain — le Léviathan — qui garantit la paix.</p><p>Toute organisation sans règles claires finit en chaos. L'anarchie totale produit la loi du plus fort.</p><blockquote>"L'homme est un loup pour l'homme."<small>— Hobbes, Du Citoyen</small></blockquote>`},
{id:803,th:"diogenes",ti:"Diogène et Alexandre",s:"Alexandre le Grand : 'Demande-moi ce que tu veux.' Diogène, allongé au soleil : 'Ôte-toi de mon soleil.' Le plus puissant face au plus libre.",img:"🏺",body:`<p>Corinthe, vers 330 av. J.-C. Alexandre le Grand visite Diogène, allongé dans son tonneau au soleil.</p><p>Alexandre : <em>"Demande-moi ce que tu veux."</em></p><p>Diogène : <strong>"Ôte-toi de mon soleil."</strong></p><p>Le conquérant peut tout offrir. Le philosophe ne veut qu'une chose : qu'on ne lui bloque pas la lumière. Alexandre : <em>"Si je n'étais pas Alexandre, je voudrais être Diogène."</em></p><p>Alexandre est libre PAR le pouvoir. Diogène est libre DU pouvoir.</p><blockquote>"Je cherche un homme."<small>— Diogène, avec sa lanterne en plein jour</small></blockquote>`},
{id:804,th:"beauvoir",ti:"On ne naît pas femme — on le devient",s:"1949. 'On ne naît pas femme : on le devient.' 7 mots qui fondent le féminisme moderne. Et qui découlent directement de Sartre.",img:"♀️",body:`<p>1949. Simone de Beauvoir publie Le Deuxième Sexe. Sept mots :</p><p style="font-size:20px;text-align:center" class="sf"><em>"On ne naît pas femme : on le devient."</em></p><p>Si l'existence précède l'essence, alors il n'y a pas de "nature féminine". La femme a été <strong>construite</strong> par la société, l'éducation, les mythes.</p><p>Beauvoir montre comment la femme a été constituée comme <strong>"l'Autre"</strong>. L'homme est le Sujet, la femme l'Objet.</p><p>La libération passe par l'indépendance économique, la maîtrise du corps, le refus des rôles assignés.</p><blockquote>"On ne naît pas femme : on le devient."<small>— Beauvoir, Le Deuxième Sexe, II</small></blockquote>`},
{id:805,th:"wittgenstein",ti:"Les limites de mon langage sont les limites de mon monde",s:"Il résout TOUS les problèmes de la philosophie en 80 pages. Puis il abandonne. Devient jardinier. Puis revient — et détruit sa propre théorie.",img:"⊢",body:`<p>Wittgenstein écrit le Tractatus (1921) — 80 pages qui prétendent résoudre TOUS les problèmes de la philosophie :</p><p style="font-size:18px;text-align:center" class="sf"><em>"Ce dont on ne peut parler, il faut le taire."</em></p><p>Puis il abandonne la philosophie. Devient jardinier, instituteur. Puis revient — et <strong>détruit sa propre théorie</strong>.</p><p>Le "second Wittgenstein" : le sens d'un mot n'est pas sa référence — c'est son <strong>usage</strong>. Les mots sont des outils.</p><blockquote>"Les limites de mon langage signifient les limites de mon monde."<small>— Wittgenstein, Tractatus, 5.6</small></blockquote>`},
{id:806,th:"rawls",ti:"Le voile d'ignorance",s:"Tu ne sais pas si tu seras riche ou pauvre, homme ou femme, en bonne santé ou non. Quelles règles choisis-tu pour la société ? Le test ultime de la justice.",img:"⚖️",body:`<p>Imagine que tu dois concevoir les règles de la société — mais <strong>tu ne sais pas quelle position tu y occuperas</strong>. Riche ou pauvre ? Homme ou femme ? Handicapé ?</p><p>Derrière ce <strong>voile d'ignorance</strong>, quelles règles choisirais-tu ?</p><p>1. <strong>Liberté maximale et égale</strong> — tu pourrais être n'importe qui<br>2. <strong>Principe de différence</strong> — les inégalités ne sont acceptables que si elles profitent aux plus défavorisés</p><p>Le test ultime : "Accepterais-tu cette règle si tu ne savais pas de quel côté tu serais ?"</p><blockquote>"L'injustice n'est tolérable que lorsqu'elle est nécessaire pour éviter une injustice plus grande."<small>— Rawls, Théorie de la justice</small></blockquote>`},
{id:316,th:"machiavel",ti:"Le Prince de Machiavel — résumé",s:"Machiavel dit : vaut-il mieux être aimé ou craint ? Sa réponse a choqué l'Europe en 1513. Elle est toujours d'actualité dans chaque réunion de direction.",img:"🎬",t:"video",vid:"AOXl0Ll_t9s"},
{id:317,th:"beauvoir",ti:"Simone de Beauvoir — Le féminisme existentialiste",s:"1949. Le Vatican met le livre à l'Index. La presse hurle. 7 mots fondent le féminisme moderne : 'On ne naît pas femme — on le devient.'",img:"🎬",t:"video",vid:"VBaHwMPlcws"},
{id:318,th:"hobbes",ti:"Le Léviathan en 7 minutes",s:"'Solitaire, pauvre, méchante, brutale et courte.' Hobbes décrit la vie sans État en 5 mots. Il écrit pendant une guerre civile — il sait de quoi il parle.",img:"🎬",t:"video",vid:"9i4jb5XBX5s"},
{id:810,th:"pascal",ti:"Le divertissement",s:"'Tout le malheur des hommes vient de ne savoir pas demeurer en repos dans une chambre.' Pascal anticipe le scroll infini — en 1660.",img:"📱",body:`<p>Pascal anticipe le XXIe siècle :</p><p style="font-size:18px;text-align:center" class="sf"><em>"Tout le malheur des hommes vient d'une seule chose : ne savoir pas demeurer en repos dans une chambre."</em></p><p>Le <strong>divertissement</strong> n'est pas le loisir. C'est la fuite. Nous fuyons la pensée de notre condition — mortels, fragiles, seuls.</p><p>Remplace "chasses" par "notifications". Pascal décrit le scroll infini, le binge-watching, le FOMO. Le silence nous confronte à nous-mêmes.</p><blockquote>"Tout le malheur des hommes vient d'une seule chose : ne savoir pas demeurer en repos dans une chambre."<small>— Pascal, Pensées</small></blockquote>`},
{id:811,th:"montaigne",ti:"Apprendre à mourir",s:"'Qui a appris à mourir a désappris à servir.' Si tu n'as plus peur de la mort, tu n'as plus peur de rien. Ni du patron, ni du jugement.",img:"⚰️",body:`<p>Montaigne, Essais I, 20 :</p><p><strong>"Qui a appris à mourir a désappris à servir."</strong></p><p>Si tu n'as plus peur de la mort, tu n'as plus peur de rien. La mort est le dernier boss — une fois regardé en face, tous les autres sont des figurants.</p><p>On peut méditer sur la mort en souriant. Montaigne le fait. La forme la plus haute de courage.</p><blockquote>"Le préméditer de la mort est le préméditer de la liberté."<small>— Montaigne, Essais, I, 20</small></blockquote>`},
{id:812,th:"diogenes",ti:"La lanterne en plein jour",s:"Il se promène en plein jour avec une lanterne allumée. 'Que cherches-tu ?' — 'Un homme.' Dans une cité pleine de monde, personne ne vit vraiment.",img:"🏮",body:`<p>Diogène se promène en plein jour avec une lanterne allumée. <strong>"Je cherche un homme."</strong></p><p>Pas un homme biologique — quelqu'un d'authentique. Quelqu'un qui vit selon ses principes et non selon les conventions.</p><p>Diogène ne parle pas de liberté — il la <strong>vit</strong>. Le cynisme originel : la radicalité de la cohérence.</p><blockquote>"La vertu se démontre dans l'action, pas dans les discours."<small>— Diogène</small></blockquote>`},
{id:820,th:"joule_beauvois",ti:"L'amorçage : le leurre légal",s:"Un vendeur te propose une voiture à prix imbattable. Tu dis oui. Les conditions changent. Tu restes quand même. 95% des gens font pareil.",img:"🎣",body:`<p>L'<strong>amorçage</strong> (low-balling) : un vendeur propose une voiture à un prix imbattable. Tu dis oui. Puis il "découvre une erreur" — le prix est 15% plus élevé.</p><p>Rationnellement, tu devrais repartir. Mais la plupart <strong>restent et paient</strong>. Pourquoi ? Entre-temps, tu t'es <strong>engagé</strong>.</p><p>Cialdini (1978) : expérience à 7h du matin (6% acceptent) vs "participer à une expérience" puis révéler 7h → <strong>95% maintiennent.</strong></p><blockquote>"La personne reste sur sa décision initiale même quand les raisons ont disparu."<small>— Joule & Beauvois, Ch. III</small></blockquote>`},
{id:830,th:"carnegie",ti:"Transforme ton ennemi en allié",s:"Un rival déteste Franklin. Franklin ne contre-attaque pas. Il lui demande de lui prêter un livre rare. Le rival devient son plus fidèle allié.",img:"🤝",body:`<p>Benjamin Franklin avait un rival politique qui le détestait. Franklin n'a pas contre-attaqué. Il a <strong>demandé à son rival de lui prêter un livre rare</strong>.</p><p>Le rival, flatté, a prêté. Franklin l'a renvoyé avec un mot chaleureux. Le rival est devenu l'un de ses plus fidèles soutiens.</p><p>Pour maintenir la cohérence de son acte (prêter le livre), le rival a dû ajuster son attitude (devenir amical).</p><blockquote>"Si vous voulez vous faire un ami, laissez l'autre vous rendre un service."<small>— Benjamin Franklin, via Carnegie</small></blockquote>`},
{id:840,th:"peterson",ti:"Règle 12 : caresse un chat dans la rue",s:"La dernière règle du livre le plus dur de Peterson est la plus tendre. Il l'écrit en pensant à sa fille malade. 'Caresse un chat dans la rue.'",img:"🐈",body:`<p>La dernière règle est la plus douce : <strong>"Caresse un chat quand tu en croises un dans la rue."</strong></p><p>Peterson l'écrit en pensant à sa fille Mikhaila, qui souffre d'une maladie auto-immune dévastatrice.</p><p>Face à une souffrance qu'on ne peut résoudre, que faire ? <strong>Chercher les petits moments de beauté.</strong> Un chat qui traverse. Un rayon de soleil.</p><p>"Ce n'est peut-être pas suffisant — mais c'est quand même un putain de chat."</p><blockquote>"Quand tu as un très mauvais jour, caresse un chat dans la rue."<small>— Jordan Peterson, Règle 12</small></blockquote>`},
{id:850,th:"sun_tzu",ti:"L'utilisation des espions",s:"L'armée coûte mille pièces d'or par jour. Un bon espion coûte une fraction. Et peut rendre l'armée entière inutile. Le chapitre le plus secret de Sun Tzu.",img:"🕵️",body:`<p>Le dernier chapitre de Sun Tzu est consacré à l'espionnage — <strong>l'arme la plus importante</strong> et la moins coûteuse.</p><p><strong>5 types d'espions :</strong><br>1. Local — habitants ennemis<br>2. Intérieur — officiel ennemi retourné<br>3. Double — espion ennemi converti<br>4. Condamné — fausses infos en sachant qu'il sera capturé<br>5. Survivant — revient avec des renseignements</p><p>En business : l'information est l'arme ultime.</p><blockquote>"La connaissance préalable doit être obtenue des hommes."<small>— Sun Tzu, XIII.4</small></blockquote>`},
{id:860,th:"rumelt",ti:"La chaîne de valeur et le levier stratégique",s:"La navette Challenger : un joint à 2$ détruit un engin à 1,2 milliard. Rumelt : le maillon faible décide de tout.",img:"⛓️",body:`<p>Rumelt emprunte à l'ingénierie la <strong>théorie de la chaîne</strong> : la résistance d'une chaîne est celle de son maillon le plus faible.</p><p>En stratégie : <strong>identifie le goulot d'étranglement.</strong> C'est là, et UNIQUEMENT là, que tes efforts auront un impact.</p><p>IKEA. Le goulot n'était pas le design ni le prix. C'était la <strong>logistique</strong>. Solution : les meubles en kit.</p><blockquote>"La concentration des efforts sur un point pivot distingue la vraie stratégie de la simple liste de bonnes pratiques."<small>— Rumelt</small></blockquote>`},
{id:870,th:"greene",ti:"Savoir finir",s:"Napoléon ne savait pas s'arrêter. Bismarck savait. L'un a tout perdu. L'autre a tout gardé. La dernière stratégie de Greene.",img:"🏁",body:`<p>La dernière des 33 stratégies :</p><p><strong>Savoir quand la guerre est finie est aussi crucial que de savoir comment la mener.</strong></p><p>Napoléon ne savait pas s'arrêter. Jusqu'à Moscou. Jusqu'à Waterloo. Bismarck, lui, s'est arrêté net après avoir unifié l'Allemagne. Le résultat a duré 50 ans.</p><p>Quelle guerre continues-tu à mener qui est déjà gagnée — ou déjà perdue ?</p><blockquote>"La guerre a son propre momentum qui mène toujours à l'excès. Le stratège se retire à temps."<small>— Robert Greene, Stratégie 33</small></blockquote>`},
{id:900,th:"cialdini",ti:"La preuve sociale : on fait ce que font les autres",s:"'75% des clients de CETTE CHAMBRE réutilisent leurs serviettes.' Ce panneau bat tous les arguments écologiques. Cialdini explique pourquoi.",img:"👥",body:`<p>Cialdini teste les panneaux d'hôtel. Le standard : <em>"Participez à la sauvegarde de l'environnement."</em></p><p>Variante : <em>"75% des clients de cet hôtel réutilisent leurs serviettes."</em> <strong>26% plus efficace.</strong></p><p>Encore mieux : <em>"75% des clients de CETTE CHAMBRE..."</em></p><p>Quand nous ne savons pas quoi faire, nous regardons ce que font les AUTRES. Plus ils nous ressemblent, plus on les imite.</p><blockquote>"Quand nous ne savons pas quoi faire, nous regardons ce que font les autres."<small>— Cialdini, Yes!</small></blockquote>`},
{id:901,th:"cialdini",ti:"Le pouvoir toxique du cadeau gratuit",s:"Un bracelet à 45$ perd 10$ de valeur perçue dès qu'il est offert 'en cadeau'. Le mot 'gratuit' signale 'sans valeur'.",img:"🎁",body:`<p>Quand un produit est offert en cadeau avec un autre, <strong>sa valeur perçue s'effondre</strong>.</p><p>Un bracelet à 45$ chute à 35$ quand il est offert "en cadeau". Le mot "gratuit" signale : "ça ne vaut pas grand-chose".</p><p><strong>Leçon :</strong> ne donne jamais ton produit phare en cadeau. Tu détruis sa valeur perçue.</p><blockquote>"Un produit offert en cadeau perd de sa valeur — parce que 'gratuit' signale 'sans valeur'."<small>— Cialdini, Yes!</small></blockquote>`},
{id:902,th:"cialdini",ti:"La peur de perdre bat le désir de gagner",s:"Perdre 100€ fait 2x plus mal que gagner 100€ ne fait plaisir. Reformule toujours en perte. 'Ne ratez pas...' bat 'Saisissez...' à chaque fois.",img:"📉",body:`<p>Kahneman et Tversky : <strong>la douleur de perdre 100€ est 2 fois plus forte que le plaisir de gagner 100€.</strong></p><p>❌ "Saisissez cette chance de tester avec 20% de réduction."<br>✅ <strong>"Ne ratez pas cette chance — 20% de réduction."</strong></p><p>Le contenu est identique. Le cadrage change tout. Les gens bougent plus pour ÉVITER une perte que pour OBTENIR un gain.</p><blockquote>"Les gens sont davantage motivés par la crainte de perdre que par l'espoir de gagner."<small>— Cialdini, via Kahneman & Tversky</small></blockquote>`},
{id:903,th:"cialdini",ti:"Le restaurant qui a réduit les no-shows de 30%",s:"Un restaurateur change 2 mots dans sa phrase de réservation. Les no-shows chutent de 30%. Zéro technologie. Juste 2 mots.",img:"📞",body:`<p>Un restaurateur avait 30% de no-shows. Cialdini lui propose un changement de <strong>deux mots</strong>.</p><p>Avant : <em>"Merci de téléphoner en cas d'annulation."</em></p><p>Après : <strong>"Auriez-vous la gentillesse de nous appeler si vous devez annuler ?"</strong></p><p>Résultat : <strong>no-shows -30%.</strong> La question demande un engagement verbal. Le "Oui, bien sûr" crée un micro-engagement.</p><blockquote>"Il suffit parfois de transformer une instruction en question pour obtenir un engagement."<small>— Cialdini, Yes!</small></blockquote>`},
{id:904,th:"cialdini",ti:"L'effet Benjamin Franklin",s:"Jecker & Landy (1969) : ceux à qui on DEMANDE de rendre l'argent apprécient PLUS le chercheur. L'action précède l'attitude.",img:"📚",body:`<p>Jecker & Landy (1969) : des participants gagnent de l'argent. On demande à certains de le rendre. Résultat : <strong>ceux à qui on a demandé de rendre l'argent apprécient PLUS le chercheur.</strong></p><p>"J'ai rendu un service à cette personne → je dois l'apprécier → sinon pourquoi l'aurais-je aidée ?"</p><p>Quand tu veux que quelqu'un t'apprécie, ne lui rends pas un service. Demande-LUI un service.</p><blockquote>"Si vous voulez vous faire un ami, laissez l'autre vous rendre un service."<small>— Franklin, via Cialdini</small></blockquote>`},
{id:905,th:"cialdini",ti:"Admets ta faiblesse en premier",s:"Avis : 'Nous sommes numéro 2. Nous essayons plus fort.' L'aveu de faiblesse est devenu un avantage compétitif.",img:"🤲",body:`<p>Les entreprises qui ont <strong>admis la responsabilité de leurs erreurs</strong> s'en sont mieux sorties.</p><p>Admettre une faiblesse signale : honnêteté, contrôle, courage.</p><p>Avis, n°2 mondial : <strong>"Nous sommes numéro 2. Nous essayons plus fort."</strong> L'aveu de faiblesse est devenu un avantage compétitif.</p><blockquote>"Les gens qui admettent leurs faiblesses en premier sont perçus comme plus honnêtes et compétents."<small>— Cialdini, Yes!</small></blockquote>`},
{id:906,th:"cialdini",ti:"L'effet de contraste : le contexte change tout",s:"Un agent immobilier montre d'abord une maison horrible. La deuxième semble fantastique — même si elle est moyenne. L'effet de contraste.",img:"⚖️",body:`<p><strong>Nous ne jugeons jamais rien dans l'absolu — toujours par comparaison.</strong></p><p>Un agent immobilier montre d'abord une maison horrible et surévaluée. La deuxième semble fantastique par comparaison.</p><p>C'est le mécanisme de la <strong>porte-au-nez</strong> et de l'<strong>ancrage</strong> : le premier chiffre posé ancre toute la négociation.</p><blockquote>"Nous ne jugeons rien dans l'absolu. L'expérience qui précède conditionne la perception de celle qui suit."<small>— Cialdini, Yes!</small></blockquote>`},
{id:910,th:"greene",ti:"Contrôle la dynamique",s:"Rommel : ses adversaires ne le craignaient pas pour sa force. Mais pour sa capacité à imposer le tempo. Le contrôle du rythme bat la force brute.",img:"🎭",body:`<p>Greene, Stratégie 15 : le vrai pouvoir n'est pas de dominer chaque coup — c'est de <strong>définir la nature même du jeu</strong>.</p><p>Rommel, le "Renard du désert" : ses adversaires le craignaient pour sa capacité à <strong>imposer le tempo</strong>. Il attaquait quand on ne l'attendait pas.</p><p>En réunion : celui qui pose la première question "Quel est le vrai problème ?" contrôle la discussion.</p><blockquote>"Travaillez à définir la nature même de la relation."<small>— Robert Greene, Stratégie 15</small></blockquote>`},
{id:911,th:"greene",ti:"Frappe au centre de gravité",s:"Clausewitz : chaque structure a UN pilier central. Frappe-le et tout s'effondre. Ne réfute pas 10 arguments — trouve LE point crucial.",img:"💥",body:`<p>Chaque personne, chaque organisation a un <strong>centre de gravité</strong> — la source de pouvoir dont tout dépend.</p><p>Dans un conflit au bureau, le centre de gravité de ton adversaire n'est souvent pas son argument — c'est <strong>sa légitimité</strong>.</p><p>Napoléon cherchait toujours la bataille décisive. Pas 10 escarmouches — un coup au cœur.</p><blockquote>"Cherchez sous la surface cette source unique de pouvoir."<small>— Robert Greene, Stratégie 16</small></blockquote>`},
{id:912,th:"greene",ti:"Le Blitzkrieg : la vitesse comme arme absolue",s:"Les Français attendaient 14-18. Guderian traverse les Ardennes 'infranchissables' avec des chars. La France tombe en 6 semaines.",img:"⚡",body:`<p>Greene, Stratégie 14 : <strong>dans un monde où la plupart des gens sont indécis, la vitesse donne un pouvoir incalculable.</strong></p><p>Le Blitzkrieg de Guderian en 1940 : les Français s'attendaient à une guerre de position. Guderian a traversé les Ardennes "infranchissables" à une vitesse impossible. La France est tombée en 6 semaines.</p><p>Le premier entrant sur un marché définit les règles.</p><blockquote>"Dans un monde de gens indécis, la vitesse apporte un pouvoir immense."<small>— Robert Greene, Stratégie 14</small></blockquote>`},
{id:913,th:"greene",ti:"Créer une présence menaçante",s:"Israël après Munich : le Mossad traque CHAQUE responsable, pendant des ANNÉES, à travers le monde. Le message : 'Le coût de nous attaquer est illimité.'",img:"🦔",body:`<p>La meilleure façon de repousser les agresseurs est de les empêcher d'attaquer. Construis une <strong>réputation</strong> : se battre avec toi n'en vaut pas la peine.</p><p>Israël après Munich 1972 : le Mossad a traqué CHAQUE responsable pendant des années. Le message : "Le coût de nous attaquer est illimité."</p><p>Développe une compétence si rare que te perdre serait catastrophique.</p><blockquote>"Construisez une réputation : se battre avec vous n'en vaut pas la peine."<small>— Robert Greene, Stratégie 10</small></blockquote>`},
{id:920,th:"cialdini",ti:"Le pouvoir du 'parce que'",s:"'Puis-je passer devant ? J'ai 5 pages.' 60%. 'Parce que je suis pressé.' 94%. 'Parce que je dois faire des copies.' 93%. La dernière raison est VIDE.",img:"🔑",body:`<p>Ellen Langer teste la queue de la photocopieuse :</p><p>1. "Puis-je passer ? J'ai 5 pages." → <strong>60%</strong><br>2. "...parce que je suis pressé." → <strong>94%</strong><br>3. "...parce que je dois faire des copies." → <strong>93%</strong></p><p>La troisième raison est une tautologie ! Le simple mot <strong>"parce que"</strong> déclenche un mécanisme automatique.</p><blockquote>"Le mot 'parce que' déclenche une réponse automatique — même quand la raison est vide."<small>— Langer, 1978</small></blockquote>`},
{id:921,th:"cialdini",ti:"L'erreur du copilote",s:"Transcription de la boîte noire. Le copilote SAIT qu'il y a de la glace. Il n'ose pas contredire le commandant. 78 morts.",img:"✈️",body:`<p>13 janvier 1982. Vol Air Florida 90. Le copilote remarque de la glace sur les ailes. Il le dit — mollement, timidement. Jamais : "STOP. On n'y va pas." Pourquoi ? <strong>Parce que le commandant avait l'autorité.</strong></p><p>78 morts. Cialdini illustre le biais d'autorité — obéir aux figures d'autorité même quand elles ont tort.</p><p>Solution pour les leaders : <strong>créer un environnement où le désaccord est sûr.</strong></p><blockquote>"Les dirigeants ne voient pas l'influence de leur statut sur la capacité de leur équipe à exprimer un désaccord."<small>— Cialdini, Yes!</small></blockquote>`},
{id:922,th:"cialdini",ti:"Le miroir : imite et tu seras aimé",s:"Des serveurs qui répètent mot pour mot la commande reçoivent 70% de pourboire en plus. Pas 'très bien' — la commande exacte.",img:"🪞",body:`<p>Van Baaren : des serveurs qui <strong>répètent mot pour mot la commande</strong> (au lieu de "d'accord") reçoivent <strong>70% de pourboire en plus</strong>.</p><p>Le cerveau humain est câblé pour apprécier ceux qui nous imitent — signal d'appartenance au même groupe.</p><p>Chartrand et Bargh ("l'effet caméléon") : imiter subtilement les gestes rend plus sympathique — sans que l'autre le remarque.</p><blockquote>"Nous apprécions inconsciemment ceux qui nous imitent."<small>— Cialdini, via Chartrand & Bargh</small></blockquote>`},
{id:923,th:"cialdini",ti:"Les émotions résiduelles faussent tes décisions",s:"Tu viens de regarder un film triste ? Tu évalueras ta relation de couple plus négativement. Ne décide JAMAIS sous émotion résiduelle.",img:"🌊",body:`<p><strong>Les émotions résiduelles contaminent tes décisions suivantes</strong> — même sans rapport.</p><p>Film triste → tu évalues ta relation plus négativement. Match gagné → tu es plus généreux en négociation.</p><p><strong>Règle :</strong> avant toute décision importante, demande-toi : "Dans quel état émotionnel suis-je ?" Si tu viens de vivre quelque chose de fort, reporte.</p><blockquote>"Vérifiez votre état d'esprit avant de prendre une décision importante."<small>— Cialdini, Yes!</small></blockquote>`},
{id:930,th:"greene",ti:"Diviser pour régner",s:"Philippe de Macédoine n'a pas attaqué la coalition grecque. Il a envoyé des agents semer la méfiance entre Athènes et Thèbes. Quand il a frappé, c'était fini.",img:"✂️",body:`<p>Greene, Stratégie 17 : regarde les <strong>parties</strong> qui composent le tout. En les séparant, tu peux faire tomber l'adversaire le plus formidable.</p><p>Philippe de Macédoine : face à une coalition grecque, il a envoyé des agents semer la méfiance entre Athènes et Thèbes. Quand il a frappé, la coalition s'est effondrée.</p><p>Un concurrent monolithique est souvent un assemblage de factions rivales.</p><blockquote>"Séparez les parties, semez la dissension."<small>— Robert Greene, Stratégie 17</small></blockquote>`},
{id:931,th:"greene",ti:"Tisser un mélange de fait et de fiction",s:"Juin 1944. Des chars gonflables, de faux messages radio, une armée fictive commandée par Patton. Hitler tombe dans le piège.",img:"🎭",body:`<p>Greene, Stratégie 23 : <strong>brouille la perception de l'ennemi et tu as gagné.</strong></p><p>Le Jour J, 1944 : les Alliés ont créé une armée FICTIVE commandée par Patton, avec de faux chars gonflables. Hitler était convaincu que le débarquement viendrait au Pas-de-Calais. <strong>Il a gardé ses meilleures divisions au mauvais endroit pendant des semaines.</strong></p><blockquote>"Nourrissez leurs attentes, fabriquez une réalité qui correspond à leurs désirs — ils se tromperont eux-mêmes."<small>— Robert Greene, Stratégie 23</small></blockquote>`},
{id:1000,th:"newport",ti:"La superpuissance du XXIe siècle",s:"Woody Allen : 44 films, 23 nominations aux Oscars. Jamais possédé d'ordinateur. Newport : la profondeur est la superpuissance.",img:"🧠",body:`<p>Cal Newport pose une thèse simple :</p><p style="font-size:18px;text-align:center" class="sf"><em>"Le travail en profondeur devient de plus en plus rare au moment où il devient de plus en plus précieux."</em></p><p><strong>Travail en profondeur :</strong> concentration sans distraction qui pousse vos capacités à leur limite.</p><p><strong>Travail superficiel :</strong> e-mails, réunions, messages.</p><p>Carl Jung a construit une tour dans les bois. Mark Twain écrivait dans un hangar isolé. Newport : 4 livres, un doctorat du MIT — en ne travaillant jamais après 17h.</p><blockquote>"Le travail en profondeur est la superpuissance du XXIe siècle."<small>— Cal Newport, Deep Work</small></blockquote>`},
{id:1001,th:"newport",ti:"98% de sa journée sur le web",s:"Il passait 98% de sa journée sur le web. Il s'enferme dans une pièce sans ordinateur. 2 mois plus tard, premier de sa classe. 6 mois : salaire x2,5.",img:"💻",body:`<p>Jason Benn passait <strong>98% de sa journée</strong> à surfer. Il ne pouvait pas se concentrer.</p><p>Solution drastique : <strong>il s'enferme dans une pièce sans ordinateur.</strong> Juste des manuels et un surligneur.</p><p>Au début, l'enfer. Puis il atteint 5h de focus par jour. Il lit 18 livres en 2 mois. Finit premier du Dev Bootcamp. En 6 mois, il passe de 40 000$ à 100 000$/an.</p><blockquote>"La capacité à effectuer un travail en profondeur est LA compétence clé de l'économie du savoir."<small>— Cal Newport</small></blockquote>`},
{id:1002,th:"newport",ti:"Les 4 règles du travail en profondeur",s:"3 à 4 heures de concentration pure par jour. 5 jours par semaine. Et il produit plus que des gens qui bossent 70h.",img:"📐",body:`<h3>🧠 Les 4 règles</h3><p><strong>1. TRAVAILLE EN PROFONDEUR</strong> — Crée des rituels : lieu dédié, durée fixe, pas de téléphone.</p><p><strong>2. EMBRASSE L'ENNUI</strong> — Ne te distrais pas au moindre moment. L'ennui est un muscle.</p><p><strong>3. QUITTE LES RÉSEAUX SOCIAUX</strong> — Un outil n'est utile que si ses bénéfices dépassent ses coûts.</p><p><strong>4. DRAINE LE SUPERFICIEL</strong> — Planifie chaque minute.</p><blockquote>"3-4 heures de concentration pure par jour peuvent produire un volume stupéfiant de travail."<small>— Cal Newport</small></blockquote>`},
{id:1003,th:"newport",ti:"L'ennui est une compétence",s:"Tu dégaines ton téléphone quand tu fais la queue ? Tu entraînes ton cerveau à ne JAMAIS tolérer l'absence de stimulation. Pascal le savait déjà.",img:"😶",body:`<p>Newport : <strong>la distraction n'est pas le problème. C'est ton incapacité à tolérer l'ABSENCE de distraction.</strong></p><p>Si tu dégaines ton téléphone à chaque file d'attente, tu entraînes ton cerveau à exiger une stimulation constante. Résultat : il REFUSE de se concentrer sur le difficile.</p><p>Entraîne-toi à l'ennui. Chaque moment d'ennui volontaire muscle ton attention.</p><p>Pascal disait pareil il y a 350 ans : "Tout le malheur des hommes vient de ne savoir pas demeurer en repos dans une chambre."</p><blockquote>"Si chaque moment d'ennui est comblé par un écran, tu détruis ta capacité de concentration."<small>— Cal Newport, Règle 2</small></blockquote>`},
{id:1004,th:"newport",ti:"Le grand reset : 30 jours sans réseaux sociaux",s:"Quitte tous les réseaux sociaux pendant 30 jours. Sans prévenir. Après : quelqu'un s'est-il soucié que tu ne sois pas là ?",img:"📵",body:`<h3>🧠 Le défi Newport</h3><p><strong>Quitte TOUS les réseaux sociaux pendant 30 jours.</strong> Sans prévenir.</p><p>Après, pose-toi deux questions :</p><p>1. Les 30 jours auraient-ils été <strong>nettement meilleurs</strong> avec ce réseau ?<br>2. Quelqu'un s'est-il <strong>soucié</strong> de ton absence ?</p><p>Si non aux deux — supprime le compte.</p><blockquote>"N'utilise un outil que si ses impacts positifs dépassent substantiellement ses impacts négatifs."<small>— Cal Newport, Règle 3</small></blockquote>`},
{id:1100,th:"napoleon_hill",ti:"Les 13 étapes de la richesse",s:"Andrew Carnegie charge Napoleon Hill d'étudier les millionnaires d'Amérique. 20 ans de recherche. 13 principes. Aucun ne mentionne le mot 'argent'.",img:"💰",body:`<p>Andrew Carnegie charge Hill d'étudier les plus grands millionnaires. 20 ans de recherche. <strong>13 principes universels.</strong></p><p>1. Le désir ardent<br>2. La foi<br>3. L'autosuggestion<br>4. La connaissance spécialisée<br>5. L'imagination<br>6. La planification organisée<br>7. La décision<br>8. La persévérance<br>9. Le mastermind<br>10. La transmutation de l'énergie<br>11. Le subconscient<br>12. Le cerveau<br>13. Le sixième sens</p><blockquote>"Tout ce que l'esprit peut concevoir et croire, il peut le réaliser."<small>— Napoleon Hill</small></blockquote>`},
{id:1101,th:"napoleon_hill",ti:"Le désir ardent",s:"Edwin Barnes voulait être l'associé de Thomas Edison. Pas travailler POUR lui — AVEC lui. Il a balayé les bureaux pendant 5 ans. Puis il est devenu millionnaire.",img:"🔥",body:`<p><strong>Un souhait n'est pas un désir.</strong> Le désir ardent est une obsession brûlante.</p><p>Edwin Barnes voulait devenir l'associé d'Edison. Il est arrivé sans argent, a accepté de balayer les bureaux. Pendant 5 ANS, il a attendu. Quand Edison a inventé le Dictaphone, Barnes a sauté — et est devenu millionnaire.</p><p>Les 6 étapes : 1. Montant EXACT. 2. Que donnes-tu en échange ? 3. DATE limite. 4. Plan CONCRET. 5. Écris-le. 6. Lis-le 2x/jour.</p><blockquote>"Le point de départ de toute réalisation est le DÉSIR."<small>— Napoleon Hill</small></blockquote>`},
{id:1102,th:"napoleon_hill",ti:"Le Mastermind : tu es la moyenne des 5",s:"Andrew Carnegie avait un mastermind de 50 personnes. Tu es la moyenne des 5 personnes que tu fréquentes le plus.",img:"🧲",body:`<p>Le 9ème principe : le <strong>Mastermind</strong> — la coordination de 2+ esprits en harmonie vers un but commun.</p><p>Quand deux esprits travaillent ensemble, ils créent une <strong>troisième intelligence</strong> qui dépasse la somme.</p><p>Carnegie avait un mastermind de 50 personnes. Ford fréquentait Edison et Firestone.</p><p><strong>Tu es la moyenne des 5 personnes que tu fréquentes le plus.</strong></p><blockquote>"Aucun esprit n'est complet en soi. Il a besoin de l'association avec d'autres esprits."<small>— Napoleon Hill</small></blockquote>`},
{id:1103,th:"napoleon_hill",ti:"La décision : le trait commun des millionnaires",s:"25 000 parcours d'échec analysés. Cause n°1 : le manque de décision. Les riches décident vite et changent lentement. Les pauvres font l'inverse.",img:"⚡",body:`<p>Hill a étudié 25 000 parcours d'échec. <strong>Le manque de décision est la cause n°1 de l'échec.</strong></p><p>• Ceux qui réussissent <strong>décident vite et changent lentement</strong>.<br>• Ceux qui échouent <strong>décident lentement et changent vite</strong>.</p><p>Ford était obstiné au point de paraître têtu. Cette "obstination" l'a rendu milliardaire.</p><p>Plus tu consultes les autres avant de décider, plus tu dilues ta vision.</p><blockquote>"Le monde fait de la place à l'homme dont les actions montrent qu'il sait où il va."<small>— Napoleon Hill</small></blockquote>`},
{id:1104,th:"napoleon_hill",ti:"L'autosuggestion : programme ton subconscient",s:"Ton subconscient ne distingue pas le réel de l'imaginé. Lis ton objectif 2x par jour en RESSENTANT l'émotion. C'est l'émotion qui programme.",img:"🧠",body:`<p>Le 3ème principe : l'<strong>autosuggestion</strong>.</p><p>Le subconscient est comme un jardin. Il accepte TOUT ce que tu y plantes.</p><p>La méthode : 1. Écris ton but. 2. Lis-le à voix haute 2x/jour. 3. En lisant, <strong>RESSENS</strong> l'émotion d'avoir déjà atteint ce but. 4. VISUALISE.</p><p><strong>C'est l'émotion qui programme le subconscient.</strong> Lire sans ressentir, c'est planter sans arroser.</p><blockquote>"Votre subconscient agit uniquement sur les pensées imprégnées d'émotion."<small>— Napoleon Hill</small></blockquote>`},
{id:1200,th:"rumelt",ti:"NVIDIA : surfer la vague du changement",s:"Premier produit : un échec total. Au bord de la faillite. Puis Jensen Huang comprend quelque chose que personne ne voit. NVIDIA devient un empire d'un trillion.",img:"🌊",body:`<p>Premier produit de NVIDIA : un échec total. Au bord de la faillite.</p><p>Mais Jensen Huang a compris : le marché des GPU allait exploser — pas seulement pour les jeux, mais pour <strong>tout calcul parallèle</strong>.</p><p>La stratégie : créer une <strong>architecture programmable</strong> (CUDA). Personne n'a compris pendant des années. Puis le deep learning a explosé — et NVIDIA avait la seule plateforme. De l'obscurité au trillion.</p><blockquote>"Le changement crée de nouvelles vagues. La stratégie consiste à identifier la vague et à la chevaucher."<small>— Rumelt</small></blockquote>`},
{id:1201,th:"rumelt",ti:"Le système chain-link",s:"Un joint à 2$ détruit une navette à 1,2 milliard. Si tu copies un seul élément d'IKEA, ça ne marche pas. Rumelt et le système chain-link.",img:"🔗",body:`<p>Dans un système <strong>chain-link</strong>, la performance est limitée par le maillon le plus faible.</p><p>La navette <strong>Challenger</strong>, 1986 : un joint torique à 2$ a détruit une navette de 1,2 milliard.</p><p><strong>IKEA</strong> est un chain-link parfait : design + prix bas + meubles en kit + magasins-entrepôts. Copier un seul élément ne marche pas. Le système entier se renforce.</p><blockquote>"La performance d'un système chaîné est celle de son maillon le plus faible."<small>— Rumelt, Ch. 8</small></blockquote>`},
{id:319,th:"newport",ti:"Cal Newport — Quit Social Media",s:"Cal Newport n'a JAMAIS eu de compte sur un réseau social. Sa productivité est 10x supérieure à la moyenne. Ce TEDx explique pourquoi.",img:"🎬",t:"video",vid:"3E7hkPZ-HTk"},
{id:320,th:"napoleon_hill",ti:"Think and Grow Rich — résumé animé",s:"Les 13 principes de Napoleon Hill en animation. Aucun ne mentionne le mot 'argent' — et c'est exactement ça, le génie d'un livre vendu à 100 millions d'exemplaires.",img:"🎬",t:"video",vid:"ISiv1gXKmNg"},
{id:2000,th:"napoleon",ti:"Le coup de bluff d'Arcole",s:"25 novembre 1796. Le pont est imprenable. Les soldats meurent par dizaines. Napoléon saisit un drapeau et charge. Seul. Il a 27 ans.",img:"🦅",body:`<p>Le pont d'Arcole, Italie. L'armée française est bloquée. Plusieurs charges ont échoué.</p><p>Bonaparte — un général de 27 ans maigre comme un clou — <strong>arrache un drapeau</strong> et charge. Seul. Vers le pont.</p><p>Le choc psychologique est immédiat. Les soldats se ruent derrière lui — par <strong>honte</strong>. L'aide de camp Muiron se jette devant Bonaparte et prend la balle à sa place.</p><p>L'ironie : le pont ne sera pas pris ce jour-là. Mais la <strong>légende</strong> est née. Et la légende vaut plus que le pont.</p><blockquote>"L'imagination gouverne le monde."<small>— Napoléon Bonaparte</small></blockquote>`},
{id:2001,th:"napoleon",ti:"Austerlitz : le piège parfait",s:"2 décembre 1805. Napoléon feint la faiblesse, abandonne le plateau de Pratzen, attend que l'ennemi s'y installe — puis l'écrase. Le plus beau piège de l'histoire militaire.",img:"🌅",body:`<p>Napoléon face à deux empereurs, en infériorité numérique — 68 000 contre 85 000.</p><p>Son plan : il <strong>abandonne volontairement</strong> le plateau de Pratzen pour paraître faible. Les Alliés mordent à l'hameçon et attaquent son aile droite affaiblie — vidant le centre.</p><p>À 9h, le soleil d'Austerlitz perce la brume. Soult fonce sur le plateau maintenant vide. En 30 minutes, l'armée alliée est coupée en deux. Déroute.</p><p>Du Sun Tzu pur : paraître faible quand on est fort.</p><blockquote>"En cas de doute, marchez au son du canon."<small>— Napoléon Bonaparte</small></blockquote>`},
{id:2002,th:"napoleon",ti:"Waterloo : quand l'ego tue le génie",s:"18 juin 1815. Napoléon fait TOUTES les erreurs qu'il a enseigné à éviter. Retard, mépris de l'ennemi, refus d'écouter. L'ego a mangé la stratégie.",img:"🌧️",body:`<p>Waterloo n'est pas une défaite tactique — c'est une <strong>défaite psychologique</strong>. Le Napoléon de 1815 ne croit plus à la possibilité de perdre.</p><p><strong>1. Le retard.</strong> Il attend 11h30 — le terrain est boueux.<br><strong>2. Le mépris.</strong> "Wellington est un mauvais général."<br><strong>3. L'obstination.</strong> Ney lance des charges sans support d'infanterie.<br><strong>4. Le refus d'écouter.</strong> Grouchy poursuit dans la mauvaise direction.</p><p>Napoléon ne savait pas s'arrêter. Bismarck, lui, savait.</p><blockquote>"Du sublime au ridicule, il n'y a qu'un pas."<small>— Napoléon</small></blockquote>`},
{id:2003,th:"jeanne_darc",ti:"Une paysanne de 17 ans fait lever le siège d'Orléans",s:"1429. La France est foutue. Un tiers du pays est anglais. Le roi se cache. Et une ado illettrée de Domrémy dit qu'elle va tout changer. Tout le monde rigole. Sauf elle.",img:"⚔️",body:`<p>1429. La guerre de Cent Ans dure depuis 92 ans. Les Anglais occupent Paris et tout le nord.</p><p>Jeanne a 17 ans. Illettrée. Elle dit entendre des voix qui lui ordonnent de <strong>libérer Orléans et de faire sacrer le roi à Reims</strong>.</p><p>Elle traverse 600 km de territoire ennemi, convainc le dauphin, et le 8 mai 1429, en 9 jours, <strong>elle lève le siège d'Orléans</strong>.</p><p>Capturée, vendue, jugée pour hérésie, brûlée vive à Rouen le 30 mai 1431. Elle a 19 ans.</p><blockquote>"Je n'ai pas peur. Je suis née pour ça."<small>— Jeanne d'Arc, attribué</small></blockquote>`},
{id:2004,th:"de_gaulle",ti:"L'appel du 18 juin",s:"18 juin 1940. La France vient de capituler. Un général inconnu prend un micro à Londres : 'La France a perdu une bataille. Elle n'a pas perdu la guerre.'",img:"🇫🇷",body:`<p>17 juin 1940. Pétain annonce la capitulation. L'armée la plus puissante du continent a été balayée en 6 semaines.</p><p>Le lendemain, de Gaulle — un général quasi-inconnu — s'installe devant un micro de la BBC à Londres. Aucune légitimité officielle.</p><p><strong>"La France a perdu une bataille ! Mais la France n'a pas perdu la guerre !"</strong></p><p>Presque personne n'entend l'appel. Mais de Gaulle <strong>occupe le terrain moral</strong>. Quatre ans plus tard, il descend les Champs-Élysées en libérateur.</p><blockquote>"La France ne peut être la France sans la grandeur."<small>— Charles de Gaulle</small></blockquote>`},
{id:2005,th:"hannibal",ti:"Comment traverser les Alpes avec des éléphants",s:"218 av. J.-C. Rome se croit intouchable. Un général carthaginois de 29 ans traverse les Pyrénées, le Rhône, puis les ALPES. En hiver. Avec 37 éléphants.",img:"🐘",body:`<p>Hannibal a un problème : Rome contrôle la mer. Il décide donc l'impossible : <strong>attaquer par le NORD</strong> — traverser l'Espagne, la Gaule, et les Alpes. En hiver.</p><p>50 000 hommes, 37 éléphants. La traversée dure 15 jours. Il perd la moitié de son armée.</p><p>À Cannes (216 av. J.-C.), il inflige à Rome sa pire défaite : 50 000 à 70 000 morts en un jour, par <strong>double enveloppement</strong>.</p><p>Mais il perd la guerre — pas de grand strategy. Rome ne se rend jamais.</p><blockquote>"Nous trouverons un chemin — ou nous en créerons un."<small>— Hannibal Barca</small></blockquote>`},
{id:2006,th:"voltaire",ti:"L'affaire Calas : quand un philosophe sauve un mort",s:"1762. Jean Calas, protestant, est roué vif à Toulouse pour avoir soi-disant tué son fils. Voltaire enquête. Il va se battre 3 ans — et gagner. Posthumément.",img:"⚡",body:`<p>1761, Toulouse. Le fils de Jean Calas, protestant, est trouvé pendu. La rumeur : le père l'a tué pour l'empêcher de se convertir. <strong>Aucune preuve.</strong></p><p>Jean Calas est <strong>roué vif</strong>. Il meurt en clamant son innocence.</p><p>Voltaire enquête. Il écrit le <em>Traité sur la tolérance</em> — un missile contre le fanatisme. Pendant 3 ans, il mène une campagne acharnée.</p><p>En 1765, le jugement est cassé. <strong>Voltaire a inventé l'intellectuel engagé.</strong></p><blockquote>"Écrasez l'infâme !"<small>— Voltaire</small></blockquote>`},
{id:2007,th:"cesar",ti:"Alea jacta est : le jour où César a tué la République",s:"10 janvier 49 av. J.-C. César se tient devant le Rubicon — un petit ruisseau. Le traverser avec son armée, c'est déclarer la guerre à Rome. Il hésite une nuit. Puis : 'Les dés sont jetés.'",img:"🏛️",body:`<p>Le Rubicon est un ruisseau minable. Mais c'est la frontière légale au-delà de laquelle aucun général n'a le droit de mener ses troupes. La traverser, c'est la <strong>haute trahison</strong>.</p><p>Le Sénat exige que César licencie ses légions. S'il obéit, il sera jugé et exécuté.</p><p>Il hésite une nuit. Puis : <strong>"Alea jacta est."</strong> Les dés sont jetés. Il traverse.</p><p>En 49 jours, il contrôle toute l'Italie. Le 15 mars 44 av. J.-C., 23 coups de poignard au Sénat.</p><blockquote>"Veni, vidi, vici."<small>— Jules César</small></blockquote>`},
{id:2008,th:"richelieu",ti:"Comment un cardinal a inventé l'État moderne français",s:"Richelieu ne croyait pas en Dieu (probablement). Il croyait en la France. En 18 ans, il a brisé les nobles, humilié l'Espagne et créé la centralisation à la française.",img:"⛪",body:`<p>Richelieu, premier ministre de Louis XIII de 1624 à 1642. <strong>Machiavel en soutane.</strong></p><p>Son diagnostic : la France est faible parce qu'elle est divisée. Remède : la <strong>centralisation</strong>.</p><p>Contre les nobles : il interdit les duels, rase leurs châteaux. Contre les protestants : il assiège La Rochelle 14 mois. Contre l'Espagne : il finance ses ennemis partout en Europe.</p><p>Un CARDINAL qui fait la guerre aux pays catholiques et finance des princes protestants. La raison d'État prime sur la religion.</p><blockquote>"Qu'on me donne six lignes de la main du plus honnête homme, j'y trouverai de quoi le faire pendre."<small>— Richelieu, attribué</small></blockquote>`},
{id:2009,th:"history",ti:"La prise de la Bastille : le jour où la foule a changé l'histoire",s:"14 juillet 1789. 7 prisonniers. 95 morts. La forteresse ne servait presque plus à rien. Mais ce jour-là, un symbole tombe — et avec lui, mille ans de monarchie absolue.",img:"🔥",body:`<p>La Bastille, ce jour-là, contient <strong>exactement 7 prisonniers</strong> : 4 faussaires, 2 fous, 1 noble. Le symbole est disproportionné par rapport à la réalité.</p><p>La foule cherche de la poudre. Quelqu'un baisse le pont-levis. 95 morts côté assaillants, 1 mort côté défenseurs.</p><p>Pourquoi cet événement mineur est-il devenu LE moment fondateur ? <strong>Parce que le récit compte plus que les faits.</strong></p><p>Louis XVI : "C'est une révolte ?" — "Non, Sire. C'est une révolution."</p><blockquote>"Non, Sire. C'est une révolution."<small>— Duc de La Rochefoucauld-Liancourt</small></blockquote>`},
{id:2010,th:"spartacus",ti:"L'esclave qui a fait trembler Rome",s:"73 av. J.-C. 78 gladiateurs s'évadent avec des couteaux de cuisine. 2 ans plus tard, ils sont 120 000. Rome envoie 8 légions.",img:"⛓️",body:`<p>Spartacus et 78 gladiateurs s'évadent de l'école de Capoue avec des <strong>couteaux de cuisine</strong>.</p><p>Ils se réfugient sur le Vésuve, battent les Romains, et l'armée d'esclaves atteint <strong>120 000 hommes</strong>.</p><p>Rome confie la guerre à Crassus avec 8 légions. Il utilise la <strong>décimation</strong> : un soldat sur 10 battu à mort par ses camarades.</p><p>En 71 av. J.-C., Spartacus est vaincu. 6 000 esclaves crucifiés le long de la via Appia.</p><blockquote>"Nous n'avons rien à perdre — sauf nos chaînes."<small>— Marx, paraphrasant l'esprit de Spartacus</small></blockquote>`},
{id:2011,th:"diderot",ti:"L'Encyclopédie : 25 ans, 72 000 articles, et la censure en continu",s:"Diderot passe 25 ans de sa vie sur un projet fou : compiler TOUT le savoir humain. L'Église le condamne. Le roi le censure. Son propre éditeur sabote les textes. Il persiste.",img:"📚",body:`<p>1751. Diderot et d'Alembert lancent l'Encyclopédie. L'ambition : <strong>rassembler l'ensemble des connaissances humaines</strong>.</p><p>25 ans. 17 volumes de texte, 11 de planches. 72 000 articles. 150 contributeurs dont Voltaire, Rousseau, Montesquieu.</p><p>L'Église interdit. Le roi révoque le privilège. Et le propre éditeur de Diderot <strong>censure secrètement les articles</strong>.</p><p>Diderot persiste. L'Encyclopédie est le terreau intellectuel de la Révolution française.</p><blockquote>"Tout s'examine, tout s'agite sous la plume du philosophe."<small>— Diderot</small></blockquote>`},
{id:321,th:"history",ti:"La Révolution française en 10 minutes",s:"De la prise de la Bastille au couronnement de Napoléon. 10 ans qui ont changé la France, l'Europe, l'Amérique, et le monde entier.",img:"🎬",t:"video",vid:"8qRZcXIODNU"},
{id:322,th:"napoleon",ti:"Napoléon — du génie à la chute",s:"Du petit Corse qui chargeait seul au pont d'Arcole au prisonnier de Sainte-Hélène qui dictait ses mémoires. Le parcours le plus dingue de l'histoire humaine.",img:"🎬",t:"video",vid:"f_RaNg0Bk58"},
{id:323,th:"history",ti:"La Grèce antique — berceau de la pensée",s:"D'Athènes à Sparte, de Socrate à Alexandre le Grand. Comment 200 000 personnes dans une péninsule minuscule ont inventé la civilisation occidentale.",img:"🎬",t:"video",vid:"gFRxmi4uCGo"},
{id:3000,th:"history",ti:"Le bluff de Thémistocle à Salamine",s:"480 av. J.-C. 300 trirèmes grecques contre 1 200 navires perses. Thémistocle envoie un FAUX message à Xerxès pour l'attirer dans un piège. Le roi des rois tombe dedans.",img:"🌊",body:`<p>L'Empire perse a 1 200 navires. Les Grecs 300. Supériorité écrasante.</p><p>Thémistocle a besoin d'un terrain étroit où le nombre ne compte pas : le détroit de Salamine. Mais Xerxès ne va pas y entrer volontairement.</p><p>Thémistocle envoie un <strong>faux message</strong> : "Les Grecs préparent leur fuite cette nuit." Xerxès mord et bloque les issues du détroit — s'y enfermant.</p><p>Au matin, les trirèmes grecques éperonnent les navires perses coincés. Massacre.</p><blockquote>"L'habileté suprême consiste à plier l'ennemi sans combattre."<small>— Sun Tzu, applicable à Thémistocle</small></blockquote>`},
{id:3001,th:"voltaire",ti:"Le bug de la loterie qui a rendu Voltaire millionnaire",s:"1729. La loterie royale française a un défaut mathématique : les billets coûtent moins cher que le prix garanti. Voltaire fait le calcul. Avec un groupe d'amis, il rafle le jackpot.",img:"💰",body:`<p>Le mathématicien La Condamine repère une faille : <strong>la somme des billets vendus est INFÉRIEURE au jackpot garanti.</strong> Acheter TOUS les billets = gagner à coup sûr.</p><p>Voltaire monte un syndicat, rachète massivement obligations et billets. <strong>Ils gagnent le jackpot. Plusieurs fois.</strong></p><p>Voltaire devient riche — environ 500 000 livres. Cette liberté financière lui permettra de mener ses combats sans craindre la prison.</p><blockquote>"Le travail éloigne de nous trois grands maux : l'ennui, le vice et le besoin."<small>— Voltaire, Candide</small></blockquote>`},
{id:3002,th:"history",ti:"Le duel de Galois : la nuit où un génie de 20 ans a écrit le futur des maths",s:"30 mai 1832. Évariste Galois sait qu'il va mourir demain en duel. Il a 20 ans. Il passe la nuit à écrire frénétiquement. Ses notes vont fonder l'algèbre moderne.",img:"📝",body:`<p>Galois est un génie. À 17 ans, il résout un problème qu'Euler, Gauss et Lagrange n'avaient pas résolu.</p><p>Le 29 mai 1832, il est provoqué en duel. Il sait qu'il va mourir.</p><p>Il passe sa dernière nuit à écrire. Dans les marges, il griffonne la <strong>théorie des groupes</strong> — socle de l'algèbre abstraite, de la physique des particules et de la cryptographie.</p><p>Le lendemain, touché à l'abdomen. Mort à 20 ans. Le memento mori en acte.</p><blockquote>"Je n'ai pas le temps."<small>— Évariste Galois, dans les marges de ses derniers manuscrits</small></blockquote>`},
{id:3003,th:"napoleon",ti:"Napoléon et le vaccin",s:"1805. La variole décime l'Europe. Napoléon fait vacciner toute la Grande Armée — et ses propres enfants. L'anti-vax le plus célèbre de l'époque ? L'Angleterre.",img:"💉",body:`<p>Jenner publie ses travaux sur la vaccination en 1798. L'Europe est sceptique. L'Angleterre tarde.</p><p>Napoléon comprend l'enjeu stratégique : une armée décimée par la variole perd sans combattre. En 1805, il ordonne la vaccination de <strong>toute la Grande Armée</strong>.</p><p>Quand Jenner lui demande la libération de prisonniers anglais : <em>"Je ne peux rien refuser à Jenner."</em></p><blockquote>"Impossible n'est pas français."<small>— Napoléon (apocryphe)</small></blockquote>`},
{id:3004,th:"history",ti:"Comment un prof de maths a cassé Enigma",s:"1941. Alan Turing, 29 ans, travaille dans un manoir anglais. Il déchiffre le code nazi réputé incassable. Estimé : 14 millions de vies sauvées.",img:"🔐",body:`<p>La machine Enigma change de code CHAQUE JOUR — 158 millions de milliards de possibilités.</p><p>Turing ne fait pas de force brute. Il cherche des <strong>patterns</strong> — les failles humaines des opérateurs.</p><p>Avec son équipe à Bletchley Park, il construit la "Bombe". Les Alliés lisent les messages allemands en temps réel.</p><p>Le déchiffrement d'Enigma a <strong>raccourci la guerre de 2 ans</strong> et sauvé 14 millions de vies.</p><blockquote>"Parfois ce sont les gens dont personne n'imagine rien qui font des choses que personne n'imagine."<small>— Alan Turing (attribué)</small></blockquote>`},
