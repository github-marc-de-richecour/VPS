insecte","s":"En 1947, Grace Hopper et son équipe ont trouvé un papillon de nuit coincé dans un relais de l'ordinateur Mark II à Harvard. Ils l'ont collé dans leur carnet de bord avec la note : « First actual case of bug being found. »","img":"🦋"},{"id":24019,"cat":"Tech","thn":"GPS & Navigation","ths":"📡","ti":"Le GPS a besoin d'Einstein pour être précis","s":"Sans corrections relativistes, les GPS accumuleraient une erreur de 10 km par jour. Les satellites GPS intègrent les équations d'Einstein pour compenser le fait que le temps s'écoule plus vite dans l'espace qu'au sol.","img":"🛰️","body":"<p>Votre GPS sait où vous êtes à quelques mètres près. C'est un miracle d'ingénierie qui repose sur... <strong>la relativité générale et restreinte d'Albert Einstein</strong>. Sans lui, Google Maps vous enverrait dans un champ.</p>\n<p>Voici le problème : les <strong>31 satellites GPS</strong> orbitent à 20 200 km d'altitude, se déplaçant à 14 000 km/h. Selon la <em>relativité restreinte</em> d'Einstein, plus un objet va vite, plus son temps ralentit — les horloges des satellites retardent de <strong>7 microsecondes par jour</strong> par rapport au sol.</p>\n<p>Mais la <em>relativité générale</em> joue en sens inverse : plus on est loin d'une masse gravitationnelle, plus le temps s'écoule vite. À 20 200 km d'altitude, les horloges des satellites avancent de <strong>45 microsecondes par jour</strong>. Bilan net : les satellites gagnent <strong>38 microsecondes par jour</strong> sur les horloges terrestres.</p>\n<p>38 microsecondes, c'est minuscule. Mais le GPS fonctionne en mesurant le temps de trajet des signaux radio à la vitesse de la lumière (300 000 km/s). En une microseconde, la lumière parcourt 300 mètres. En 38 microsecondes non corrigées, l'erreur de position serait de <strong>11,4 km par jour</strong> — et s'accumulerait.</p>\n<p>Les ingénieurs du GPS américain ont donc préprogrammé les horloges atomiques des satellites pour qu'elles battent <em>légèrement moins vite</em> avant le lancement, de sorte qu'une fois en orbite, la relativité les ramène exactement à l'heure terrestre. Einstein, mort en 1955, était de facto co-inventeur du GPS.</p>\n<blockquote>« La relativité n'est pas une abstraction philosophique. C'est une technologie que vous utilisez chaque jour pour ne pas vous perdre. »<small>— Neil deGrasse Tyson, astrophysicien</small></blockquote>"},{"id":24020,"cat":"Tech","thn":"Cryptographie","ths":"🔐","ti":"Le cadenas HTTPS qui protège vos mots de passe","s":"Quand vous voyez un cadenas dans votre navigateur, une clé de chiffrement de 256 bits protège vos données. Pour la casser par force brute, même le plus puissant ordinateur quantique hypothétique mettrait plus longtemps que l'âge de l'univers.","img":"🛡️","body":"<p>Ce petit cadenas dans votre barre d'adresse est l'une des inventions les plus importantes de l'histoire de l'informatique. Il signifie que votre connexion est protégée par <strong>TLS (Transport Layer Security)</strong> — un protocole qui combine cryptographie symétrique et asymétrique pour rendre vos données illisibles à quiconque les intercepterait.</p>\n<p>Voici la magie : quand vous vous connectez à votre banque en ligne, votre navigateur et le serveur de la banque échangent des clés selon le protocole <strong>Diffie-Hellman</strong>. Deux inconnus peuvent ainsi établir un secret commun sur un canal public sans jamais l'avoir partagé au préalable — c'est mathématiquement équivalent à mélanger des peintures : facile dans un sens, impossible à défaire.</p>\n<p>Le chiffrement symétrique qui s'ensuit utilise <strong>AES-256</strong> — Advanced Encryption Standard avec une clé de 256 bits. Il y a 2²⁵⁶ clés possibles, soit un nombre à 78 chiffres. Si vous testiez un milliard de milliards de clés par seconde depuis le Big Bang, vous n'en auriez exploré qu'une fraction infinitésimale aujourd'hui.</p>\n<p>La menace qui inquiète les experts : les <strong>ordinateurs quantiques</strong>. L'algorithme de Shor, tournant sur un ordinateur quantique assez puissant, pourrait casser RSA (chiffrement asymétrique) en heures. Ce n'est pas encore possible aujourd'hui, mais le NIST américain a déjà standardisé en 2024 ses premiers algorithmes <em>post-quantiques</em> pour préparer l'après.</p>\n<blockquote>« La cryptographie est la seule arme défensive qui coûte plus cher à attaquer qu'à défendre. »<small>— Bruce Schneier, expert en sécurité informatique</small></blockquote>"},{"id":24021,"cat":"Tech","thn":"Semiconducteurs","ths":"⚙️","ti":"La loi de Moore : 60 ans de prophétie autoréalisatrice","s":"En 1965, Gordon Moore prédit que le nombre de transistors sur une puce doublerait tous les deux ans. Soixante ans plus tard, on est passé de 50 transistors à plus de 100 milliards — et la loi commence seulement à vaciller.","img":"🔬"},{"id":24022,"cat":"Tech","thn":"Histoire de la tech","ths":"💻","ti":"Google a failli être vendu pour 1 million de dollars en 1999","s":"En 1999, Larry Page et Sergey Brin ont proposé de vendre Google à Excite, alors géant du web, pour 1 million de dollars. Excite a refusé. Google vaut aujourd'hui plus de 2 000 milliards de dollars.","img":"🔍","body":"<p>L'histoire de la Silicon Valley regorge de décisions catastrophiques, mais celle d'<strong>Excite</strong> en 1999 trône dans le panthéon des erreurs les plus coûteuses de l'humanité. Larry Page et Sergey Brin, encore étudiants à Stanford, cherchaient à vendre leur moteur de recherche nommé <em>BackRub</em> — pas encore Google — pour se concentrer sur leurs doctorats.</p>\n<p>Le prix demandé : <strong>1 million de dollars</strong>. Les négociations ont même abouti à une contre-proposition à <strong>750 000 dollars</strong>. Le PDG d'Excite, <strong>George Bell</strong>, a décliné. Selon la légende, un de ses conseillers avait argué que si Google était trop efficace, les utilisateurs quitteraient Excite trop vite — le modèle économique d'Excite reposant sur le temps passé sur le site.</p>\n<p>Cette logique — volontairement offrir un mauvais service pour garder les utilisateurs captifs — était emblématique d'une industrie qui n'avait pas encore compris que l'expérience utilisateur allait tout changer. Google, lui, avait compris l'inverse : soyez si bons que les gens reviennent toujours.</p>\n<p>Excite a fait faillite en <strong>2001</strong>, emportée par l'éclatement de la bulle internet. Google, refusé, a levé des fonds auprès d'investisseurs providentiels, dont <strong>Andy Bechtolsheim</strong> (co-fondateur de Sun Microsystems) qui leur avait remis un chèque de 100 000 dollars libellé à l'ordre de « Google Inc. » — avant même que l'entreprise soit officiellement créée. Alphabet, la maison mère, pèse aujourd'hui plus de <strong>2 000 milliards de dollars</strong>.</p>\n<blockquote>« Nous avons essayé de vendre Google parce que nous voulions finir notre thèse. Personne n'en voulait. »<small>— Larry Page, co-fondateur de Google</small></blockquote>"},{"id":24023,"cat":"Tech","thn":"Bitcoin & Blockchain","ths":"₿","ti":"Les 10 000 bitcoins de la pizza la plus chère de l'histoire","s":"Le 22 mai 2010, Laszlo Hanyecz a payé 10 000 bitcoins pour deux pizzas. Au pic de 2021, ces pizzas auraient valu 690 millions de dollars. Le « Bitcoin Pizza Day » est célébré chaque 22 mai.","img":"🍕"},{"id":24024,"cat":"Tech","thn":"Centres de données","ths":"🏭","ti":"Les data centers consomment plus d'électricité que certains pays","s":"Les centres de données mondiaux consommaient environ 200 TWh d'électricité en 2022 — plus que l'ensemble de la consommation nationale de l'Argentine. Avec l'IA générative, cette consommation pourrait tripler d'ici 2030.","img":"⚡","body":"<p>Internet n'est pas dans les nuages. Internet est dans des <strong>hangars climatisés</strong> bourrés de serveurs, dispersés sur tous les continents, qui tournent 24h/24, 7j/7, et consomment de l'électricité de façon effrénée.</p>\n<p>En 2022, l'ensemble des data centers mondiaux a consommé environ <strong>200 à 250 TWh</strong> d'électricité — soit l'équivalent de la consommation annuelle de l'Argentine, un pays de 46 millions d'habitants. Le secteur représente environ <strong>1 à 2 %</strong> de la consommation électrique mondiale. Pour l'instant.</p>\n<p>L'explosion de l'IA générative change tout. Entraîner un modèle comme GPT-4 aurait consommé l'équivalent de <strong>500 tonnes de CO₂</strong> — autant que 100 voitures roulant pendant un an chacune. Mais l'<em>inférence</em> (le fait de répondre à chaque requête) est encore plus gourmande globalement : ChatGPT répondait à 10 millions de requêtes par jour à son lancement. Chaque échange coûte environ <strong>10 fois plus d'énergie</strong> qu'une recherche Google.</p>\n<p>Les géants du numérique cherchent des solutions : <strong>Microsoft</strong> expérimente des data centers sous-marins (projet Natick), refroidis par l'eau de mer. <strong>Google</strong> utilise l'IA pour optimiser le refroidissement de ses centres et affirme fonctionner à <strong>100 % d'énergies renouvelables</strong> en compensation. <strong>Meta</strong> a construit un data center en Suède pour profiter du froid arctique et de l'hydroélectricité.</p>\n<blockquote>« Si internet était un pays, il serait le 4e consommateur d'électricité au monde. »<small>— Rapport de l'International Energy Agency, 2023</small></blockquote>"},{"id":24025,"cat":"Tech","thn":"Apple & Silicon Valley","ths":"🍎","ti":"Apple a failli disparaître en 1997 — Microsoft l'a sauvée","s":"En août 1997, Apple était à 90 jours de la faillite. Bill Gates a investi 150 millions de dollars et prolongé la compatibilité Office sur Mac. En échange ? La paix judiciaire et une image de philanthrope pour Microsoft.","img":"💾","body":"<p>On oublie trop souvent qu'Apple a failli mourir. En 1997, l'entreprise de Cupertino brûlait du cash à une vitesse terrifiante : <strong>90 jours de trésorerie</strong> restants, selon Steve Jobs lui-même. Les Macs ne se vendaient plus, le système d'exploitation était une catastrophe, et Apple accumulait les pertes depuis des années.</p>\n<p>Le 6 août 1997, lors de la Macworld de Boston, Steve Jobs — revenu aux commandes depuis quelques semaines après le rachat de NeXT — a annoncé une nouvelle stupéfiante : <strong>Microsoft investissait 150 millions de dollars</strong> dans Apple et s'engageait à maintenir Microsoft Office pour Mac pendant cinq ans.</p>\n<p>La salle a hué. Voir le visage de Bill Gates apparaître en géant sur l'écran derrière Jobs était une humiliation publique pour les fans Apple. Mais Jobs a imposé le silence : « Pour qu'Apple gagne, Microsoft ne doit pas perdre. »</p>\n<p>Pourquoi Gates a-t-il accepté ? En partie pour éviter un procès antitrust : si Apple disparaissait, Microsoft aurait eu un monopole absolu sur les PC, attirant des poursuites fédérales encore plus sévères. L'investissement était autant du calcul légal que de la philanthropie.</p>\n<p>Ce que personne n'imaginait : Jobs allait lancer l'iMac en <strong>1998</strong>, l'iPod en <strong>2001</strong>, l'iPhone en <strong>2007</strong>. Apple est devenue, vingt ans après cette humiliation, la première entreprise à valoir <strong>3 000 milliards de dollars</strong> en bourse.</p>\n<blockquote>« Si je revenais au travail, c'était pour essayer de sauver quelque chose d'important. Pas pour l'argent. »<small>— Steve Jobs sur son retour chez Apple en 1997</small></blockquote>"},{"id":24026,"cat":"Tech","thn":"Intelligence artificielle","ths":"🤖","ti":"AlphaFold a résolu un problème vieux de 50 ans en biologie","s":"En 2020, AlphaFold 2 de DeepMind a prédit la structure 3D de presque toutes les protéines connues avec une précision quasi parfaite — un problème que la communauté scientifique pensait résoudre dans 100 ans. Pas 5.","img":"🧬","body":"<p>En biologie, la forme détermine la fonction. Chaque protéine — enzyme, anticorps, récepteur cellulaire — est une chaîne d'acides aminés qui se replie en une structure 3D précise, et c'est cette forme qui détermine ce qu'elle fait dans le corps. Comprendre la structure d'une protéine permet de comprendre les maladies, et de concevoir des médicaments.</p>\n<p>Le problème : prédire cette structure à partir de la séquence génétique prend des mois de travail expérimental en laboratoire, avec des techniques comme la cristallographie aux rayons X. En 50 ans de compétition internationale (la <strong>CASP</strong>), les meilleures équipes mondiales prédisaient les structures avec une précision de 50-60 %. Bien, mais insuffisant pour la médecine.</p>\n<p>En décembre 2020, <strong>AlphaFold 2</strong> de DeepMind (filiale de Google) a participé à la CASP et a obtenu un score moyen de <strong>92,4 sur 100</strong> — doublant les meilleures équipes humaines. Les juges de la compétition ont dit que le problème était « largement résolu ».</p>\n<p>Depuis, DeepMind a publié les structures de plus de <strong>200 millions de protéines</strong> dans une base de données ouverte à toute la communauté scientifique. Des chercheurs ont déjà utilisé AlphaFold pour identifier des cibles thérapeutiques contre la malaria, le cancer du pancréas, et des maladies rares. Ses créateurs, Demis Hassabis et John Jumper, ont reçu le <strong>Prix Nobel de Chimie 2024</strong>.</p>\n<blockquote>« AlphaFold est la contribution la plus significative de l'IA à la science jusqu'à présent. »<small>— Eric Topol, directeur du Scripps Research Translational Institute</small></blockquote>"},{"id":24027,"cat":"Fun","thn":"Le saviez-vous ?","ths":"💡","ti":"Le flamant rose est rose à cause de ce qu'il mange","s":"Les flamants roses naissent gris-blanc. Leur couleur rose vient des caroténoïdes présents dans les algues et crustacés qu'ils consomment. Un flamant nourri différemment resterait blanc.","img":"🦩"},{"id":24028,"cat":"Fun","thn":"Le saviez-vous ?","ths":"💡","ti":"Une pieuvre a trois cœurs et du sang bleu","s":"Les pieuvres ont trois cœurs : deux pompent le sang vers les branchies, un vers le reste du corps. Leur sang est bleu car il contient de l'hémocyanine (à base de cuivre) au lieu d'hémoglobine (à base de fer).","img":"🐙","body":"<p>Si les pieuvres existaient dans la mythologie grecque — et elles y figurent, sous le nom de <em>polypes</em> — les Anciens auraient eu raison de les qualifier de créatures d'un autre monde. La biologie des céphalopodes est si étrange qu'elle semble sortie d'une science-fiction.</p>\n<p>Commençons par le cœur : une pieuvre en a <strong>trois</strong>. Le cœur systémique pompe le sang oxygéné vers tout le corps. Les deux cœurs branchiaux, eux, propulsent le sang vers les branchies pour l'oxygéner. Quand une pieuvre nage (propulsion par jet d'eau), son cœur systémique s'arrête presque complètement — ce qui explique pourquoi elle préfère ramper : nager l'épuise.</p>\n<p>Leur sang est <strong>bleu</strong> — et ce n'est pas une métaphore aristocratique. Là où les vertébrés utilisent l'<em>hémoglobine</em> (fer + oxygène = rouge), les pieuvres utilisent l'<em>hémocyanine</em> (cuivre + oxygène = bleu). L'hémocyanine est moins efficace à température standard, mais excelle dans les eaux froides et à faible pression partielle d'oxygène — les fonds marins.</p>\n<p>Mais le plus stupéfiant reste leur <strong>intelligence</strong> : deux tiers des neurones d'une pieuvre ne sont pas dans le cerveau central, mais dans ses bras. Chaque bras « pense » de façon semi-autonome, capable de résoudre des problèmes localement sans consulter le cerveau. Une pieuvre à huit bras est, d'une certaine façon, un être à neuf cerveaux.</p>\n<blockquote>« Si les pieuvres vivaient plus longtemps — elles meurent après s'être reproduites — elles auraient peut-être développé une civilisation. »<small>— Peter Godfrey-Smith, philosophe et plongeur spécialisé en cognition animale</small></blockquote>"},{"id":24029,"cat":"Fun","thn":"Le saviez-vous ?","ths":"💡","ti":"Les fourmis peuvent soulever 50 fois leur poids","s":"Une fourmi ouvrière peut porter une charge représentant 10 à 50 fois son propre poids. Ramenée à l'échelle humaine, cela équivaut à soulever une voiture avec les dents.","img":"🐜"},{"id":24030,"cat":"Fun","thn":"Physique & Univers","ths":"🌌","ti":"Il y a plus d'étoiles dans l'univers que de grains de sable sur Terre","s":"L'univers observable contient environ 2 000 milliards de galaxies, chacune avec en moyenne 100 milliards d'étoiles — soit environ 200 sextillions d'étoiles (2×10²³). Les plages de la Terre n'en comptent « que » 7,5 quintillions de grains.","img":"✨"},{"id":24031,"cat":"Fun","thn":"Corps humain","ths":"🧬","ti":"Votre squelette se renouvelle entièrement tous les 10 ans","s":"Les os semblent inertes, mais ils sont en perpétuelle construction. Les ostéoclastes détruisent l'ancien tissu osseux, les ostéoblastes en créent du nouveau. À 40 ans, vous avez déjà eu quatre squelettes différents.","img":"💀","body":"<p>Contrairement à ce que leur apparence rigide suggère, vos os sont des organes vivants en perpétuel chantier. Un processus appelé <strong>remodelage osseux</strong> détruit et reconstruit en permanence le tissu osseux — à un rythme qui renouvelle l'intégralité de votre squelette en <strong>7 à 10 ans</strong>.</p>\n<p>Les acteurs de ce chantier biologique sont deux types de cellules aux rôles opposés. Les <strong>ostéoclastes</strong> sécrètent des acides et des enzymes qui dissolvent le vieux tissu osseux — on appelle cela la résorption. Les <strong>ostéoblastes</strong> construisent du nouveau tissu en déposant du collagène et des cristaux d'hydroxyapatite (phosphate de calcium) — la minéralisation.</p>\n<p>Pourquoi ce renouvellement perpétuel ? D'abord pour <strong>réparer les microfissures</strong> que les os subissent au quotidien. Ensuite pour <strong>adapter la densité osseuse</strong> aux contraintes mécaniques : les os se renforcent là où les muscles tirent, s'allègent là où ils ne sont plus sollicités. C'est pour cette raison que les astronautes perdent rapidement de la masse osseuse en apesanteur — sans gravité, pas de contrainte, donc pas de signal pour maintenir la densité.</p>\n<p>Ce système fonctionne à merveille jusqu'à environ <strong>35 ans</strong>, quand la balance penche progressivement vers la résorption. La perte osseuse s'accélère, particulièrement chez les femmes après la ménopause. L'ostéoporose n'est pas un os qui se casse — c'est un os dont la reconstruction est dépassée par la destruction.</p>\n<blockquote>« Vos os ne sont pas une armure figée. Ils vous écoutent, s'adaptent, et se racontent l'histoire de votre vie. »<small>— Sandra Shefelbine, bioingénieure spécialisée en biomécanique osseuse</small></blockquote>"},{"id":24032,"cat":"Fun","thn":"Le saviez-vous ?","ths":"💡","ti":"Cléopâtre vivait plus près de nous que des pyramides","s":"Cléopâtre VII est morte en 30 av. J.-C. Les pyramides de Gizeh ont été construites vers 2560 av. J.-C. Elle était donc plus proche de nous dans le temps (2 054 ans) que des pyramides (2 530 ans). L'Antiquité n'est pas monolithique.","img":"🏛️"},{"id":24033,"cat":"Fun","thn":"Animaux extraordinaires","ths":"🐾","ti":"Le tardigrade : l'animal le plus résistant du monde","s":"Le tardigrade — 0,5 mm — survit à -272°C, à +150°C, dans le vide de l'espace, sous 6 000 atmosphères de pression, et à des doses de radiation 1 000 fois létales pour l'homme. Il entre en cryptobiose et attend.","img":"🦠","body":"<p>Si l'apocalypse survenait demain, une créature survivrait avec une quasi-certitude absolue : le <strong>tardigrade</strong>. Cet animal microscopique de 0,1 à 1,5 mm — parfois appelé « ourson d'eau » à cause de sa démarche maladroite — est biologiquement immortel dans l'adversité.</p>\n<p>Quand les conditions deviennent hostiles, le tardigrade entre en <strong>cryptobiose</strong> : il expulse 97 % de l'eau de ses cellules, rétracte ses pattes, et devient une petite balle inerte appelée <em>tun</em>. Dans cet état, son métabolisme tombe à <strong>0,01 % de la normale</strong>. Il peut alors rester ainsi pendant des décennies.</p>\n<p>Ce qu'il peut endurer en cryptobiose défie l'entendement :<br>— <strong>-272°C</strong> : un degré au-dessus du zéro absolu<br>— <strong>+150°C</strong> : température de four à chaleur tournante<br>— Le <strong>vide spatial</strong> et ses rayonnements UV intenses<br>— <strong>6 000 atmosphères</strong> de pression (6 fois la fosse des Mariannes)<br>— Des doses de radiation de <strong>570 000 rads</strong> (une dose de 500 rads tue un humain)<br>— Déshydratation totale pendant <strong>30 ans</strong></p>\n<p>En 2007, des tardigrades ont été envoyés dans l'espace sur le satellite <strong>FOTON-M3</strong> — exposés directement au vide et au rayonnement solaire pendant 10 jours. 68 % ont survécu. Des chercheurs ont même retrouvé des tardigrades fonctionnels dans des mousses prélevées en <strong>Antarctique</strong>, congelées depuis 30 ans.</p>\n<blockquote>« Le tardigrade sera probablement le dernier animal à s'éteindre sur Terre, bien après l'humanité. »<small>— David Sloan, astrophysicien, Université d'Oxford, 2017</small></blockquote>"},{"id":24034,"cat":"Fun","thn":"Le saviez-vous ?","ths":"💡","ti":"Le son voyage 4 fois plus vite dans l'eau que dans l'air","s":"Dans l'air, le son se propage à 343 m/s. Dans l'eau, à 1 480 m/s — presque 4,5 fois plus vite. C'est pour cela que les baleines peuvent communiquer à des milliers de kilomètres de distance dans l'océan.","img":"🐋"},{"id":24035,"cat":"Fun","thn":"Histoire insolite","ths":"📜","ti":"La guerre la plus courte de l'histoire : 38 minutes","s":"Le 27 août 1896, la guerre anglo-zanzibarienne a duré entre 38 et 45 minutes. Le sultan du Zanzibar refusait d'abdiquer ; la marine britannique a bombardé le palais. C'est officiellement le conflit armé le plus court de l'histoire.","img":"⚔️"},{"id":24036,"cat":"Fun","thn":"Sciences & Nature","ths":"🔬","ti":"L'éclair est 5 fois plus chaud que la surface du Soleil","s":"Un éclair atteint une température d'environ 30 000 Kelvin — soit 5 fois la température de surface du Soleil (5 778 K). Il chauffe l'air si violemment que ce dernier se dilate de façon supersonique, créant le tonnerre.","img":"⚡"},{"id":24037,"cat":"Sport","thn":"Records & Exploits","ths":"🏆","ti":"Simone Biles défie la physique à chaque compétition","s":"Simone Biles possède des difficultés nommées à son nom — dont certains Comités Olympiques ont délibérément sous-côtés pour décourager leur imitation. Les juges craignaient que d'autres gymnastes se blessent en tentant de les copier.","img":"🤸","body":"<p>Il existe des athlètes qui repoussent les limites. Et puis il y a <strong>Simone Biles</strong>, qui semble vivre dans un sport parallèle que les autres regardent depuis les gradins. À 28 ans, elle a remporté <strong>37 médailles mondiales</strong> (23 en or) — plus que tout autre gymnaste de l'histoire, homme ou femme.</p>\n<p>La particularité de Biles n'est pas seulement sa perfection technique. C'est qu'elle réalise des éléments que personne d'autre ne tente — et que le Code de Pointage de la FIG a parfois volontairement <strong>sous-évalués</strong>. Pourquoi ? Pour ne pas inciter d'autres gymnastes moins douées physiquement à les essayer et risquer des blessures graves.</p>\n<p>Parmi les éléments portant son nom : le <strong>Biles II</strong> au sol (double salto arrière carpé avec demi-vrille), le <strong>Biles</strong> à la poutre (double salto arrière en position carpée), ou encore le <strong>Yurchenko double pike</strong> au saut — une figure que seule elle exécutait dans le monde compétitif lors de sa première réalisation en 2021. La FIG lui a attribué une valeur de H (la plus haute possible), mais certains experts estimaient qu'elle méritait encore plus.</p>\n<p>Aux JO de Paris 2024, à <strong>27 ans</strong> — un âge canonique en gymnastique — elle a décroché 3 médailles d'or et 1 d'argent, dominant une génération née après ses premiers titres mondiaux. Sa vitesse de rotation, sa puissance et son sens du rythme sont étudiés par des scientifiques qui peinent à modéliser comment un corps humain peut faire cela.</p>\n<blockquote>« Je ne me compare pas aux autres gymnasts. Je me compare à la version d'hier de moi-même. »<small>— Simone Biles, après les JO de Paris 2024</small></blockquote>"},{"id":24038,"cat":"Sport","thn":"Football","ths":"⚽","ti":"La Coupe du Monde 1950 : quand l'Uruguay a traumatisé le Brésil","s":"Le 16 juillet 1950, l'Uruguay a battu le Brésil 2-1 en finale effective devant 200 000 spectateurs à Rio. Le « Maracanazo » reste la plus grande catastrophe du football brésilien. Des témoins racontent que des hommes pleuraient dans les rues.","img":"😢","body":"<p>Il n'y a pas de finale plus attendue dans l'histoire du football. Nous sommes le <strong>16 juillet 1950</strong> au stade Maracanã de Rio de Janeiro — inauguré pour ce Mondial. Le Brésil doit simplement éviter la défaite contre l'Uruguay pour remporter le titre : un nul suffit. La victoire semble acquise.</p>\n<p>L'enceinte accueille officiellement <strong>173 850 spectateurs</strong> payants, mais les estimations réelles parlent de <strong>200 000 personnes</strong> — le record d'affluence pour un match de football, toujours debout. Le Brésil ouvre le score à la 47e minute. Les trompettes et tambours résonnent. Le titre est une formalité.</p>\n<p>Puis l'Uruguay égalise (66e). Puis marque à la <strong>79e minute</strong> par Ghiggia — buteur qui dira plus tard : « Seuls trois personnes ont fait taire le Maracanã : le pape Jean-Paul II, Frank Sinatra, et moi. » Silence de mort dans l'enceinte la plus bruyante du monde.</p>\n<p>Le coup de sifflet final provoque une catastrophe nationale. Des spectateurs s'évanouissent. Le journaliste du journal <em>O Mundo</em> avait imprimé en avance un numéro titrant « Brasil Campeão ! » — qui n'est jamais sorti. Des suicides sont rapportés dans les jours suivants. Le maillot blanc du Brésil est définitivement abandonné : c'est après ce traumatisme qu'ils adoptent le <strong>jaune</strong> et le <strong>bleu</strong>.</p>\n<blockquote>« Le Maracanazo n'est pas seulement une défaite. C'est une blessure qui ne guérira jamais complètement dans l'âme brésilienne. »<small>— Pelé, dans ses mémoires</small></blockquote>"},{"id":24039,"cat":"Sport","thn":"Marathons & Endurance","ths":"🏅","ti":"Pheidippides, le mythe du premier marathon","s":"La légende veut qu'un soldat grec nommé Pheidippides ait couru 42 km de Marathon à Athènes pour annoncer la victoire, puis soit mort. Les historiens pensent que le vrai exploit était sa course Athènes-Sparte aller-retour : 450 km en 2 jours.","img":"🏛️"},{"id":24040,"cat":"Géo","thn":"Géographie","ths":"🌍","ti":"Le Zimbabwé a utilisé 9 monnaies officielles en même temps","s":"En 2009, face à une hyperinflation qui avait atteint 89,7 sextillions de pourcent, le Zimbabwe a abandonné sa monnaie et adopté officiellement neuf devises étrangères simultanément, dont le dollar américain, l'euro, le rand et le yuan.","img":"💰","body":"<p>L'histoire de l'hyperinflation zimbabwéenne est l'une des plus vertigineuses de l'économie moderne. En <strong>novembre 2008</strong>, le taux d'inflation mensuel atteignait officiellement <strong>79,6 milliards de pourcent</strong> — soit un doublement des prix toutes les 24,7 heures. Certaines estimations économétriques suggèrent que le pic réel fut de <strong>89,7 sextillions de pourcent</strong> annualisés.</p>\n<p>La Reserve Bank du Zimbabwe imprimait des billets de plus en plus grotesques : des billets de <strong>100 000 milliards de dollars</strong> zimbabwéens ont été mis en circulation en janvier 2009. Ce billet, qui valait environ 30 centimes USD à son émission, perdait la moitié de sa valeur en quelques heures.</p>\n<p>Les causes : à partir de 2000, le président Mugabe a redistribué les terres des fermiers blancs à des sympathisants du régime souvent sans expérience agricole. La production s'est effondrée, les denrées alimentaires ont manqué, et le gouvernement a financé ses dépenses en imprimant des billets. Un cercle vicieux classique, mais poussé à l'extrême.</p>\n<p>En <strong>avril 2009</strong>, le gouvernement a officiellement suspendu le dollar zimbabwéen et autorisé l'utilisation de <strong>9 devises étrangères</strong> comme monnaie légale : dollar américain, euro, livre sterling, rand sud-africain, pula botswanais, yen japonais, yuan chinois, roupie indienne et dollar australien. Une première dans l'histoire monétaire mondiale.</p>\n<blockquote>« Quand la monnaie ne vaut plus rien, tout un système de confiance s'effondre avec elle. »<small>— Steve Hanke, économiste spécialiste des hyperinflations, Johns Hopkins University</small></blockquote>"},{"id":24041,"cat":"Géo","thn":"Lieux Extrêmes","ths":"🏔️","ti":"La Bolivie a deux capitales officielles","s":"La Bolivie est l'un des rares pays à avoir deux capitales : Sucre (capitale constitutionnelle et judiciaire) et La Paz (siège du gouvernement et du parlement, à 3 640 m d'altitude). Un compromis né d'une guerre civile en 1899.","img":"🏙️"},{"id":24042,"cat":"Tech","thn":"Histoire de la tech","ths":"💻","ti":"ENIAC : le premier ordinateur pesait 30 tonnes","s":"Inauguré en 1945 à l'Université de Pennsylvanie, ENIAC occupait une salle entière (167 m²), pesait 30 tonnes, contenait 17 468 tubes à vide et consommait 150 kW. Votre smartphone le surpasse des millions de fois.","img":"🖥️","body":"<p>En 1945, « ordinateur » désignait encore des femmes (les <em>human computers</em>) qui effectuaient des calculs balistiques à la main pour l'armée américaine. L'<strong>ENIAC</strong> — Electronic Numerical Integrator and Computer — allait changer cette réalité pour toujours.</p>\n<p>Les chiffres donnent le vertige : <strong>167 m²</strong> de salle (la taille d'un appartement familial), <strong>30 tonnes</strong>, <strong>17 468 tubes à vide</strong>, <strong>70 000 résistances</strong>, <strong>10 000 condensateurs</strong>, et une consommation électrique de <strong>150 kilowatts</strong> — les habitants du quartier remarquaient que les lumières baissaient légèrement quand il tournait à pleine puissance.</p>\n<p>Ce monstre de métal pouvait effectuer <strong>5 000 additions par seconde</strong> — une révolution absolue pour l'époque, où les calculatrices mécaniques peinaient à quelques opérations par minute. Sa première mission : calculer des tables de tir pour l'artillerie de l'US Army. Sa deuxième mission (secrète à l'époque) : des calculs pour le programme nucléaire de Los Alamos.</p>\n<p>La programmation d'ENIAC était un travail physique : il fallait recâbler manuellement les connexions pour chaque nouveau programme — une opération qui prenait des jours. Ce sont six femmes mathématiciennes — <strong>Kay McNulty, Jean Jennings, Marlyn Wescoff, Ruth Lichterman, Betty Snyder et Frances Bilas</strong> — qui ont développé les premiers programmes, un travail longtemps sous-reconnu.</p>\n<p>Votre smartphone Apple M4 effectue environ <strong>38 000 milliards d'opérations par seconde</strong>, pèse 174 grammes, et tient dans votre poche. En 80 ans, la puissance de calcul par gramme a augmenté d'un facteur supérieur à un milliard.</p>"},{"id":24043,"cat":"Fun","thn":"Le saviez-vous ?","ths":"💡","ti":"Oxford est plus vieille que les Aztèques","s":"L'enseignement à Oxford a commencé vers 1096 et s'est développé rapidement après 1167. L'empire aztèque, lui, n'a été fondé qu'en 1428. Quand Tenochtitlán était encore un marécage, Oxford conférait déjà des diplômes depuis trois siècles.","img":"🎓"},{"id":24044,"cat":"Fun","thn":"Le saviez-vous ?","ths":"💡","ti":"Votre corps contient assez d'ADN pour aller à Pluton et revenir","s":"Chaque cellule humaine contient environ 2 mètres d'ADN déroulé. Avec 37 000 milliards de cellules, l'ADN total de votre corps mesure environ 74 milliards de km — soit 246 allers-retours Terre-Pluton.","img":"🧬"}];

const CATCOUNT={}; CARDS.forEach(c=>CATCOUNT[c.cat]=(CATCOUNT[c.cat]||0)+1);
const ACTIVECATS=CATORDER.filter(k=>CATCOUNT[k]>0);

/* ---- profile / state ---- */
const LVLS=["🥚 Novice","🐣 Curieux","🐥 Éclairé","🦉 Sage","🏆 Philosophe","👑 Maître","🌟 Légende"];
const LVLSTEP=220;
function levelInfo(xp){var i=Math.min(LVLS.length-1,Math.floor(xp/LVLSTEP));return{i:i,name:LVLS[i],inLvl:xp-i*LVLSTEP,need:LVLSTEP,pct:Math.min(100,Math.round(((xp-i*LVLSTEP)/LVLSTEP)*100))};}
function today(){return new Date().toISOString().slice(0,10);}
function ydayStr(){var d=new Date();d.setDate(d.getDate()-1);return d.toISOString().slice(0,10);}

let S={v:"home",profile:null,filter:"all",det:null,qz:null,reels:false,reelIdx:0,lichUrl:null,libtab:"fav",
  xp:0,seen:new Set(),bk:new Set(),reads:new Set(),cats:new Set(),react:{},
  streak:0,lastDay:"",goalDate:"",goalCount:0,goalTarget:5,qAns:0,qOK:0,ach:new Set(),feedN:24,_pv:null};
const PKEY=id=>"philae_v2_"+id;
function loadProfile(id){try{var d=localStorage.getItem(PKEY(id));return d?JSON.parse(d):null;}catch(e){return null;}}
function saveProfile(){if(!S.profile)return;try{localStorage.setItem(PKEY(S.profile),JSON.stringify({
  xp:S.xp,seen:[...S.seen],bk:[...S.bk],reads:[...S.reads],cats:[...S.cats],react:S.react,
  streak:S.streak,lastDay:S.lastDay,goalDate:S.goalDate,goalCount:S.goalCount,qAns:S.qAns,qOK:S.qOK,ach:[...S.ach]
}));}catch(e){}}
function initProfile(id){
  var d=loadProfile(id)||{};
  S.profile=id;
  S.xp=d.xp||0;S.seen=new Set(d.seen||[]);S.bk=new Set(d.bk||[]);S.reads=new Set(d.reads||[]);
  S.cats=new Set(d.cats||[]);S.react=d.react||{};S.qAns=d.qAns||0;S.qOK=d.qOK||0;S.ach=new Set(d.ach||[]);
  S.goalTarget=5;
  // streak
  var t=today();
  if(d.lastDay===t){S.streak=d.streak||1;}
  else if(d.lastDay===ydayStr()){S.streak=(d.streak||0)+1;}
  else{S.streak=1;}
  S.lastDay=t;
  // daily goal
  if(d.goalDate===t){S.goalDate=t;S.goalCount=d.goalCount||0;}else{S.goalDate=t;S.goalCount=0;}
  saveProfile();
}

/* ---- achievements ---- */
const ACH=[
 {id:"first",e:"🌱",t:"Premier pas",d:"Lire 1 carte",f:()=>S.seen.size>=1},
 {id:"ten",e:"📚",t:"Curieux",d:"10 cartes lues",f:()=>S.seen.size>=10},
 {id:"fifty",e:"🔥",t:"Affamé",d:"50 cartes lues",f:()=>S.seen.size>=50},
 {id:"hundred",e:"💯",t:"Insatiable",d:"100 cartes lues",f:()=>S.seen.size>=100},
 {id:"reader",e:"📖",t:"Lecteur",d:"10 articles complets",f:()=>S.reads.size>=10},
 {id:"coll",e:"🔖",t:"Collectionneur",d:"10 favoris",f:()=>S.bk.size>=10},
 {id:"explorer",e:"🧭",t:"Explorateur",d:"8 catégories",f:()=>S.cats.size>=8},
 {id:"streak3",e:"⚡",t:"Régulier",d:"Série de 3 jours",f:()=>S.streak>=3},
 {id:"streak7",e:"🌟",t:"Assidu",d:"Série de 7 jours",f:()=>S.streak>=7},
 {id:"quiz",e:"🧠",t:"Cerveau",d:"20 bonnes réponses",f:()=>S.qOK>=20},
 {id:"sage",e:"🦉",t:"Sage",d:"Niveau Sage (660 XP)",f:()=>S.xp>=660},
 {id:"master",e:"👑",t:"Maître",d:"1100 XP",f:()=>S.xp>=1100}
];
function checkAch(){var nu=[];ACH.forEach(a=>{if(!S.ach.has(a.id)&&a.f()){S.ach.add(a.id);nu.push(a);}});if(nu.length){toast("🏆 Succès débloqué : "+nu[0].t);saveProfile();}}

/* ---- helpers ---- */
const $=document.body;
function esc(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function toast(msg){var t=document.getElementById("toast");if(!t)return;t.innerHTML=msg;t.classList.add("show");clearTimeout(window._tt);window._tt=setTimeout(()=>t.classList.remove("show"),2200);}
function addXP(n){S.xp+=n;}
function markSeen(id){if(S.seen.has(id))return;S.seen.add(id);addXP(10);var c=CARDMAP[id];if(c)S.cats.add(c.cat);
  if(S.goalDate!==today()){S.goalDate=today();S.goalCount=0;}
  if(S.goalCount<S.goalTarget){S.goalCount++; if(S.goalCount===S.goalTarget)toast("🎯 Objectif du jour atteint ! +50 XP"),addXP(50);}
  saveProfile();checkAch();updateChips();}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
let FEED=shuffle(CARDS);
function feedList(){var f=S.filter==="all"?FEED:FEED.filter(c=>c.cat===S.filter);return f;}

/* ====================== RENDER ====================== */
function R(){
  if(!S.profile){$.innerHTML=onboarding();return;}
  if(S.lichUrl){$.innerHTML=lichOverlay();return;}
  var h='<div class="app" id="app">';
  h+=topbar();
  if(S.v==="explore")h+=viewExplore();
  else if(S.v==="quiz")h+=viewQuizHub();
  else if(S.v==="library")h+=viewLibrary();
  else if(S.v==="profile")h+=viewProfile();
  else if(S.v==="chess")h+=viewChess();
  else h+=viewHome();
  h+='</div>';
  h+=nav();
  if(S.reels)h+=viewReels();
  if(S.det!=null)h+=reader(S.det);
  if(S.qz)h+=quizModal();
  h+='<div class="toast" id="toast"></div>';
  $.innerHTML=h;
  if(S._pv!==S.v&&!S.reels&&S.det==null){window.scrollTo(0,0);S._pv=S.v;}
  afterRender();
}

function onboarding(){
  var h='<div class="onb">';
  h+='<img class="logo" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR23VyPCWAZQTRlY0cj8nc1ToHtazzWusGBeg&s">';
  h+='<h1 class="sf" style="font-size:46px;font-weight:600;margin-top:18px;letter-spacing:-.03em">Philae</h1>';
  h+='<p style="color:var(--ink3);font-size:13.5px;margin:6px 0 4px;font-weight:500">La culture qui remplace le scroll vide</p>';
  h+='<p style="color:var(--ink4);font-size:11.5px;margin-bottom:30px">'+CARDS.length+' savoirs · '+VIDEOS.length+' vidéos · '+QZ.length+' quiz · '+ACTIVECATS.length+' univers</p>';
  h+='<p style="font-size:11px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin-bottom:14px">Choisis ton profil</p>';
  h+='<div style="display:flex;flex-direction:column;gap:10px;width:100%;max-width:330px">';
  PROFILES.forEach(p=>{var sv=loadProfile(p.id);var xp=sv?(sv.xp||0):0;
    h+='<button class="prof" onclick="initProfile(\''+p.id+'\');S.v=\'home\';R()"><div class="pe">'+p.emoji+'</div>'+
       '<div style="flex:1;text-align:left"><div style="font-weight:700;font-size:15px">'+p.name+'</div>'+
       '<div style="font-size:11px;color:var(--ink4)">'+(sv?levelInfo(xp).name+' · '+xp+' XP':'Nouveau voyage')+'</div></div>'+
       (sv?'<span style="font-size:11px;font-weight:700;color:var(--gold)">Reprendre →</span>':'<span style="font-size:18px;color:var(--ink4)">→</span>')+'</button>';
  });
  h+='</div></div>';
  return h;
}

function topbar(){
  var p=PROFILES.find(x=>x.id===S.profile)||{emoji:"👤",name:"Philae"};
  var lv=levelInfo(S.xp);
  return '<div class="topbar">'+
   '<button class="tb-av" onclick="if(confirm(\'Changer de profil ?\')){saveProfile();S.profile=null;R();}">'+p.emoji+'</button>'+
   '<div style="flex:1;min-width:0"><div class="tb-name">'+p.name+'</div><div class="tb-sub">'+lv.name+'</div></div>'+
   '<div class="chip" data-streak><span class="fl">🔥</span>'+S.streak+'</div>'+
   '<div class="chip" style="color:var(--gold)" data-xp>⚡ '+S.xp+'</div>'+
   '<button class="iconbtn" style="width:38px;height:38px" onclick="S.v=\'library\';R()">🔖</button>'+
   '</div>';
}
function updateChips(){var x=document.querySelector('[data-xp]');if(x)x.innerHTML='⚡ '+S.xp;var s=document.querySelector('[data-streak]');if(s)s.innerHTML='<span class="fl">🔥</span>'+S.streak;}

/* ---------- HOME ---------- */
function ring(pct,val){var r=24,c=2*Math.PI*r,off=c*(1-pct/100);
  return '<div class="ringwrap"><svg width="54" height="54"><circle class="rc rbg" cx="27" cy="27" r="'+r+'"/><circle class="rc rfg" cx="27" cy="27" r="'+r+'" stroke-dasharray="'+c+'" stroke-dashoffset="'+off+'"/></svg><div class="rtxt">'+val+'</div></div>';}

function viewHome(){
  var h='';
  // daily goal
  var gc=S.goalDate===today()?S.goalCount:0;var pct=Math.min(100,Math.round(gc/S.goalTarget*100));
  h+='<div class="goal rv"><div>'+ring(pct,gc+'/'+S.goalTarget)+'</div>'+
     '<div style="flex:1"><div style="font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)">Objectif du jour</div>'+
     '<div class="sf" style="font-size:19px;font-weight:600;line-height:1.15;margin:2px 0">'+(gc>=S.goalTarget?"Bravo, c'est fait ! 🎉":"Lis "+(S.goalTarget-gc)+" savoir"+(S.goalTarget-gc>1?"s":"")+" de plus")+'</div>'+
     '<div style="font-size:11px;color:var(--ink3)">Série de <b>'+S.streak+' jour'+(S.streak>1?'s':'')+'</b> 🔥 · '+S.seen.size+' lus au total</div></div></div>';
  // carte du jour
  var dayIdx=parseInt(today().replace(/-/g,""))%CARDS.length;var cd=CARDS[dayIdx];
  h+='<div class="sec"><h2 class="sf">Carte du jour</h2></div>';
  h+='<div class="wrap rv">'+featured(cd)+'</div>';
  // filter chips
  h+='<div class="sec" style="padding-bottom:2px"><h2 class="sf">Pour toi</h2></div>';
  h+=chips();
  // feed
  h+='<div id="feed">';
  var list=feedList();var n=Math.min(S.feedN,list.length);
  for(var i=0;i<n;i++){h+=postHTML(list[i],i);
    if(i===3)h+=interQuiz();
    if(i===9)h+=interFact();
    if(i>0&&i%16===0)h+=interQuiz();
    if(i>0&&i%11===0)h+=interFact();
  }
  h+='</div>';
  if(n<list.length)h+='<div id="sentinel" style="height:60px;display:flex;align-items:center;justify-content:center"><div class="skel" style="width:160px;height:14px"></div></div>';
  else h+='<div class="empty"><div class="ee">🏛️</div><p class="sf" style="font-size:20px;color:var(--ink)">Tu as tout exploré ici</p><p style="font-size:12px;margin-top:4px">Change de catégorie ou reviens demain pour ta série 🔥</p></div>';
  return h;
}
function featured(c){
  var ph=(CAT[c.cat]||{}).ph;
  return '<div class="pc" onclick="openCard('+c.id+')" style="cursor:pointer">'+
    '<div class="hero" style="aspect-ratio:16/9"><div class="im lzy" data-bg="'+imgUrl(ph,720)+'" style="background-image:linear-gradient(135deg,'+c.accent+'33,'+c.accent+'11)"></div><div class="ov"></div>'+
    '<span class="emoji">'+c.img+'</span>'+
    '<div class="cap"><span class="tag" style="background:'+c.accent+'cc;color:#fff;margin-bottom:8px">'+(CAT[c.cat]||{}).n+'</span><h3 class="sf">'+esc(c.ti)+'</h3></div></div>'+
    '<div class="pc-pad"><p class="s">'+esc(c.s)+'</p>'+(c.body?'<div class="more">Lire →</div>':'')+'</div></div>';
}
function chips(){
  var h='<div class="chips">';
  h+='<button class="chipf'+(S.filter==="all"?" on":"")+'" onclick="setFilter(\'all\')">✦ Tout</button>';
  ACTIVECATS.forEach(k=>{h+='<button class="chipf'+(S.filter===k?" on":"")+'" onclick="setFilter(\''+k+'\')">'+CAT[k].e+' '+CAT[k].n+'</button>';});
  h+='</div>';return h;
}
function setFilter(f){S.filter=f;S.feedN=24;R();window.scrollTo({top:0,behavior:'smooth'});}

/* ---------- POST CARD ---------- */
function postHTML(c,i){
  var isB=S.bk.has(c.id),exp=S.seen.has("e"+c.id),hasBody=c.body&&c.body.length>0;
  var rs=S.react[c.id]||{};
  var h='<div class="post rv" data-cid="'+c.id+'">';
  h+='<div class="post-head"><div class="av" style="background:'+c.accent+'18;border-color:'+c.accent+'44">'+c.emo+'</div>'+
     '<div style="flex:1;min-width:0"><div class="ph-name">'+esc(c.src)+'</div><div class="ph-cat">'+(CAT[c.cat]||{}).e+' '+(CAT[c.cat]||{}).n+'</div></div>'+
     '<button class="bk'+(isB?' on':'')+'" onclick="toggleBk('+c.id+',this)">'+(isB?'🔖':'🏷️')+'</button></div>';
  // card body — vary layout
  if(c.video){
    h+='<div class="pc"><div class="vid"><span class="vbadge">▶ VIDÉO</span><iframe loading="lazy" src="https://www.youtube.com/embed/'+c.video+'?playsinline=1&rel=0&modestbranding=1" allow="accelerometer;clipboard-write;encrypted-media;gyroscope;picture-in-picture" allowfullscreen></iframe></div>'+
       '<div class="pc-pad"><h3 class="sf" style="font-size:18px">'+esc(c.ti)+'</h3><p class="s" style="margin-top:5px;font-size:13px">'+esc(c.s)+'</p>'+
       '<div class="more" onclick="openReelOf('+c.id+')">▶ Mode plein écran</div></div></div>';
  } else if(i%4===0){ // hero image
    var ph=(CAT[c.cat]||{}).ph;
    h+='<div class="pc" onclick="openCard('+c.id+')"><div class="hero"><div class="im lzy" data-bg="'+imgUrl(ph,640)+'" style="background-image:linear-gradient(135deg,'+c.accent+'33,'+c.accent+'11)"></div><div class="ov"></div><span class="emoji">'+c.img+'</span><div class="cap"><h3 class="sf">'+esc(c.ti)+'</h3></div></div>'+
       '<div class="pc-pad"><p class="s">'+esc(c.s)+'</p>'+bodyToggle(c,exp,hasBody)+'</div></div>';
  } else if(i%4===2&&c.s.length<95&&!hasBody){ // quote style for short facts
    h+='<div class="pc qcard" onclick="openCard('+c.id+')"><div class="qm">“</div><h3 class="sf">'+esc(c.ti)+'</h3><p class="s" style="margin-top:10px">'+esc(c.s)+'</p></div>';
  } else { // standard
    h+='<div class="pc" onclick="openCard('+c.id+')"><div class="pc-pad"><span class="tag" style="background:'+c.accent+'14;color:'+c.accent+';margin-bottom:9px">'+c.img+' '+(CAT[c.cat]||{}).n+'</span>'+
       '<h3 class="sf">'+esc(c.ti)+'</h3><p class="s">'+esc(c.s)+'</p>'+bodyToggle(c,exp,hasBody)+'</div></div>';
  }
  // reactions
  h+='<div class="acts">'+
     reactBtn(c.id,'👍',rs)+reactBtn(c.id,'❤️',rs)+reactBtn(c.id,'🤯',rs)+
     '<button class="react sp" onclick="shareCard('+c.id+')">↗</button>'+
     '<button class="react" onclick="toggleBk('+c.id+',this.closest(\'.post\').querySelector(\'.bk\'))">'+(isB?'🔖':'🏷️')+'</button></div>';
  h+='</div>';
  return h;
}
function bodyToggle(c,exp,hasBody){
  if(!hasBody)return '';
  if(exp)return '<div class="article" style="margin-top:12px;border-top:1px solid var(--line2);padding-top:12px;font-size:14.5px">'+c.body+'</div><div class="more" onclick="event.stopPropagation();collapse('+c.id+')">Réduire ↑</div>';
  return '<div class="more" onclick="event.stopPropagation();openCard('+c.id+')">Lire l\'article →</div>';
}
function reactBtn(id,emo,rs){var on=rs[emo];return '<button class="react'+(on?' on':'')+'" onclick="react('+id+',\''+emo+'\',this)">'+emo+'</button>';}

function interQuiz(){var qi=Math.floor(Math.random()*QZ.length);var q=QZ[qi];
  return '<div class="inter rv"><div class="inter-q"><div style="font-size:26px">🧠</div><div style="font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;opacity:.7;margin-top:4px">Quiz éclair</div>'+
    '<div class="qz-q">'+esc(q.q)+'</div><button class="btn" style="background:rgba(255,255,255,.16);color:#F3E7CF;border:1px solid rgba(255,255,255,.25)" onclick="S.qz={i:'+qi+',a:null};R()">Répondre →</button></div></div>';}
function interFact(){var f=CARDS[Math.floor(Math.random()*CARDS.length)];
  return '<div class="inter rv"><div class="inter-fact"><div class="ttl">💡 Le saviez-vous</div><div class="sf" style="font-size:16px;line-height:1.3;color:var(--ink);margin-bottom:4px">'+esc(f.ti)+'</div><p style="font-size:12.5px;color:var(--ink3);line-height:1.55">'+esc(f.s)+'</p></div></div>';}

/* ---------- interactions ---------- */
function openCard(id){var c=CARDMAP[id];if(!c)return;markSeen(id);if(c.body){S.det=id;R();}else{toast("✦ +10 XP");updateChips();}}
function collapse(id){S.seen.delete("e"+id);R();}
function toggleBk(id,el){if(S.bk.has(id)){S.bk.delete(id);}else{S.bk.add(id);addXP(3);}saveProfile();checkAch();
  document.querySelectorAll('.post[data-cid="'+id+'"] .bk').forEach(b=>{b.innerHTML=S.bk.has(id)?'🔖':'🏷️';b.classList.toggle('on',S.bk.has(id));});
  if(S.v==="library")R();updateChips();}
function react(id,emo,el){S.react[id]=S.react[id]||{};if(S.react[id][emo]){delete S.react[id][emo];el.classList.remove('on');}else{S.react[id][emo]=1;el.classList.add('on','burst');if(emo==='🤯')addXP(5);setTimeout(()=>el.classList.remove('burst'),400);}saveProfile();updateChips();}
function shareCard(id){var c=CARDMAP[id];var txt=c.ti+" — "+c.s+"\n\nvia Philae";if(navigator.share){navigator.share({title:c.ti,text:txt}).catch(()=>{});}else{navigator.clipboard&&navigator.clipboard.writeText(txt);toast("📋 Copié dans le presse-papier");}}

/* ---------- READER ---------- */
function reader(id){var c=CARDMAP[id];if(!c)return'';if(!S.reads.has(id)){S.reads.add(id);addXP(15);saveProfile();checkAch();}
  var rel=CARDS.filter(x=>x.cat===c.cat&&x.id!==c.id&&x.body);rel=shuffle(rel).slice(0,3);
  var ph=(CAT[c.cat]||{}).ph;
  var h='<div class="reader" id="reader" onscroll="rdProg()"><div class="rd-prog" id="rdprog"></div>';
  h+='<div class="rd-bar"><button class="iconbtn" onclick="S.det=null;R()">←</button><div style="flex:1"></div>'+
     '<button class="iconbtn" onclick="toggleBk('+c.id+')">'+(S.bk.has(c.id)?'🔖':'🏷️')+'</button>'+
     '<button class="iconbtn" onclick="shareCard('+c.id+')">↗</button></div>';
  if(c.video){h+='<div class="vid" style="aspect-ratio:16/9;max-width:620px;margin:0 auto"><iframe src="https://www.youtube.com/embed/'+c.video+'?playsinline=1&rel=0&autoplay=1" allow="autoplay;encrypted-media;picture-in-picture" allowfullscreen style="width:100%;height:100%;border:0"></iframe></div>';}
  else{h+='<div class="hero" style="aspect-ratio:16/9;max-width:620px;margin:0 auto"><div class="im lzy" data-bg="'+imgUrl(ph,900)+'" style="background-image:linear-gradient(135deg,'+c.accent+'33,'+c.accent+'11)"></div><div class="ov" style="background:linear-gradient(to top,var(--bg),transparent 70%)"></div><span class="emoji" style="font-size:34px">'+c.img+'</span></div>';}
  h+='<div class="rd-body"><span class="tag" style="background:'+c.accent+'18;color:'+c.accent+'">'+c.emo+' '+esc(c.src)+'</span>';
  h+='<h1>'+esc(c.ti)+'</h1><div class="rd-meta">'+(CAT[c.cat]||{}).e+' '+(CAT[c.cat]||{}).n+' · lecture '+Math.max(1,Math.round(c.body.length/900))+' min</div>';
  h+='<div class="article">'+(c.body||('<p>'+esc(c.s)+'</p>'))+'</div>';
  // reactions
  var rs=S.react[c.id]||{};
  h+='<div class="acts" style="margin-top:20px">'+reactBtn(c.id,'👍',rs)+reactBtn(c.id,'❤️',rs)+reactBtn(c.id,'🤯',rs)+'</div>';
  if(rel.length){h+='<div class="sec" style="padding-left:0;padding-right:0"><h2 class="sf" style="font-size:18px">À lire ensuite</h2></div>';
    rel.forEach(r=>{h+='<div class="row" style="margin:0 0 9px" onclick="S.det='+r.id+';R();document.getElementById(\'reader\')&&document.getElementById(\'reader\').scrollTo(0,0)"><div class="rico" style="background:'+r.accent+'18">'+r.img+'</div><div style="flex:1"><div style="font-weight:700;font-size:13.5px;line-height:1.2">'+esc(r.ti)+'</div><div style="font-size:11px;color:var(--ink4)">'+esc(r.src)+'</div></div><span style="color:var(--ink4)">→</span></div>';});
  }
  h+='</div></div>';
  return h;
}
function rdProg(){var r=document.getElementById('reader');var p=document.getElementById('rdprog');if(!r||!p)return;var m=r.scrollHeight-r.clientHeight;p.style.width=(m>0?(r.scrollTop/m*100):0)+'%';}

/* ---------- REELS ---------- */
function openReelOf(id){var idx=VIDEOS.findIndex(v=>v.id===id);S.reelIdx=Math.max(0,idx);S.reels=true;R();}
function viewReels(){

  VIDEOS.forEach((v,i)=>{
    h+='<div class="reel" data-vid="'+v.video+'" data-rid="'+v.id+'"><iframe data-src="https://www.youtube.com/embed/'+v.video+'?playsinline=1&rel=0&modestbranding=1&enablejsapi=1" allow="autoplay;encrypted-media;picture-in-picture" allowfullscreen></iframe>';

       '<button onclick="shareCard('+v.id+')"><span class="rsi">↗</span></button></div>';
    h+='<div class="reel-ov"><div class="src">'+v.emo+' '+esc(v.src)+'  ·  '+(CAT[v.cat]||{}).e+' '+(CAT[v.cat]||{}).n+'</div><h3>'+esc(v.ti)+'</h3><p>'+esc(v.s)+'</p></div></div>';

  });

  h+='<div class="row" onclick="S.qz={i:Math.floor(Math.random()*QZ.length),a:null};R()"><div class="rico" style="background:'+CAT.Philo.c+';color:#fff">🧠</div><div style="flex:1"><div style="font-weight:700;font-size:14px">Quiz aléatoire</div><div style="font-size:11px;color:var(--ink4)">'+QZ.length+' questions · gagne de l\'XP</div></div><span style="color:var(--ink4)">→</span></div>';
  h+='<div class="row" onclick="S.v=\'library\';R()"><div class="rico" style="background:var(--gold);color:#fff">🔖</div><div style="flex:1"><div style="font-weight:700;font-size:14px">Mes favoris</div><div style="font-size:11px;color:var(--ink4)">'+S.bk.size+' sauvegardés</div></div><span style="color:var(--ink4)">→</span></div>';

function searchR(q){
  var box=document.getElementById('sres');var main=document.getElementById('exmain');if(!box)return;
  q=(q||"").trim().toLowerCase();
  if(q.length<2){box.innerHTML='';if(main)main.style.display='';return;}
  if(main)main.style.display='none';
  var res=CARDS.filter(c=>(c.ti+' '+c.s+' '+c.src+' '+c.cat).toLowerCase().indexOf(q)>=0).slice(0,40);
  var h='<div class="sec"><h2 class="sf" style="font-size:17px">'+res.length+' résultat'+(res.length>1?'s':'')+'</h2></div>';
  if(!res.length)h+='<div class="empty"><div class="ee">🔍</div><p>Aucun résultat pour "'+esc(q)+'"</p></div>';
  res.forEach(r=>{h+='<div class="row" onclick="openCard('+r.id+')"><div class="rico" style="background:'+r.accent+'18">'+r.img+'</div><div style="flex:1;min-width:0"><div style="font-weight:700;font-size:13.5px;line-height:1.2">'+esc(r.ti)+'</div><div style="font-size:11px;color:var(--ink4)">'+esc(r.src)+' · '+(CAT[r.cat]||{}).n+'</div></div>'+(r.video?'<span>🎬</span>':'<span style="color:var(--ink4)">→</span>')+'</div>';});
  box.innerHTML=h;
}

function startQuizFrom(i){S.qz={i:i%QZ.length,a:null};R();}
function quizModal(){var q=QZ[S.qz.i];
  var h='<div class="modal" onclick="if(S.qz.a!==null){S.qz=null;R();}"><div class="sheet" onclick="event.stopPropagation()"><div class="grab"></div>';
  h+='<div style="text-align:center"><span style="font-size:30px">🧠</span><div style="font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin:6px 0">Question '+(S.qz.i+1)+' / '+QZ.length+'</div></div>';
  h+='<h3 class="sf" style="text-align:center;font-size:21px;font-weight:600;line-height:1.3;margin:6px 0 18px">'+esc(q.q)+'</h3>';
  q.o.forEach((o,j)=>{var cls="";if(S.qz.a!==null){if(j===q.c)cls=" ok";else if(j===S.qz.a)cls=" no";}
    h+='<button class="qz-opt'+cls+'" onclick="answerQuiz('+j+')"><span class="ki">'+String.fromCharCode(65+j)+'</span>'+esc(o)+'</button>';});
  if(S.qz.a!==null){h+='<div style="margin-top:6px;padding:13px 15px;border-radius:14px;background:'+(S.qz.a===q.c?'rgba(76,154,82,.1)':'rgba(181,84,74,.08)')+';font-size:13px;line-height:1.5;color:var(--ink2)"><b>'+(S.qz.a===q.c?'✅ Exact ! +25 XP':'❌ Raté.')+'</b> '+esc(q.x)+'</div>';
    h+='<div style="display:flex;gap:8px;margin-top:14px"><button class="btn btn-gold" style="flex:1" onclick="S.qz={i:('+S.qz.i+'+1)%'+QZ.length+',a:null};R()">Suivante →</button><button class="btn" onclick="S.qz=null;R()">Fermer</button></div>';}

function answerQuiz(j){if(S.qz.a!==null)return;S.qz.a=j;S.qAns++;if(j===QZ[S.qz.i].c){S.qOK++;addXP(25);}saveProfile();checkAch();updateChips();R();}

/* ---------- AFTER RENDER (observers) ---------- */
function afterRender(){
  // lazy images
  var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){var bg=e.target.dataset.bg;if(bg){e.target.style.backgroundImage="url('"+bg+"'),"+(e.target.style.backgroundImage||"linear-gradient(135deg,#E7DCC9,#EFE7D8)");e.target.removeAttribute('data-bg');}io.unobserve(e.target);}});},{rootMargin:'300px'});
  document.querySelectorAll('.lzy[data-bg]').forEach(el=>io.observe(el));
  // reveal
  var rv=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');rv.unobserve(e.target);}});},{rootMargin:'0px 0px -8% 0px'});
  document.querySelectorAll('.rv').forEach(el=>rv.observe(el));
  // seen + xp
  var sv=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){var id=+e.target.dataset.cid;if(id)markSeen(id);}});},{threshold:.55});
  document.querySelectorAll('[data-cid]').forEach(el=>sv.observe(el));
  // infinite feed
  var sen=document.getElementById('sentinel');
  if(sen){var fo=new IntersectionObserver(function(es){if(es[0].isIntersecting){S.feedN+=18;fo.disconnect();renderMoreFeed();}});fo.observe(sen);}
  // reels autoplay on scroll
  if(S.reels){
    var ro=new IntersectionObserver(function(es){es.forEach(function(e){var ifr=e.target.querySelector('iframe');if(!ifr)return;
      if(e.isIntersecting&&e.intersectionRatio>0.6){if(!ifr.src){ifr.src=ifr.dataset.src+'&autoplay=1&mute=1';}}
      else{if(ifr.src){ifr.src='';}}});},{threshold:[0,0.6,1]});
    document.querySelectorAll('.reel').forEach(el=>ro.observe(el));
    var rc=document.getElementById('reels');if(rc&&VIDEOS[S.reelIdx]){var tgt=rc.querySelector('.reel[data-rid="'+VIDEOS[S.reelIdx].id+'"]');if(tgt)setTimeout(()=>tgt.scrollIntoView(),30);}
  }
}
function renderMoreFeed(){ // re-render feed area only would be complex; simplest: full R but keep scroll
  var y=window.scrollY;R();window.scrollTo(0,y);
}
