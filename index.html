{id:3005,th:"history",ti:"Le pont de Mostar : quand détruire un pont c'est détruire un peuple",s:"9 novembre 1993. Les obus frappent le Stari Most — un pont ottoman de 427 ans. Il s'effondre. Ce n'était pas juste un pont. C'était un lien entre deux communautés.",img:"🌉",body:`<p>Le Stari Most de Mostar, construit en 1566, reliait depuis 427 ans la rive musulmane à la rive croate.</p><p>Le 9 novembre 1993, après deux jours de bombardements ciblés, le pont s'effondre.</p><p>Pourquoi est-ce un crime de guerre ? Un pont n'est pas une infrastructure — c'est un <strong>symbole de connexion</strong>. Le détruire, c'est dire : il n'y a plus de lien possible.</p><p>Reconstruit en 2004 avec les pierres d'origine. Le pont physique est reconstruit. Le pont mental, non.</p><blockquote>"Celui qui détruit un pont détruit plus qu'un pont."<small>— Proverbe bosniaque</small></blockquote>`},
{id:4000,th:"adler",ti:"Les 3 problèmes inévitables de la vie",s:"Adler dit que TOUS les problèmes humains viennent d'un échec face à 3 problèmes que personne ne peut éviter. Tu peux fuir, mais ils te rattraperont.",img:"🧩",body:`<p>Adler identifie <strong>trois problèmes inévitables</strong> :</p><p><strong>1. L'attitude envers les autres</strong> — la vie en communauté.<br><strong>2. La profession</strong> — ta contribution au monde.<br><strong>3. L'amour</strong> — la relation intime.</p><p>Toute névrose, dépression, addiction est un échec face à l'un de ces trois. Le workaholic fuit l'amour. Le narcissique fuit la coopération.</p><p>La névrose est un <strong>style de vie erroné</strong> — une stratégie d'évitement élaborée dans l'enfance.</p><blockquote>"Toute analyse d'une aberration psychique dévoile un défaut du sentiment social."<small>— Adler, Le Sens de la vie</small></blockquote>`},
{id:4001,th:"adler",ti:"Le monde fictif de l'enfant gâté",s:"L'enfant gâté a appris que le monde tourne autour de lui. Quand la réalité le contredit — et elle le fera — il s'effondre. LA cause principale des névroses chez l'adulte.",img:"👶",body:`<p><strong>"L'enfant gâté a développé un style de vie basé sur l'attente d'être servi."</strong></p><p>Des parents résolvent TOUS ses problèmes. L'enfant apprend que pleurer = obtenir, que la passivité = le confort.</p><p>Puis il grandit. Le monde ne tourne plus autour de lui. L'adulte gâté est <strong>totalement démuni</strong> : son style de vie (je reçois) est en collision avec la réalité (il faut donner pour recevoir).</p><p>Résultat : névrose, anxiété, procrastination, narcissisme.</p><blockquote>"Un monde où l'on reçoit sans donner, où l'on est aimé sans aimer."<small>— Adler, Ch. 9</small></blockquote>`},
{id:4002,th:"adler",ti:"Le style de vie se forge avant 5 ans",s:"Avant 5 ans, tu as DÉJÀ créé la loi qui gouvernera ta vie entière. Mais tu peux le changer. Si tu le comprends.",img:"🧒",body:`<p>Adler appelle ça <strong>l'art créateur de l'enfant</strong>. Avant 5 ans, l'enfant <strong>construit un style de vie</strong> qui gouvernera toute sa vie.</p><p>Ce n'est pas un déterminisme. L'enfant est un <strong>créateur actif</strong> qui interprète ses expériences.</p><p>Les <strong>premiers souvenirs</strong> sont la clé : ce qu'on CHOISIT de retenir révèle le style de vie.</p><p>La bonne nouvelle : le style de vie peut être changé. D'abord le comprendre, puis le confronter à ses erreurs.</p><blockquote>"La singularité de l'individu ne se laisse pas saisir dans une courte formule."<small>— Adler, Le Sens de la vie</small></blockquote>`},
{id:4100,th:"dalio",ti:"Douleur + Réflexion = Progrès",s:"Ray Dalio a bâti le plus grand hedge fund du monde avec UNE formule : Pain + Reflection = Progress. Chaque erreur est un cadeau. À condition de la regarder en face.",img:"📊",body:`<p>Bridgewater Associates. Le plus grand hedge fund du monde. Fondé dans un appartement en 1975.</p><p>Dalio a tout perdu en 1982. Il a dû emprunter 4 000$ à son père.</p><p>C'est à ce moment qu'il a formulé sa formule :</p><p style="font-size:20px;text-align:center" class="sf"><strong>Pain + Reflection = Progress</strong></p><p>Chaque douleur est un signal. Si tu la fuis, tu ne progresses jamais. Si tu la regardes en face et en tires un <strong>principe</strong> — tu ne referas jamais la même erreur.</p><blockquote>"He who best deals with the unknown is the one who accepts not knowing and goes through the process of discovery."<small>— Ray Dalio, Principles</small></blockquote>`},
{id:4101,th:"dalio",ti:"La transparence radicale",s:"Chez Bridgewater, TOUTES les réunions sont enregistrées. N'importe qui peut critiquer n'importe qui — y compris le patron. C'est brutal. Et c'est pour ça que ça marche.",img:"🔍",body:`<p>La règle la plus controversée de Bridgewater : <strong>radical transparency</strong>. Toutes les réunions filmées. N'importe quel employé DOIT dire à son supérieur s'il pense qu'il a tort.</p><p>L'objectif : éliminer le biais d'autorité (le copilote du vol Air Florida).</p><p>En pratique, c'est brutal. 30% des recrues partent dans les 18 mois. Mais ceux qui restent apprennent à séparer leur ego de leurs idées.</p><blockquote>"Don't let the desire to be right overcome the need to find out what's true."<small>— Ray Dalio, Principles</small></blockquote>`},
{id:4102,th:"dalio",ti:"La boucle en 5 étapes",s:"Dalio a codifié TOUT son système de prise de décision en 5 étapes. C'est Rumelt avec des stéroïdes.",img:"🔄",body:`<p>La machine à progression en 5 étapes :</p><p><strong>1.</strong> Fixe des objectifs clairs.<br><strong>2.</strong> Identifie les problèmes.<br><strong>3.</strong> Diagnostique les causes profondes (pas les symptômes).<br><strong>4.</strong> Conçois un plan.<br><strong>5.</strong> Exécute.</p><p>Le génie : il fait tourner cette boucle MÉCANIQUEMENT. Pas quand il est inspiré. TOUT LE TEMPS.</p><blockquote>"Think of yourself as a machine within a machine, and know that you can alter your machines to produce better outcomes."<small>— Ray Dalio, Principles</small></blockquote>`},
{id:6000,th:"thiel",ti:"La question que Thiel pose à chaque candidat",s:"'Quelle est la vérité fondamentale que très peu de gens partagent avec vous ?' La plupart échouent. Répondre exige intelligence ET courage.",img:"🚀",body:`<p>Peter Thiel pose à chaque candidat :</p><p style="font-size:18px;text-align:center" class="sf"><em>"Quelle est la vérité que très peu de gens partagent avec vous ?"</em></p><p>Mauvaises réponses : opinions communes déguisées en vérités iconoclastes.</p><p>Bonne réponse : <strong>"Une majorité croient X, mais la vérité est l'opposé."</strong> Et elle doit être VRAIE.</p><p>Cette question teste l'intelligence ET le courage. "Le courage est plus exceptionnel encore que le génie."</p><blockquote>"Le prochain Bill Gates ne bâtira pas de système d'exploitation."<small>— Peter Thiel, Zéro à un</small></blockquote>`},
{id:6001,th:"thiel",ti:"De 0 à 1 vs de 1 à n",s:"Prendre une machine à écrire et en construire 100, c'est passer de 1 à n. En inventer un traitement de texte, c'est passer de 0 à 1. Un seul crée de la valeur réelle.",img:"💡",body:`<p><strong>De 1 à n</strong> = progrès horizontal. Copier ce qui marche. Mondialisation.</p><p><strong>De 0 à 1</strong> = progrès vertical. Créer ce qui n'existait pas. Technologie.</p><p>La thèse : <strong>les "meilleures pratiques" mènent à des impasses.</strong> Les seuls qui gagnent créent un <strong>monopole</strong> — une catégorie à part.</p><p>Google n'a pas "amélioré" les moteurs de recherche. Il a créé quelque chose de tellement différent que les autres sont devenus non pertinents.</p><blockquote>"La technologie est miraculeuse parce qu'elle nous permet de faire plus avec moins."<small>— Peter Thiel</small></blockquote>`},
{id:6002,th:"thiel",ti:"La compétition détruit les profits",s:"On nous apprend que la compétition est saine. Thiel : c'est un mensonge. Les secteurs les plus compétitifs sont les moins rentables.",img:"🏆",body:`<p>Le mythe : la concurrence pousse à l'excellence. La réalité : <strong>la concurrence parfaite détruit les profits.</strong></p><p>Les restaurants : secteur ultra-compétitif → marges faméliques. Google : quasi-monopole → 30% de marge nette.</p><p>Ne te bats pas pour être le meilleur dans une catégorie existante — <strong>crée ta propre catégorie.</strong> Le monopole personnel.</p><blockquote>"La compétition, c'est pour les perdants."<small>— Peter Thiel, Zéro à un</small></blockquote>`},
{id:6100,th:"ferriss",ti:"La question qui filtre tout le bruit",s:"Tim Ferriss a posé 11 questions à 130 personnes parmi les plus performantes du monde. Une revient comme la plus transformatrice : 'Quel échec t'a le mieux préparé à réussir ?'",img:"⏱",body:`<p>Tim Ferriss a écrit à 130 des personnes les plus performantes du monde. La question qui revient comme un fil rouge :</p><p style="font-size:18px;text-align:center" class="sf"><em>"Quel échec t'a le mieux préparé au succès futur ?"</em></p><p>Le pattern : <strong>Pain + Reflection = Progress</strong> (Dalio). Chaque échec contient une leçon — mais SEULEMENT si tu la cherches.</p><p>Autres patterns : presque tous méditent, lisent massivement, et ont appris à dire "non".</p><blockquote>"Hard choices, easy life. Easy choices, hard life."<small>— Jerzy Gregorek, in Tribe of Mentors</small></blockquote>`},
{id:6101,th:"ferriss",ti:"Naval Ravikant : comment être riche sans chance",s:"'Cherche la richesse, pas l'argent. La richesse c'est des actifs qui gagnent pendant que tu dors. Le statut, c'est un jeu à somme nulle. Évite-le.'",img:"💎",body:`<p>Naval Ravikant : <strong>"Cherche la richesse, pas l'argent ni le statut."</strong></p><p>La richesse = des actifs qui produisent pendant que tu dors (code, produit, contenu, investissements). Le statut = jeu à somme nulle.</p><p><strong>"Arme-toi de knowledge spécifique"</strong> — ce que tu sais faire et que personne ne peut t'enseigner à l'école.</p><p><strong>"Utilise le levier"</strong> — le code et les médias (coût marginal zéro, pas de permission nécessaire).</p><blockquote>"Seek wealth, not money or status. Wealth is having assets that earn while you sleep."<small>— Naval Ravikant</small></blockquote>`},
{id:6200,th:"dalio",ti:"Le Big Cycle : pourquoi les empires tombent tous de la même façon",s:"Dalio a étudié 500 ans de cycles d'empires. Ils montent et tombent TOUS de la même manière. Et les USA sont là où l'Empire britannique était en 1900.",img:"📉",body:`<p>Dalio étudie la montée et la chute de tous les empires depuis 500 ans : Pays-Bas, Grande-Bretagne, USA, Chine.</p><p>Le <strong>Big Cycle</strong> suit toujours le même schéma : <strong>1. Montée</strong> (éducation → innovation → puissance) ; <strong>2. Sommet</strong> (richesse → inégalités → dette) ; <strong>3. Déclin</strong> (conflits internes → rivaux → perte du statut de réserve).</p><p>Le plus glaçant : les USA présentent les mêmes signaux que l'Empire britannique en 1900.</p><blockquote>"The times ahead will be radically different, though similar to many times in history."<small>— Ray Dalio</small></blockquote>`},
{id:6201,th:"dalio",ti:"Les 8 mesures de la puissance d'un empire",s:"Dalio a créé un index de 8 facteurs. Quand 6+ déclinent simultanément, c'est fini.",img:"📊",body:`<p>Dalio mesure <strong>8 facteurs de puissance</strong> :</p><p>1. Éducation<br>2. Innovation & technologie<br>3. Compétitivité<br>4. Commerce mondial<br>5. Production économique<br>6. Puissance militaire<br>7. Centre financier<br>8. Monnaie de réserve (dernier à monter, dernier à tomber)</p><p>L'éducation PRÉCÈDE l'innovation. La Chine monte sur 6 des 8 facteurs ; les USA déclinent sur 5.</p><blockquote>"How do I know the times ahead will be radically different? Because they always have been."<small>— Ray Dalio</small></blockquote>`},
{id:7000,th:"holiday",ti:"Comment Ryan Holiday a hacké les médias",s:"À 19 ans, apprenti de Robert Greene. À 21 ans, directeur marketing d'American Apparel. Sa méthode : manipuler les blogs pour que les médias reprennent ses fausses histoires.",img:"📰",body:`<p>Ryan Holiday a découvert le secret le plus sale du journalisme moderne : <strong>les médias ne vérifient plus rien.</strong></p><p>Sa technique — le <strong>"Trading Up the Chain"</strong> : tu plantes une fausse histoire sur un petit blog. Un blog plus gros la reprend en citant le premier. Puis un média national — et ton mensonge devient "vérité".</p><p>Holiday l'a fait des dizaines de fois. Puis il a écrit ce livre pour EXPOSER sa propre méthode.</p><blockquote>"La manipulation des médias nécessite juste quelqu'un qui comprend le système de l'intérieur."<small>— Ryan Holiday, Trust Me I'm Lying</small></blockquote>`},
{id:7001,th:"holiday",ti:"Les tactiques de manipulation des médias",s:"Tu penses que l'info est objective ? Holiday a manipulé des milliers d'articles. Après ça, tu ne liras plus jamais un article de la même manière.",img:"🎭",body:`<p>Holiday expose ses tactiques :</p><p><strong>1.</strong> Donne ce qui se partage — les articles les plus partagés sont les plus émotionnels, pas les plus vrais.<br><strong>2.</strong> Tout tourne autour du titre — 80% des gens ne lisent QUE le titre.<br><strong>3.</strong> Les titres clickbait ne sont pas un accident. Les éditeurs SAVENT qu'ils sont trompeurs.</p><p>Après ce livre, Holiday est devenu philosophe stoïcien. Du manipulateur au sage.</p><blockquote>"L'ère de l'information est en réalité l'ère de la désinformation."<small>— Ryan Holiday</small></blockquote>`},
{id:7100,th:"stratagemes",ti:"Traverser la mer sans que le ciel le sache",s:"Stratagème n°1 : dissimule tes secrets en évidence. Le plus visible cache le plus secret.",img:"🐉",body:`<p>Le premier des 36 stratagèmes chinois :</p><p><strong>"Dissimule tes secrets en évidence afin qu'on ne les perce pas à jour."</strong></p><p>Les actions familières n'éveillent pas la suspicion. Le secret le plus efficace est caché en pleine lumière.</p><p>Un général des Tang transporta l'empereur par la mer dans un pavillon flottant déguisé en bâtiment terrestre. L'empereur ne sut jamais qu'il naviguait.</p><blockquote>"Le grand Yang contient le grand Yin. Le plus visible dissimule le plus secret."<small>— Les 36 Stratagèmes, n°1</small></blockquote>`},
{id:7101,th:"stratagemes",ti:"Assiéger Wei pour secourir Zhao",s:"Ton allié est assiégé. N'attaque PAS l'armée ennemie — attaque sa VILLE pendant qu'elle est vide. L'armée reviendra à toute vitesse.",img:"🏰",body:`<p>Stratagème n°2 : <strong>"Au lieu d'attaquer un ennemi puissant et concentré, fragmentez-le."</strong></p><p>Sun Bin (descendant de Sun Tzu) : l'État de Zhao est assiégé par Wei. Sun Bin ne marche pas au secours de Zhao. Il attaque la capitale de Wei — sans défense. L'armée de Wei doit revenir en urgence et tombe dans une embuscade.</p><p>En business : ton concurrent attaque ton marché principal ? Attaque SON marché secondaire.</p><blockquote>"Frappez là où l'ennemi est faible."<small>— Les 36 Stratagèmes, n°2</small></blockquote>`},
{id:7102,th:"stratagemes",ti:"Dissimuler une épée dans un sourire",s:"Stratagème n°10 : sois amical en surface, prépare ton attaque en secret. Le sourire désarme.",img:"🗡️",body:`<p>Stratagème n°10 — le plus sombre : <strong>"Être amical en apparence, préparer l'offensive en secret."</strong></p><p>Le sourire a deux fonctions : <strong>désarmer</strong> (Carnegie le savait) et <strong>gagner du temps</strong>.</p><p>Connaître ce stratagème est essentiel — pas pour l'utiliser, mais pour le DÉTECTER. Quand quelqu'un est soudainement trop amical... c'est peut-être de la gentillesse. Ou le stratagème n°10.</p><blockquote>"Dissimuler une épée dans un sourire."<small>— Les 36 Stratagèmes, n°10</small></blockquote>`},
{id:7103,th:"stratagemes",ti:"Bruit à l'est, attaque à l'ouest",s:"Stratagème n°6 : fais croire que ton offensive vient de l'est. Puis frappe à l'ouest — là où il n'y a personne. Le Jour J, c'est exactement ça.",img:"🧭",body:`<p>Stratagème n°6 : <strong>"Feindre une attaque dans une direction pour frapper dans une autre."</strong></p><p>• <strong>Le Jour J</strong> — fausse armée au Pas-de-Calais (bruit), débarquement en Normandie (attaque).<br>• <strong>Austerlitz</strong> — aile droite affaiblie (bruit), centre (attaque).<br>• <strong>Desert Storm</strong> — Marines au Koweït (bruit), crochet gauche dans le désert (attaque).</p><p>En négociation : insiste sur un point qui ne t'importe pas, puis "cède" en échange de ce que tu voulais.</p><blockquote>"Bruit à l'est, attaque à l'ouest."<small>— Les 36 Stratagèmes, n°6</small></blockquote>`},
{id:7104,th:"stratagemes",ti:"Courir est le meilleur choix",s:"Stratagème n°36 — le dernier. Quand tout est perdu : FUIS. La fuite n'est pas une honte. C'est la seule stratégie qui te garde en vie pour te battre demain.",img:"🏃",body:`<p><strong>"Des trente-six stratagèmes, le meilleur est le dernier : courir."</strong></p><p>Savoir quand fuir est aussi important que savoir quand attaquer. La retraite est un acte stratégique.</p><p>• <strong>Mao et la Longue Marche</strong> — 12 000 km de retraite. 15 ans plus tard, il contrôle la Chine.<br>• <strong>Steve Jobs en 1985</strong> — viré d'Apple. 12 ans plus tard, il revient.</p><p>Règle : <strong>tu fuis pour REVENIR plus fort.</strong></p><blockquote>"Des trente-six stratagèmes, le meilleur est le dernier : courir."<small>— Les 36 Stratagèmes, n°36</small></blockquote>`},
{id:7200,th:"dalio",ti:"L'erreur qui a failli tout détruire — et qui a tout créé",s:"1982. Dalio prédit une crise. Il a raison sur le diagnostic, tort sur le timing. Il perd TOUT. C'est cet échec qui fondera TOUT le système Bridgewater.",img:"💔",body:`<p>En 1982, le Mexique fait défaut. Dalio est convaincu que d'autres pays suivront. Il parie massivement. Il passe à la télé.</p><p>Il a raison sur le diagnostic. <strong>Il a tort sur les conséquences.</strong> La Fed intervient. Le marché EXPLOSE à la hausse. Dalio perd presque tout, licencie tout le monde, emprunte 4 000$ à son père.</p><p>Il en tire sa formule : <strong>Pain + Reflection = Progress.</strong></p><blockquote>"Mon erreur de 1982 m'a donné l'humilité dont j'avais besoin."<small>— Ray Dalio, Principes</small></blockquote>`},
{id:7201,th:"dalio",ti:"QUI est plus important que QUOI",s:"Dalio : 'Si tu as les bonnes personnes, presque tout est possible. Si tu as les mauvaises, rien ne l'est.'",img:"👥",body:`<p>Le principe le plus contre-intuitif : <strong>le QUI est plus important que le QUOI.</strong></p><p>La plupart se concentrent sur le QUOI (le plan). Dalio dit : commence par le QUI. Les meilleures stratégies échouent entre les mauvaises mains.</p><p>La règle la plus dure : <strong>"La pénalité pour embaucher quelqu'un de mauvais est énorme."</strong> Mieux vaut une chaise vide.</p><blockquote>"Onthoud dat WIE belangrijker is dan WAT." (Rappelez-vous que QUI est plus important que QUOI.)<small>— Ray Dalio, Principes</small></blockquote>`},
{id:8000,th:"science",ti:"Un nuage pèse 1 million de tonnes",s:"Un cumulus moyen fait 1 km³ et pèse environ 1 million de tonnes. Pourtant il flotte. Parce que sa densité est 0.4% inférieure à l'air autour.",img:"☁️"},
{id:8001,th:"science",ti:"Tu as plus de bactéries que de cellules",s:"Ton corps contient environ 38 000 milliards de bactéries — et seulement 30 000 milliards de cellules humaines. Techniquement, tu es plus bactérie qu'humain.",img:"🦠"},
{id:8002,th:"science",ti:"Le WiFi a été inventé par une actrice hollywoodienne",s:"Hedy Lamarr, star des années 40, a co-inventé un système de saut de fréquence pendant la guerre. Ce principe est à la base du WiFi, du Bluetooth et du GPS.",img:"📡"},
{id:8003,th:"science",ti:"Les arbres communiquent entre eux",s:"Ils s'envoient des signaux par les racines et un réseau de champignons souterrains (le 'Wood Wide Web'). Un arbre attaqué prévient ses voisins, qui produisent des toxines.",img:"🌳"},
{id:8004,th:"science",ti:"Le son du Big Bang existe encore",s:"Le fond diffus cosmologique est la lumière résiduelle du Big Bang. Sur une vieille TV non réglée, 1% de la neige est du rayonnement cosmique.",img:"🌌"},
{id:8100,th:"geo",ti:"La France est le plus grand pays du monde (maritime)",s:"Grâce à ses outre-mer, la France a le plus grand domaine maritime du monde : 11 millions de km². Plus que les USA.",img:"🇫🇷"},
{id:8101,th:"geo",ti:"Istanbul est sur deux continents",s:"La seule ville au monde à cheval entre l'Europe et l'Asie. Tu peux prendre le petit-déjeuner en Europe et le déjeuner en Asie — en 15 minutes de ferry.",img:"🌉"},
{id:8102,th:"geo",ti:"Le point le plus éloigné de toute terre : Point Nemo",s:"Dans le Pacifique Sud, à 2 688 km de la moindre terre. Les humains les plus proches sont souvent les astronautes de l'ISS, à 400 km au-dessus.",img:"🌊"},

{id:8201,th:"sport",ti:"Le marathon se court à la vitesse d'un vélo",s:"Le record du monde du marathon correspond à 21 km/h de moyenne. Pendant 2 heures. Le commun des mortels fait 21 km/h... à vélo.",img:"🏅"},
{id:8202,th:"sport",ti:"Le plus long match de tennis : 11h05",s:"Isner vs Mahut à Wimbledon 2010. Le 5ème set a duré 8h11, score 70-68. Le match s'est joué sur 3 jours.",img:"🎾"},
{id:8300,th:"ai_tech",ti:"GPT-4 a passé l'examen du barreau",s:"En mars 2023, GPT-4 a obtenu un score dans le top 10% à l'examen du barreau américain. GPT-3.5 était dans le bottom 10% seulement 4 mois avant.",img:"🤖"},
{id:8301,th:"ai_tech",ti:"L'IA consomme autant d'eau qu'une ville",s:"Entraîner GPT-3 a consommé 700 000 litres d'eau pour refroidir les serveurs. Un seul échange de 20 questions = une bouteille d'eau de 50cl évaporée.",img:"💧"},

{id:9000,th:"science",ti:"Pourquoi l'espace est noir alors qu'il y a des milliards d'étoiles ?",s:"Le paradoxe d'Olbers en 60 secondes. Si l'univers est infini, chaque point du ciel devrait être lumineux. Alors pourquoi c'est noir ?",img:"🎬",t:"video",vid:"gxJ4M7tyLRE"},

{id:9002,th:"science",ti:"Qu'est-ce qui se passe quand tu tombes dans un trou noir ?",s:"Spoiler : spaghettification. Tes pieds accélèrent plus vite que ta tête et tu t'étires en filament. En 60 secondes par Kurzgesagt.",img:"🎬",t:"video",vid:"QqsLTNkzvaY"},
{id:9003,th:"ai_tech",ti:"L'IA en 2025 : résumé en 10 minutes",s:"De GPT-4 à Claude, de Sora à Gemini, des agents autonomes aux robots humanoïdes. Tout ce qui s'est passé en IA cette année.",img:"🎬",t:"video",vid:"jV-jRJWUkMY"},

{id:8500,th:"fun",ti:"🧠 Vrai ou Faux : la foudre peut frapper deux fois le même endroit",s:"VRAI ! La tour Eiffel est frappée ~10 fois par an. L'Empire State Building : 25 fois par an. Le mythe est... faux.",img:"⚡"},
{id:8501,th:"fun",ti:"🧠 Vrai ou Faux : on utilise seulement 10% de notre cerveau",s:"FAUX ! Le mythe le plus tenace de la neuroscience. L'IRMf montre que tu utilises 100% de ton cerveau — juste pas tout en même temps.",img:"🧠"},
{id:8502,th:"fun",ti:"🧠 Vrai ou Faux : les poissons rouges ont 3 secondes de mémoire",s:"FAUX ! Ils retiennent des informations pendant des mois. Ils apprennent des labyrinthes et reconnaissent leur propriétaire.",img:"🐟"},
{id:8503,th:"fun",ti:"🧠 Vrai ou Faux : Cléopâtre vivait plus proche de l'iPhone que des pyramides",s:"VRAI ! Pyramides : 2560 av. J.-C. Cléopâtre : 30 av. J.-C. iPhone : 2007. Entre Cléopâtre et les pyramides : 2530 ans. Entre Cléopâtre et l'iPhone : 2037 ans.",img:"📱"},
{id:8600,th:"science",ti:"Les bananes sont radioactives",s:"Une banane contient du potassium-40, isotope radioactif. Il faudrait en manger 10 millions d'un coup pour une dose mortelle. Mais techniquement, ton smoothie t'irradie.",img:"🍌"},
{id:8601,th:"geo",ti:"Plus de flamants en plastique que de vrais aux USA",s:"Don Featherstone a inventé le flamant rose en plastique en 1957. Il y en a des millions dans les jardins. Il n'y a qu'environ 500 000 vrais flamants sur le continent.",img:"🦩"},
{id:8602,th:"science",ti:"Les tardigrades survivent dans l'espace",s:"Ces micro-animaux de 0.5mm survivent au vide spatial, aux radiations, à -272°C et +150°C. En 2007, l'ESA en a envoyé dans l'espace. Ils sont revenus vivants.",img:"🔬"},
{id:8603,th:"geo",ti:"Le Sahara était vert il y a 6 000 ans",s:"Le 'Sahara Vert' avait des lacs, des rivières, des hippopotames. Des peintures rupestres montrent des gens nageant au milieu du désert le plus chaud du monde.",img:"🏜️"},
{id:8604,th:"sport",ti:"Le record du monde de planche : 9h30",s:"Daniel Scali (Australie) a tenu la planche pendant 9 heures et 30 minutes en 2021. La plupart des gens lâchent au bout de 60 secondes.",img:"💪"},
{id:8605,th:"ai_tech",ti:"ChatGPT a atteint 100M d'utilisateurs en 2 mois",s:"TikTok : 9 mois. Instagram : 2.5 ans. Facebook : 4.5 ans. Netflix : 10 ans. ChatGPT a pulvérisé tous les records d'adoption de l'histoire.",img:"📈"},
{id:8606,th:"fun",ti:"Le miel ne périme jamais",s:"Des archéologues ont trouvé du miel vieux de 3 000 ans dans des tombes égyptiennes. Encore comestible. Le miel a un pH trop acide et trop peu d'eau pour les bactéries.",img:"🍯"},
{id:8607,th:"fun",ti:"Un jour sur Vénus dure plus longtemps qu'un an",s:"Vénus met 243 jours terrestres pour tourner sur elle-même, mais seulement 225 pour faire le tour du Soleil. Son jour est plus long que son année.",img:"🪐"},
{id:8608,th:"science",ti:"L'odeur de l'herbe coupée est un signal de détresse",s:"L'odeur agréable que tu sens en tondant est un cocktail chimique de détresse. L'herbe appelle littéralement à l'aide. Et nous, on aime ça.",img:"🌿"},
{id:8609,th:"sport",ti:"Le Tour de France brûle 120 000 calories",s:"Un coureur brûle 5 000 à 8 000 calories PAR ÉTAPE. Sur 3 semaines : 120 000 calories — l'équivalent de 240 Big Macs.",img:"🚴"},
{id:9010,th:"science",ti:"Comment la gravité déforme le temps",s:"Einstein avait raison : le temps passe PLUS LENTEMENT près d'un objet massif. Les horloges GPS avancent de 38 microsecondes par jour par rapport au sol.",img:"🎬",t:"video",vid:"F2prtmPEjOc"},
{id:9011,th:"geo",ti:"Pourquoi l'Afrique est-elle pauvre ? (la vraie réponse)",s:"Ni la culture, ni le climat. Une combinaison de géographie, de colonialisme et d'institutions extractives. Expliqué en 10 minutes.",img:"🎬",t:"video",vid:"fGqfREDRg2I"},
{id:9012,th:"ai_tech",ti:"L'IA va-t-elle remplacer ton job ?",s:"Les métiers les plus menacés ne sont pas ceux qu'on croit. Avocats et comptables plus menacés que plombiers et coiffeurs. Pourquoi ?",img:"🎬",t:"video",vid:"e-gBFuMGpSE"},
{id:9013,th:"fun",ti:"Les illusions d'optique les plus folles",s:"Ton cerveau te ment en permanence. Ces illusions prouvent que ce que tu 'vois' est une construction — pas la réalité.",img:"🎬",t:"video",vid:"z9Sen1HTu5o"},
{id:8700,th:"fun",ti:"Le budget de Titanic a coûté plus cher que le vrai Titanic",s:"Le film de Cameron a coûté 200M$ en 1997. Le vrai Titanic : 7.5M$ en 1912 — environ 200M$ ajustés. Cameron a dépensé autant que le vrai bateau.",img:"🚢"},
{id:8701,th:"fun",ti:"Nintendo existait avant la Tour Eiffel",s:"Nintendo a été fondé en 1889 comme fabricant de cartes à jouer. La Tour Eiffel : 1889 aussi. Nintendo a 136 ans.",img:"🎮"},
{id:8702,th:"fun",ti:"Le créateur de la Game Boy était concierge chez Nintendo",s:"Gunpei Yokoi était agent d'entretien. Le président l'a vu jouer avec un gadget qu'il avait fabriqué. Il a inventé la Game Boy, vendue à 118 millions d'exemplaires.",img:"🕹️"},
{id:8703,th:"fun",ti:"Bob Ross a peint 30 000 tableaux",s:"3 tableaux par épisode de The Joy of Painting. 403 épisodes. Plus des dizaines d'autres. Total estimé : ~30 000.",img:"🎨"},
{id:8710,th:"fun",ti:"La pizza hawaïenne a été inventée... au Canada",s:"Sam Panopoulos, immigrant grec en Ontario, a mis de l'ananas sur une pizza en 1962. Il l'a appelée 'hawaïenne' à cause de la marque de conserve. L'Italie ne s'en est pas remise.",img:"🍕"},
{id:8711,th:"fun",ti:"Le Coca-Cola était vert à l'origine",s:"La recette de 1886 contenait de l'extrait de feuille de coca et de noix de kola. Le liquide était verdâtre. Le caramel a été ajouté plus tard.",img:"🥤"},
{id:8712,th:"fun",ti:"Les carottes étaient violettes avant le XVIIe siècle",s:"Les carottes orange n'existent que depuis les années 1600 — créées par des cultivateurs néerlandais en hommage à Guillaume d'Orange. Avant : violettes, blanches ou jaunes.",img:"🥕"},
{id:8713,th:"fun",ti:"Le wasabi que tu manges n'est presque jamais du vrai wasabi",s:"Le vrai wasabi coûte 250€/kg et perd sa saveur en 15 minutes. Ce qu'on te sert : du raifort teint en vert. Même au Japon, 95% des restaurants servent du faux.",img:"🍣"},
{id:8720,th:"science",ti:"Les poulpes ont 3 cœurs et le sang bleu",s:"Deux cœurs pompent vers les branchies, le troisième vers le corps. Leur sang est bleu car il utilise du cuivre au lieu du fer. Et ils ont 9 cerveaux.",img:"🐙"},
{id:8721,th:"science",ti:"Les loutres se tiennent la main en dormant",s:"Elles dorment sur le dos à la surface. Pour ne pas dériver, elles se tiennent les pattes. Les mamans attachent leur bébé avec du varech.",img:"🦦"},
{id:8722,th:"science",ti:"Les corbeaux se souviennent de ton visage",s:"Les corbeaux reconnaissent et mémorisent les visages humains pendant des ANNÉES. Si tu en énerves un, il prévient les autres. Ils tiennent des rancunes générationnelles.",img:"🐦‍⬛"},
{id:8723,th:"science",ti:"Les dauphins se donnent des prénoms",s:"Chaque dauphin développe un sifflement unique que les autres utilisent pour l'appeler. C'est littéralement un prénom. Ils répondent quand on les appelle.",img:"🐬"},
{id:8730,th:"sport",ti:"Un homme a survécu à une chute de 10 000 m sans parachute",s:"Vesna Vulović, hôtesse de l'air serbe, a survécu à la chute de son avion à 10 160m en 1972. Record Guinness de la plus haute chute survivable.",img:"✈️"},
{id:8731,th:"sport",ti:"Le match de foot le plus long : 169 heures",s:"En 2016, pour une œuvre caritative, deux équipes ont joué pendant 169 heures à Bath. Plus de 7 jours non-stop. Score final : 1 111 à 1 110.",img:"⚽"},
{id:8732,th:"fun",ti:"La guerre la plus courte de l'histoire : 38 minutes",s:"La guerre anglo-zanzibarite du 27 août 1896. Les Britanniques ont bombardé le palais. 38 minutes plus tard, c'était fini. Plus court qu'un épisode de série.",img:"💣"},
{id:8733,th:"fun",ti:"Un homme a eu le hoquet pendant 68 ans",s:"Charles Osborne a commencé à hoqueter en 1922 et n'a arrêté qu'en 1990. 68 ans — environ 430 millions de hoquets. Il s'est marié deux fois et a eu 8 enfants.",img:"😮"},
{id:8740,th:"science",ti:"Il pleut des diamants sur Neptune",s:"L'atmosphère de Neptune contient du méthane. La pression extrême compresse le carbone en diamants qui tombent comme de la pluie.",img:"💎"},
{id:8741,th:"science",ti:"Une cuillère d'étoile à neutrons pèse 6 milliards de tonnes",s:"Une étoile à neutrons est si dense qu'une cuillère à café pèserait autant que l'Everest. Posée sur Terre, elle traverserait le sol jusqu'au centre.",img:"⭐"},
{id:8742,th:"science",ti:"La Grande Tache Rouge de Jupiter est plus grande que la Terre",s:"Cette tempête fait rage depuis au moins 400 ans. Elle fait 1.3 fois la taille de la Terre. Les vents y soufflent à 680 km/h.",img:"🪐"},
{id:8750,th:"ai_tech",ti:"Le premier SMS de l'histoire disait 'Merry Christmas'",s:"Le 3 décembre 1992, Neil Papworth a envoyé le premier SMS. Le destinataire n'a pas pu répondre — son téléphone n'avait pas de clavier.",img:"📱"},
{id:8751,th:"ai_tech",ti:"Google était stocké sur des Lego",s:"Les premiers serveurs de Google à Stanford étaient montés dans un boîtier fait en Lego. Page et Brin n'avaient pas d'argent pour un vrai rack. Cette tour de Lego a indexé le web.",img:"🧱"},
{id:8752,th:"ai_tech",ti:"Il y a plus d'appareils connectés que d'humains sur Terre",s:"En 2025, ~17 milliards d'appareils IoT connectés — pour 8 milliards d'humains. Et ça va tripler d'ici 2030.",img:"📡"},
{id:9020,th:"fun",ti:"Pourquoi tu ne peux pas toucher ton coude avec ta langue",s:"99.7% des gens ne peuvent pas. Et pourtant, après avoir lu cette phrase, tu viens d'essayer. C'est le pouvoir de la suggestion.",img:"🎬",t:"video",vid:"dQw4w9WgXcQ"},
{id:9021,th:"science",ti:"Ce qui se passe dans ton cerveau quand tu dors",s:"Ton cerveau est PLUS actif pendant certaines phases de sommeil que quand tu es éveillé. Il consolide les souvenirs, nettoie les toxines. Le sommeil EST du travail.",img:"🎬",t:"video",vid:"gedoSfZvBgE"},
{id:9022,th:"geo",ti:"Les endroits les plus isolés de la planète",s:"Des îles où personne n'a jamais mis le pied. Des villages accessibles uniquement par hélicoptère. La Terre a encore des secrets.",img:"🎬",t:"video",vid:"_MUfsvVb6RQ"},
{id:9023,th:"sport",ti:"L'histoire folle de Leicester City 2016",s:"5000-1 chez les bookmakers. Un club de milieu de tableau qui gagne la Premier League. La plus grande surprise de l'histoire du sport.",img:"🎬",t:"video",vid:"sKml2lMbOB8"},
{id:9024,th:"fun",ti:"Les coïncidences les plus folles de l'histoire",s:"Lincoln et Kennedy. Le Titanic prédit par un roman 14 ans avant. L'homme frappé par la foudre 7 fois. Quand la réalité dépasse la fiction.",img:"🎬",t:"video",vid:"mq0UmLnGUoI"},
{id:8800,th:"history",ti:"L'Australie a perdu une guerre contre des émeus",s:"En 1932, l'armée australienne a déployé des mitrailleuses contre 20 000 émeus qui ravageaient les cultures. Les émeus ont gagné. L'armée a battu en retraite.",img:"🦅"},
{id:8801,th:"napoleon",ti:"Napoléon a été attaqué par des lapins",s:"En 1807, Napoléon organise une chasse au lapin. 3 000 lapins sont lâchés. Au lieu de fuir, ils CHARGENT Napoléon. L'Empereur fuit en carrosse.",img:"🐰"},
{id:8802,th:"history",ti:"Les Romains utilisaient de l'urine comme dentifrice",s:"L'ammoniaque de l'urine est un blanchissant naturel. Les Romains importaient de l'urine portugaise pour se brosser les dents. Ça marchait vraiment.",img:"🏛"},
{id:8803,th:"fun",ti:"Le drapeau de l'Alaska a été dessiné par un enfant de 13 ans",s:"Benny Benson, orphelin de 13 ans d'origine autochtone, a gagné le concours en 1927. Son design : la Grande Ourse et l'étoile polaire sur fond bleu.",img:"🏴"},
{id:8804,th:"history",ti:"Cléopâtre parlait 9 langues",s:"La dernière pharaonne parlait égyptien, grec, hébreu, araméen, arabe, éthiopien, mède, parthe et latin. Et elle avait 21 ans quand elle a séduit César.",img:"👑"},
{id:8810,th:"science",ti:"Tu prends 35 000 décisions par jour",s:"Des chercheurs de Cornell estiment 226 décisions par jour rien que sur la nourriture. Au total : ~35 000 décisions quotidiennes, la plupart inconscientes.",img:"🧠"},
{id:8811,th:"science",ti:"Le cerveau consomme 20% de ton énergie",s:"Ton cerveau pèse 2% de ton poids mais consomme 20% de tes calories. Les joueurs d'échecs pros peuvent brûler 6 000 calories pendant un tournoi — juste en réfléchissant.",img:"⚡"},
{id:8812,th:"science",ti:"Ton nez peut détecter 1 000 milliards d'odeurs",s:"On pensait ~10 000. En 2014, des chercheurs de Rockefeller ont montré que c'est 1 000 milliards. Ton nez est un supercalculateur olfactif.",img:"👃"},
{id:8813,th:"fun",ti:"Le rire est contagieux — littéralement",s:"En 1962 en Tanzanie, un fou rire a fermé 14 écoles pendant 6 mois. Commencé par 3 filles, il s'est propagé à 1 000 personnes. Une 'épidémie psychogène de masse'.",img:"😂"},
{id:8820,th:"fun",ti:"Jeff Bezos gagne ton salaire annuel en 12 secondes",s:"Avec 200 milliards et un rendement de 10%, Bezos gagne ~630$/seconde. Le salaire médian français en 12 secondes.",img:"💰"},
{id:8821,th:"ai_tech",ti:"Le premier site web existe encore",s:"info.cern.ch — créé par Tim Berners-Lee au CERN en 1991. Une simple page avec des liens hypertexte. L'ancêtre de tout Internet.",img:"🌐"},
{id:8822,th:"fun",ti:"McDonald's gagne plus avec l'immobilier qu'avec les burgers",s:"Ray Kroc l'a compris : McDonald's est une société immobilière. Ils possèdent les terrains et louent aux franchisés. Le burger est un prétexte.",img:"🍔"},
{id:8823,th:"fun",ti:"IKEA publie plus de livres que la Bible",s:"Le catalogue IKEA était imprimé à 200 millions d'exemplaires par an — plus que la Bible et le Coran combinés. Le livre le plus lu était un catalogue de meubles.",img:"📕"},
{id:8830,th:"geo",ti:"La Finlande a plus de saunas que de voitures",s:"5.5 millions d'habitants. 3.3 millions de saunas. 2.7 millions de voitures. Il y a un sauna dans le Parlement et même dans un Burger King à Helsinki.",img:"🧖"},
{id:8831,th:"geo",ti:"Le Canada a plus de lacs que le reste du monde combiné",s:"Le Canada possède environ 60% de tous les lacs de la planète — plus de 2 millions. L'Ontario seul a plus de 250 000 lacs.",img:"🏞️"},
{id:8832,th:"geo",ti:"La Mongolie est le pays le moins densément peuplé",s:"3.3 millions d'habitants sur 1.5 million de km². 2 habitants au km². Un Mongol a en moyenne 750 000 m² pour lui.",img:"🏔️"},
{id:8833,th:"geo",ti:"Il y a un village en Norvège qui s'appelle Hell",s:"Hell est un village de 1 500 habitants dans le Trøndelag. En hiver, il gèle. Littéralement : 'Hell freezes over.' Les touristes volent le panneau.",img:"😈"},
{id:8840,th:"sport",ti:"Le chess-boxing existe vraiment",s:"Alternance de rounds de boxe et d'échecs. 6 rounds d'échecs, 5 de boxe. Tu peux gagner par KO ou par échec et mat. Il y a des championnats du monde.",img:"🥊"},
{id:8841,th:"sport",ti:"Un gardien a marqué depuis ses propres cages",s:"En 2019, Tom King de Newport County a marqué d'un dégagement. Le ballon a fait 96 mètres. Record Guinness du but le plus lointain en match officiel.",img:"⚽"},
{id:8842,th:"sport",ti:"Aux JO de 1904, le marathon était un désastre absolu",s:"Le vainqueur a été disqualifié (18km en voiture). Le 2ème a gagné grâce à du brandy et de la strychnine. Un concurrent a été poursuivi par des chiens sauvages.",img:"🏅"},
{id:9030,th:"fun",ti:"Pourquoi les chats ont conquis Internet",s:"De Keyboard Cat à Grumpy Cat, de Nyan Cat à la taxe chat sur Reddit. Comment un animal domestique est devenu le symbole d'Internet.",img:"🎬",t:"video",vid:"o_XaJdDqQA0"},
{id:9031,th:"science",ti:"Si la Terre était une bille — l'échelle de l'univers",s:"Si la Terre faisait la taille d'une bille, la Lune serait à 30cm, le Soleil à 117m, et l'étoile la plus proche... à 32 000 km.",img:"🎬",t:"video",vid:"Iy78Cqo9EZQ"},
{id:9032,th:"geo",ti:"Les pays qui n'existent pas (mais qui existent quand même)",s:"Transnistrie, Somaliland, Taïwan, Chypre du Nord... des pays avec gouvernement, armée, passeports — mais que personne ne reconnaît officiellement.",img:"🎬",t:"video",vid:"_lj127TKu14"},
{id:9033,th:"ai_tech",ti:"Comment l'IA génère des images à partir de texte",s:"De DALL-E à Midjourney. Comment un réseau de neurones transforme 'un chat astronaute sur Mars' en image. Diffusion et débruitage expliqués simplement.",img:"🎬",t:"video",vid:"SVcsDDABEkM"},
{id:9034,th:"sport",ti:"Les plus gros fails du sport en direct",s:"Le gardien qui fait une passe à personne. Le sprinter qui célèbre trop tôt. Les moments où le sport rappelle qu'on est tous humains.",img:"🎬",t:"video",vid:"kocjsGI1Ao8"},
{id:8900,th:"history",ti:"Abraham Lincoln était champion de lutte",s:"Avant la politique, Lincoln était un lutteur redoutable. En 12 ans, 1 seule défaite sur ~300 combats. Intronisé au Wrestling Hall of Fame en 1992.",img:"🤼"},
{id:8901,th:"history",ti:"Les Vikings donnaient de la bière aux bébés",s:"L'eau potable n'existait pas. La bière (~2% d'alcool) était plus sûre. Les bébés en buvaient dès le sevrage. Les moines aussi — 5 litres par jour.",img:"🍺"},
{id:8902,th:"history",ti:"Versailles puait au point que les courtisans vomissaient",s:"Pas de toilettes, pas d'eau courante. 10 000 habitants faisaient leurs besoins dans les couloirs. Louis XIV a déménagé 5 fois de sa chambre à cause de l'odeur.",img:"🏰"},
{id:8903,th:"history",ti:"Les gladiateurs étaient des célébrités avec des groupies",s:"Graffitis à leur gloire, sueur vendue comme aphrodisiaque. C'étaient les footballeurs de l'Antiquité.",img:"⚔️"},
{id:8904,th:"history",ti:"Pythagore dirigeait une secte végétarienne",s:"Règles : pas de viande, pas de fèves (elles contenaient des âmes), lever la main gauche en premier le matin. Le mathématicien du triangle était un gourou mystique.",img:"📐"},
{id:8905,th:"history",ti:"La CIA a essayé de tuer Castro 638 fois",s:"Cigare explosif, combinaison de plongée empoisonnée, coquillage piégé. 638 tentatives. 0 succès. Castro est mort de vieillesse à 90 ans.",img:"🇨🇺"},
{id:8906,th:"history",ti:"Les Aztèques utilisaient le cacao comme monnaie",s:"Un lapin = 10 fèves de cacao. Un esclave = 100 fèves. Montezuma buvait 50 tasses de chocolat par jour dans des gobelets en or jetés après usage.",img:"🍫"},
{id:8907,th:"geo",ti:"La Corée du Nord et la Finlande sont séparées par UN pays",s:"La Russie. La Finlande partage 1 340 km de frontière avec elle, la Corée du Nord 17 km. De Helsinki à Pyongyang en ne traversant qu'un seul pays.",img:"🗺️"},
{id:8908,th:"history",ti:"Pendant le Blitz, le métro de Londres servait de dortoir",s:"177 000 Londoniens y dormaient chaque nuit. Bibliothèques, crèches, concerts. La station Aldwych avait un bar. Le Blitz a duré 8 mois.",img:"🚇"},
{id:8909,th:"history",ti:"Les samouraïs testaient leurs épées sur des passants",s:"Le 'tsujigiri' consistait à tester une nouvelle lame sur le premier passant venu. Illégal mais toléré pour les samouraïs de haut rang. Interdit en 1602.",img:"🗡️"},
{id:8910,th:"history",ti:"Marie-Antoinette n'a JAMAIS dit 'Qu'ils mangent de la brioche'",s:"La phrase est de Rousseau, attribuée à 'une grande princesse' AVANT que Marie-Antoinette n'arrive en France. Propagande révolutionnaire devenue fait historique.",img:"🍰"},
{id:8911,th:"history",ti:"Louis XIV ne s'est lavé que 3 fois dans sa vie",s:"Le Roi-Soleil : friction sèche avec un linge. Les médecins pensaient que l'eau ouvrait les pores aux maladies. 3 bains complets en 77 ans.",img:"👑"},
{id:8912,th:"napoleon",ti:"Napoléon n'était PAS petit — 1m69",s:"Taille moyenne d'un Français de l'époque. Le mythe vient d'une erreur de conversion entre pieds français et anglais. Les caricaturistes anglais ont fait le reste.",img:"📏"},
{id:8913,th:"voltaire",ti:"Voltaire buvait 40 cafés par jour et a vécu jusqu'à 83 ans",s:"Son médecin : 'Le café va vous tuer.' Voltaire : 'Il y a 80 ans que j'en prends. Si c'est un poison, c'est un poison lent.'",img:"☕"},
{id:8914,th:"history",ti:"La guillotine a été inventée pour être HUMAINE",s:"Le Dr Guillotin voulait une mort rapide et égalitaire. Il a promu la machine mais ne l'a PAS inventée. Et il détestait qu'elle porte son nom.",img:"⚖️"},
{id:8920,th:"history",ti:"Les Anglais ont lancé un cadavre avec de faux plans pendant la WW2",s:"Opération Mincemeat (1943). Cadavre habillé en officier + faux plans d'invasion. Largué en mer. Les nazis ont mordu. L'invasion de la Sicile a réussi.",img:"🕵️"},
{id:8921,th:"history",ti:"Mata Hari était probablement innocente",s:"L'espionne la plus célèbre de la WW1 : surtout une danseuse qui couchait avec des officiers des deux camps. Fusillée en 1917. Preuves fabriquées.",img:"💃"},
{id:8922,th:"history",ti:"Le KGB avait un pistolet dans un rouge à lèvres",s:"'Le baiser de la mort' : pistolet à un coup 4.5mm dans un tube de rouge à lèvres. Saisi sur une espionne à Berlin en 1965.",img:"💄"},
{id:8923,th:"history",ti:"Les Spartiates ont inventé le premier chiffrement",s:"La scytale : bande de cuir enroulée autour d'un bâton. Déroulé = charabia. Le premier chiffrement de l'histoire — 2 500 ans avant Enigma.",img:"🔐"},
{id:8930,th:"history",ti:"Un roi de France est mort en se cognant à une porte",s:"Charles VIII, 1498, château d'Amboise. Linteau trop bas. Mort quelques heures plus tard. Il avait 27 ans. Une porte a changé l'histoire de France.",img:"🚪"},
{id:8931,th:"history",ti:"Un astronome est mort pour ne pas être allé aux toilettes",s:"Tycho Brahe (1601) a refusé de quitter un banquet pour uriner — c'était impoli. Vessie éclatée. Mort 11 jours plus tard.",img:"💀"},
{id:8932,th:"history",ti:"Attila est mort d'un saignement de nez pendant sa nuit de noces",s:"Le fléau de Dieu, 453 : saignement de nez fulgurant pendant les noces. Trop de vin + hypertension. L'Empire des Huns s'effondre le lendemain.",img:"🩸"},
{id:8933,th:"history",ti:"Raspoutine a survécu au poison, aux balles ET à la noyade",s:"Décembre 1916 : empoisonné au cyanure (rien). Tiré à bout portant (il se relève). Battu (il se relève). Jeté dans la Neva glacée — l'autopsie : encore vivant dans l'eau.",img:"🧙"},
{id:9040,th:"history",ti:"Comment les pirates vivaient vraiment",s:"Pas de perroquet, pas de carte au trésor. Mais : une démocratie, une assurance maladie, un code de conduite strict. Plus organisés que la marine royale.",img:"🎬",t:"video",vid:"F0hEKInjlcc"},
{id:9041,th:"history",ti:"L'histoire folle de Raspoutine",s:"Paysan mystique devenu conseiller de la tsarine. Débauché notoire. Immortel apparent. Son histoire est plus folle que n'importe quel film.",img:"🎬",t:"video",vid:"nEY06Wp3sQ0"}

const EXTRA_CARDS=[{"id":21000,"cat":"Histoire","thn":"Égypte antique","ths":"🏺","ti":"Le pharaon qui se rasait… la barbe postiche","s":"Hatchepsout, femme pharaon, portait une fausse barbe en or pour gouverner. Pendant 20 ans, elle régna mieux que n'importe quel homme — et fit tout pour qu'on l'oublie après sa mort.","img":"👑","body":"<p>En 1479 avant J.-C., une femme monta sur le trône d'Égypte. Pas comme régente, pas dans l'ombre d'un mari : <strong>Hatchepsout devint pharaon à part entière</strong>, avec le double couronne, le sceptre et… une barbe en or finement tressée attachée sous le menton.</p>\n<p>Cette barbe postiche n'était pas une lubie. En Égypte ancienne, la barbe royale était un attribut divin, réservé aux hommes. Hatchepsout la portait dans les cérémonies officielles et sur ses statues — non par déguisement, mais par <em>affirmation de pouvoir</em>. Elle ne se cachait pas d'être femme ; elle revendiquait d'être pharaon.</p>\n<p>Son règne dura plus de <strong>vingt ans</strong>. Elle fit ériger deux des plus hauts obélisques jamais construits à Karnak. Elle envoya une expédition commerciale au pays de Pount (actuelle Corne de l'Afrique) qui rapporta myrrhe, ébène, ivoire et babouins vivants. Son temple funéraire à Deir el-Bahari reste l'un des chefs-d'œuvre de l'architecture antique.</p>\n<p>Puis vint le grand effacement. Après sa mort, vers 1458 avant J.-C., son beau-fils Thoutmosis III fit <strong>marteler son nom sur les monuments</strong>, briser ses statues et enterrer ses représentations. Pendant trois mille ans, on crut que le grand pharaon bâtisseur était un homme. Ce n'est qu'au XIXe siècle que les égyptologues reconstituèrent son identité — grâce aux textes qui avaient maladroitement alterné le masculin et le féminin en la décrivant.</p>\n<p>La barbe en or avait beau être arrachée, l'histoire ne s'efface pas si facilement.</p>\n<blockquote>« Je suis le pharaon vivant, ma puissance embrasse les deux terres comme le soleil. »<small>— Inscription attribuée à Hatchepsout, temple de Deir el-Bahari</small></blockquote>"},{"id":21001,"cat":"Histoire","thn":"Rome antique","ths":"🏛️","ti":"Jules César : kidnappé par des pirates, il rit — puis les fit crucifier","s":"En 75 av. J.-C., des pirates capturèrent César et exigèrent 20 talents de rançon. Il les trouva insultants — et exigea qu'ils en demandent 50. Puis il tint sa promesse de les tuer.","img":"⚔️","body":"<p>Jules César avait 25 ans quand son bateau fut intercepté en mer Égée par des pirates ciliciens. Ces bandits des mers contrôlaient alors une partie de la Méditerranée orientale — véritable plaie pour Rome. Ils demandèrent une rançon de <strong>vingt talents d'argent</strong>.</p>\n<p>César éclata de rire. Vingt talents pour <em>lui</em> ? Il était offensé. Il leur dit qu'ils ne savaient pas qui ils tenaient, et exigea qu'ils doublent la mise à cinquante talents — soit environ <strong>1 500 kilos d'argent</strong>. Les pirates, déconcertés, acceptèrent.</p>\n<p>Pendant les <strong>trente-huit jours</strong> que dura sa captivité sur l'île de Pharmacuse, César se comporta en maître absolu. Il participait à leurs jeux, récitait ses poèmes et ses discours, et chaque fois qu'ils riaient poliment, il leur disait avec le sourire qu'il les ferait tous crucifier dès qu'il serait libre. Les pirates riaient encore. Quelle bonne blague.</p>\n<p>La rançon payée, César courut à Milet, affréta plusieurs navires, mobilisa des soldats et fonça capturer ses anciens geôliers — qui n'avaient pas bougé. Il les fit emprisonner à Pergame et demanda au gouverneur de province d'instruire le procès. Mais le gouverneur tardait. César, impatient, <strong>retourna lui-même en prison et les fit crucifier</strong>.</p>\n<p>Par clémence — et peut-être par goût du geste — il leur fit d'abord trancher la gorge pour abréger leur agonie. Un détail de politesse typiquement césarien.</p>\n<p>Cette anecdote n'est pas une légende : Plutarque, Suétone et Velleius Paterculus en font tous mention. Le futur maître de Rome avait déjà, à 25 ans, une assurance absolue — et une mémoire infaillible.</p>\n<blockquote>« Il avait promis de les crucifier, en plaisantant, semblait-il. Mais César ne plaisantait jamais vraiment. »<small>— Plutarque, <em>Vies parallèles</em></small></blockquote>"},{"id":21002,"cat":"Histoire","thn":"Grèce antique","ths":"🏺","ti":"Sparte : les bébés jugés en conseil avant d'avoir le droit de vivre","s":"À Sparte, chaque nouveau-né était présenté aux anciens. S'il semblait trop faible, il était abandonné sur le mont Apothètes. La cité-état ne voulait que des guerriers parfaits — dès la naissance.","img":"🛡️","body":"<p>Imaginez naître et devoir <strong>passer un examen</strong> pour avoir le droit de rester en vie. C'était la réalité à Sparte, vers le VIIe siècle avant J.-C., dans l'une des sociétés les plus radicalement militaristes de l'Antiquité.</p>\n<p>Selon Plutarque, chaque nouveau-né spartiate était apporté devant un comité d'anciens — les <em>gérontes</em>. Ces hommes l'examinaient attentivement : sa musculature, sa constitution, ses membres. S'il paraissait vigoureux et bien formé, il était rendu à son père et enregistré comme futur citoyen. S'il semblait chétif, difforme ou maladif, il était conduit au <strong>mont Apothètes</strong>, un précipice près de la ville, et abandonné.</p>\n<p>La logique spartiate était implacable : l'État ne pouvait se permettre d'entretenir des êtres qui ne deviendraient jamais des soldats d'élite. Toute l'économie sociale de Sparte reposait sur la guerre — et sur la perfection physique comme garantie de survie collective.</p>\n<p>Pour les enfants qui survivaient à ce premier tri, l'épreuve ne faisait que commencer. À <strong>7 ans</strong>, les garçons quittaient leur famille pour intégrer l'<em>agogê</em>, un programme d'entraînement brutal : privations de nourriture, exposition au froid, combats au sang, dormant sur des roseaux qu'ils coupaient eux-mêmes. Les filles, elles, s'entraînaient à la course, au lancer de disque et à la lutte — afin d'engendrer des enfants forts.</p>\n<p>La société spartiate produisit effectivement des guerriers extraordinaires : les <strong>300 de Thermopyles</strong> en 480 av. J.-C. ne sont pas une fiction. Mais elle disparut précisément parce qu'elle avait négligé tout le reste — les arts, le commerce, la diplomatie, la démographie. En sélectionnant si sévèrement ses naissances, Sparte finit par manquer de Spartiates.</p>\n<blockquote>« Les Spartiates ne demandaient pas combien sont-ils, mais où sont-ils. »<small>— Agis II, roi de Sparte, avant la bataille de Mantinée</small></blockquote>"},{"id":21003,"cat":"Histoire","thn":"Empire mongol","ths":"🐎","ti":"Gengis Khan : le plus grand empire de l'histoire bâti par un ex-esclave","s":"Temüjin fut capturé enfant et porta un joug de bois autour du cou pendant des années. Il s'en échappa — et fonda l'empire contigu le plus vaste jamais connu, soit 24 millions de km².","img":"🌏","body":"<p>En 1177, un adolescent nommé Temüjin fuyait dans les steppes mongoles avec un billot de bois attaché autour du cou — marque des esclaves. Il avait été capturé par le clan Tayichiout, ses ennemis héréditaires, après que son père eut été empoisonné. La plupart des hommes dans sa situation mouraient. Temüjin, lui, s'échappa dans la nuit, se cacha dans une rivière jusqu'aux épaules, et disparut dans les steppes.</p>\n<p>Quarante ans plus tard, cet homme devenait <strong>Gengis Khan</strong> — \"le souverain universel\" — et gouvernait le plus vaste empire contigu de l'histoire de l'humanité.</p>\n<p>Son génie militaire tenait à plusieurs révolutions. D'abord, il <strong>abolit les hiérarchies tribales</strong> : dans son armée, un homme d'humble origine pouvait commander sur des nobles s'il en avait le mérite. Ensuite, il créa un système de communication ultra-rapide, le <em>yam</em> — un réseau de relais de chevaux couvrant des milliers de kilomètres qui permit de transmettre des ordres à travers tout l'empire en quelques jours.</p>\n<p>Il était aussi un maître de la guerre psychologique. Face à une ville qui résistait, il offrait la reddition : capitulation immédiate = vie sauve et intégration dans l'empire. Refus = destruction totale. <strong>Merv, en 1221</strong>, résista. Les chroniqueurs persans évoquent plus d'un million de morts — chiffre probablement exagéré, mais le massacre fut réel et délibéré.</p>\n<p>L'empire qu'il laissa à sa mort en 1227 s'étendait de la mer de Chine à la mer Caspienne — <strong>24 millions de kilomètres carrés</strong>. Ses descendants portèrent cet empire jusqu'en Pologne, en Corée, en Indochine et aux portes de Vienne. Aucun conquistador, aucun César, aucun Napoléon n'approcha jamais cette échelle.</p>\n<blockquote>« La plus grande joie est de vaincre ses ennemis, de les chasser devant soi, de les voir pleurer. »<small>— Attribué à Gengis Khan</small></blockquote>"},{"id":21004,"cat":"Histoire","thn":"Peste noire","ths":"☠️","ti":"La Peste noire : un tiers de l'Europe morte en 5 ans","s":"Entre 1347 et 1352, la Peste noire tua entre 25 et 50 millions d'Européens. Les survivants héritèrent de terres, de maisons, de richesses. Le chaos démographique accéléra la fin du féodalisme.","img":"🦠","body":"<p>En octobre 1347, douze navires génois accostèrent à Messine, en Sicile. Les marins à bord étaient soit morts, soit couverts de bubons noirs suintants. Les autorités ordonnèrent aux bateaux de repartir immédiatement. C'était trop tard. <strong>La Peste noire venait d'entrer en Europe.</strong></p>\n<p>En cinq ans, elle traversa le continent comme un incendie de forêt par vent fort. Elle tua sans distinction — paysans, bourgeois, prêtres, rois. Le roi de France <strong>Philippe VI</strong> demanda à la Faculté de médecine de Paris d'expliquer le phénomène. Leur réponse officielle, en 1348 : une conjonction de Mars, Jupiter et Saturne avait corrompu l'air. On prescrivit d'éviter les bains (qui ouvriraient les pores aux miasmes) et de brûler des aromates.</p>\n<p>La réalité bactériologique — <em>Yersinia pestis</em>, transmise par les puces des rats noirs — ne serait identifiée qu'en 1894. En attendant, les Européens cherchaient des coupables. Les <strong>juifs furent massacrés</strong> dans des centaines de villes, accusés d'empoisonner les puits. À Strasbourg en 1349, deux mille juifs furent brûlés vifs sur des bûchers.</p>\n<p>Mais la grande ironie de la Peste noire, c'est ce qu'elle engendra : une <strong>révolution économique et sociale</strong>. Les serfs survivants, désormais rares, pouvaient négocier leur travail. Les salaires montèrent. Les terres abandonnées se redistribuèrent. La mort de masse des clercs accéléra l'alphabétisation laïque. Certains historiens voient dans la Peste noire l'un des moteurs cachés de la Renaissance.</p>\n<p>En tuant entre <strong>30 et 50 % de la population européenne</strong>, la Peste noire remodela l'Occident plus profondément que n'importe quelle guerre.</p>\n<blockquote>« Les pères abandonnaient leurs fils, les mères leurs filles, les frères leurs frères. »<small>— Giovanni Boccaccio, <em>Décaméron</em>, 1353</small></blockquote>"},{"id":21005,"cat":"Histoire","thn":"Renaissance","ths":"🎨","ti":"Léonard de Vinci dormait 20 minutes, 6 fois par jour","s":"Léonard pratiquait le sommeil polyphasique : 2h de sommeil total par 24h, fragmentées en siestes. Cela lui donnait, disait-il, plus d'heures d'éveil que quiconque. Son carnet prouve qu'il peignait la nuit.","img":"🖌️"},{"id":21006,"cat":"Histoire","thn":"Imprimerie","ths":"📖","ti":"Gutenberg : la révolution qu'il ne vit jamais prospérer","s":"Johannes Gutenberg inventa la presse à imprimer vers 1450 — et mourut ruiné. Son associé Johann Fust le poursuivit en justice, récupéra les presses et emprucha les profits. Le génie resta sans le sou.","img":"📜","body":"<p>L'invention qui allait transformer l'humanité plus que presque toute autre naquit dans l'atelier d'un orfèvre de Mayence, vers <strong>1450</strong>. Johannes Gutenberg, en combinant caractères mobiles en métal, presse à vis et encre grasse, inventa le premier système d'impression mécanique d'Europe. En quelques décennies, des millions de livres allaient circuler là où il n'en existait que des milliers.</p>\n<p>Mais Gutenberg lui-même ne vit jamais la gloire. Pour financer son invention, il s'associa avec un homme d'affaires de Mayence, <strong>Johann Fust</strong>, qui lui prêta 1 600 guldens — une fortune colossale. Quand Gutenberg fut à court d'argent au milieu de l'impression de sa célèbre Bible (la Bible à 42 lignes, 1455), Fust le poursuivit en justice pour le remboursement du prêt <em>avec intérêts</em>.</p>\n<p>Le tribunal donna raison à Fust. <strong>Gutenberg perdit ses presses, ses caractères, ses matrices</strong> — tout l'équipement qu'il avait mis des années à perfectionner. Fust s'associa avec le propre assistant de Gutenberg, Peter Schöffer, et continua à imprimer sous leur propre nom, récoltant les bénéfices commerciaux de la technologie inventée par leur partenaire évincé.</p>\n<p>Gutenberg dut tout recommencer de zéro. Il trouva un nouveau mécène, l'archevêque de Mayence Adolphe II, qui lui accorda une rente en 1465 — deux ans seulement avant sa mort. Il mourut probablement en <strong>1468</strong>, sans fortune, sans héritier, sans atelier.</p>\n<p>L'ironie est cruelle : l'homme qui avait permis à la connaissance humaine de se démultiplier à l'infini mourut en ne possédant presque rien. Son nom disparut si complètement de la mémoire immédiate que pendant des siècles, certains attribuèrent l'invention à d'autres. Ce n'est qu'au XIXe siècle que les historiens reconstituèrent définitivement sa paternité.</p>\n<blockquote>« Il n'y a pas de plus grand obstacle au progrès que de tomber entre les mains de qui n'a rien inventé. »<small>— Proverbe d'imprimeur du XVIe siècle</small></blockquote>"},{"id":21007,"cat":"Histoire","thn":"Empire ottoman","ths":"🌙","ti":"Soliman le Magnifique : l'homme qui fit trembler Vienne","s":"En 1529, Soliman Ier assiégea Vienne avec 120 000 hommes. La ville tint — de justesse. Si elle était tombée, l'islam aurait peut-être gouverné l'Europe centrale. L'histoire tint à quelques semaines de pluie.","img":"🏰","body":"<p>Le matin du 27 septembre 1529, les habitants de Vienne se réveillèrent avec une réalité terrifiante : <strong>120 000 soldats ottomans</strong> campaient devant leurs murs. À leur tête, Soliman Ier — que l'Occident appellerait \"le Magnifique\" et que ses sujets appelaient \"le Législateur\" — le sultan le plus puissant que l'Empire ottoman ait jamais connu.</p>\n<p>Vienne n'avait que <strong>16 000 défenseurs</strong>, dont une bonne partie de mercenaires allemands levés à la hâte par le roi Ferdinand d'Autriche, qui avait prudemment fui la ville. Les murailles médiévales, conçues pour une autre époque, n'étaient guère adaptées à l'artillerie ottomane.</p>\n<p>Pourtant, Vienne tint. Plusieurs facteurs jouèrent. D'abord, les <strong>pluies d'automne</strong> avaient transformé les routes en bourbiers : Soliman avait dû laisser en route son artillerie lourde, ne gardant que les canons légers. Sans les grosses pièces, impossible d'ouvrir des brèches dans les murailles. Ensuite, les Ottomans tentèrent de saper les fondations — les défenseurs creusaient des contre-galeries et les faisaient exploser sur les mineurs ennemis.</p>\n<p>Le <strong>14 octobre 1529</strong>, Soliman leva le siège. L'hiver approchait, ses lignes d'approvisionnement s'étiraient sur 1 500 kilomètres, et ses janissaires commençaient à murmurer. Il massacra ses prisonniers chrétiens — on parle de milliers — et battit retraite.</p>\n<p>L'Europe poussa un soupir de soulagement collectif. Les historiens débattent encore : si Soliman était parti deux semaines plus tôt, avec son artillerie lourde et une météo clémente, rien ne garantissait que Vienne aurait résisté. Et après Vienne, il n'y avait plus grand-chose jusqu'au Rhin.</p>\n<blockquote>« Les portes de Vienne sont fermées. Celles de l'histoire, elles, restèrent ouvertes. »<small>— Paraphrase d'un chroniqueur vénitien, 1529</small></blockquote>"},{"id":21008,"cat":"Histoire","thn":"Japon féodal","ths":"⛩️","ti":"Les samouraïs n'étaient pas des solitaires : ils vivaient en bureaucratie","s":"Contrairement au mythe du guerrier solitaire, la plupart des samouraïs étaient des fonctionnaires : ils tenaient des registres, percevaient des taxes, rédigeaient des rapports. Le katana était leur insigne, pas leur quotidien.","img":"🗡️"},{"id":21009,"cat":"Histoire","thn":"Civilisation aztèque","ths":"🐍","ti":"Tenochtitlán : une ville plus grande que Paris en 1500","s":"Quand Cortés arriva en 1519, Tenochtitlán comptait 200 000 habitants — plus que toute ville d'Europe occidentale à l'époque. Ses canaux, marchés et aqueducs laissèrent les conquistadors bouche bée.","img":"🌊","body":"<p>Le 8 novembre 1519, Hernán Cortés et ses 400 soldats espagnols pénétrèrent dans Tenochtitlán par la grande chaussée qui enjambait le lac Texcoco. Ce qu'ils virent les laissa sans voix — et leurs récits, envoyés au roi Charles Quint, sont parmi les documents les plus stupéfiants de l'ère des conquistadors.</p>\n<p>Tenochtitlán était bâtie sur une île artificielle au centre d'un lac, reliée aux rives par <strong>trois grandes chaussées</strong> larges de plusieurs voies. La cité comptait entre <strong>200 000 et 300 000 habitants</strong> — à une époque où Paris, la plus grande ville d'Europe occidentale, en avait environ 150 000, et où Londres en comptait à peine 50 000.</p>\n<p>L'urbanisme était stupéfiant. Un système d'<strong>aqueducs en double conduite</strong> apportait l'eau douce depuis les sources de Chapultepec — une conduite transportait l'eau fraîche, l'autre permettait la maintenance. Des canots vidaient régulièrement les latrines publiques pour fertiliser les jardins flottants, les <em>chinampas</em>. La propreté des rues scandalisait les Espagnols… par son contraste avec leurs propres villes.</p>\n<p>Le grand marché de <strong>Tlatelolco</strong>, décrit par Bernal Díaz del Castillo, accueillait chaque jour 60 000 personnes. On y vendait or, plumes, cacao, esclaves, médicaments, poteries, tissus — avec des inspecteurs qui circulaient pour vérifier les prix et la qualité des marchandises.</p>\n<p>Deux ans après cette première rencontre, Cortés rasa la ville. En <strong>1521</strong>, après un siège de 80 jours, Tenochtitlán n'était plus qu'un tas de ruines. Mexico fut construite sur ses cendres. Sous les rues de la capitale mexicaine actuelle, les archéologues continuent de trouver les fondations de ce qui fut peut-être la plus remarquable cité du monde précolombien.</p>\n<blockquote>« Certains de nos soldats demandèrent si ce qu'ils voyaient n'était pas un rêve. »<small>— Bernal Díaz del Castillo, <em>Véritable Histoire de la conquête de la Nouvelle-Espagne</em></small></blockquote>"},{"id":21010,"cat":"Histoire","thn":"Vikings","ths":"⚓","ti":"Les Vikings en Amérique : 500 ans avant Christophe Colomb","s":"Vers l'an 1000, Leif Eriksson établit une colonie à Terre-Neuve — au Canada actuel. Les fouilles d'Anse aux Meadows prouvent que les Nordiques touchèrent l'Amérique cinq siècles avant Colomb. Sans GPS.","img":"🚢","body":"<p>L'histoire officielle a longtemps commencé en 1492. Pourtant, des sagas islandaises — les <em>Saga des Grœnlandais</em> et la <em>Saga d'Éric le Rouge</em> — décrivaient depuis des siècles des terres à l'ouest du Groenland : le <em>Vinland</em>, le <em>Markland</em>, l'<em>Helluland</em>. Pendant longtemps, les historiens les prirent pour des mythes.</p>\n<p>Jusqu'en <strong>1960</strong>. Cette année-là, l'archéologue norvégien <strong>Helge Ingstad</strong> et sa femme Anne Stine fouillèrent un site à Anse aux Meadows, à la pointe nord de Terre-Neuve, au Canada. Ils trouvèrent les vestiges indiscutables d'une colonie nordique : bâtiments en tourbe, forge, outils en fer, un anneau de broche typiquement viking. La datation au carbone 14 indiqua <strong>vers l'an 1000</strong>.</p>\n<p>Leif Eriksson, fils du célèbre Éric le Rouge, avait donc bien traversé l'Atlantique nord et établi un camp en Amérique du Nord — appelée <em>Vinland</em> (terre de la vigne) dans les sagas. La colonie ne dura pas : les conflits avec les populations locales (appelées <em>Skraelings</em> dans les textes nordiques, probablement des Béothuks ou des ancêtres des Inuits) et la difficulté du ravitaillement depuis le Groenland eurent raison de l'établissement après <strong>quelques années à peine</strong>.</p>\n<p>Anse aux Meadows reste à ce jour le <strong>seul site viking authentifié en Amérique du Nord</strong>. Classé au patrimoine mondial de l'UNESCO en 1978, il témoigne d'une audace maritime sans équivalent : traverser l'Atlantique nord dans des drakkars ouverts, par des eaux glacées, sans instruments de navigation, guidé par les étoiles, les courants et les oiseaux.</p>\n<p>Colomb avait des caravelles. Les Vikings avaient du cran.</p>\n<blockquote>« Ils trouvèrent de l'herbe douce et des raisins sauvages. Ils appelèrent ce pays Vinland. »<small>— <em>Saga des Grœnlandais</em>, XIIIe siècle</small></blockquote>"},{"id":21011,"cat":"Histoire","thn":"Croisades","ths":"✝️","ti":"La Croisade des enfants : 30 000 gosses partis vers Jérusalem… sans y arriver","s":"En 1212, des milliers d'enfants européens marchèrent vers la Méditerranée persuadés que la mer s'ouvrirait devant eux. Elle ne s'ouvrit pas. Beaucoup moururent de faim. D'autres furent vendus comme esclaves.","img":"😢","body":"<p>L'été 1212 vit l'un des épisodes les plus tragiques et les plus surréalistes du Moyen Âge : des dizaines de milliers d'enfants et d'adolescents d'Europe se mirent en marche vers la Terre sainte, convaincus que Dieu leur accorderait ce que les chevaliers adultes avaient échoué à accomplir.</p>\n<p>Deux mouvements distincts émergèrent simultanément. En <strong>France</strong>, un berger de 12 ans nommé <strong>Étienne de Cloyes</strong> prêchait avec une conviction enflammée : il affirmait tenir une lettre du Christ lui-même et promettait que la Méditerranée s'ouvrirait devant les enfants purs. Environ <strong>30 000 enfants</strong> le suivirent jusqu'à Marseille. La mer ne s'ouvrit pas. La plupart rentrèrent chez eux, épuisés. Ceux qui montèrent sur les sept navires offerts par des marchands de Marseille connurent un sort pire : deux navires firent naufrage, et les cinq autres amenèrent leurs passagers en Afrique du Nord, où ils furent <strong>vendus comme esclaves</strong>.</p>\n<p>En <strong>Allemagne</strong>, un jeune nommé <strong>Nicolas de Cologne</strong> dirigeait une colonne similaire vers les Alpes, promettant que la mer s'ouvrirait à Gênes. Après une traversée meurtrière des cols alpins — beaucoup moururent de froid, de faim et d'épuisement — les survivants atteignirent Gênes. La mer ne s'ouvrit pas non plus. Les Génois leur refusèrent l'embarquement. La colonne se désintégra.</p>\n<p>Les historiens débattent encore : s'agissait-il vraiment d'enfants, ou le mot latin <em>pueri</em> désignait-il aussi des pauvres et des marginaux adultes ? La réalité fut probablement un mélange des deux. Mais le noyau d'enfants crédules, manipulés par des prédicateurs illuminés et parfois par des marchands d'esclaves, est attesté par plusieurs sources contemporaines.</p>\n<blockquote>« Seigneur, rends-nous la vraie Croix ! »<small>— Cri de ralliement des enfants croisés, 1212</small></blockquote>"},{"id":21012,"cat":"Histoire","thn":"Rois de France","ths":"⚜️","ti":"Charles VI : le roi de France qui croyait être en verre","s":"Charles VI de France, roi fou, était convaincu d'être fait de verre et pouvait se briser. Il refusait qu'on le touche, portait des vêtements renforcés de fer et ne reconnaissait plus sa femme Isabeau ni ses enfants.","img":"👑","body":"<p>En août 1392, le roi de France Charles VI chevauche en forêt du Mans à la tête d'une troupe armée. Soudain, un lépreux surgit et saisit la bride de son cheval en criant un avertissement. Puis un page laisse tomber une lance, qui claque contre un heaume métallique. Au son de ce choc, <strong>Charles VI dégaine son épée et charge ses propres chevaliers</strong>, tuant quatre hommes avant d'être maîtrisé.</p>\n<p>La crise passa. Mais d'autres suivirent, de plus en plus fréquentes. Le roi de France sombrait dans une folie qui allait durer <strong>30 ans</strong>, jusqu'à sa mort en 1422. Pendant ces trois décennies, la France fut gouvernée par ses oncles, sa femme Isabeau de Bavière, et finalement par les Anglais — pendant que son roi hurlait dans les couloirs du palais ou se croyait mort.</p>\n<p>L'épisode le plus célèbre est la <strong>délire du verre</strong>. À partir d'environ 1405, Charles VI était convaincu d'être fabriqué en verre de Venise et pouvait donc se briser au moindre choc. Il refusait absolument qu'on le touche. Il fallut faire coudre des <em>barres de fer</em> dans ses vêtements pour le protéger d'une chute accidentelle. Il ne reconnaissait plus sa femme, ses enfants, ses ministres.</p>\n<p>Lors d'autres épisodes, il courait en hurlant dans les couloirs de l'Hôtel Saint-Paul à Paris, on devait murer les portes pour l'empêcher de s'échapper. Pendant six mois en 1393, il ne se lava pas et ne se laissa pas couper les cheveux. Les médecins tentèrent tout : saignées, purges, trépanations. Rien ne fonctionnait.</p>\n<p>La France, privée de roi effectif, entra dans l'une des périodes les plus sombres de la guerre de Cent Ans. <strong>Azincourt</strong> (1415) eut lieu pendant une de ses périodes de lucidité partielle — lucidité suffisante pour signer le traité humiliant de Troyes (1420) déshéritant son propre fils.</p>\n<blockquote>« Il était roi de France quand il était lucide, et un pauvre homme quand il était fou. Les deux états duraient également. »<small>— Froissart, <em>Chroniques</em></small></blockquote>"},{"id":21013,"cat":"Histoire","thn":"Louis XIV","ths":"☀️","ti":"Le Roi-Soleil : gouverner à travers des boutons de manchette","s":"À Versailles, assister au lever du roi était un honneur codifié au millimètre : tenir sa chemise valait des fortunes, soutenir sa bougie des privilèges. Louis XIV transformait chaque geste quotidien en instrument de pouvoir politique.","img":"🕯️","body":"<p>Il n'y avait rien d'anodin à Versailles. Chaque minute de la journée de Louis XIV était un spectacle politique minutieusement chorégraphié — et chaque rôle dans ce spectacle représentait une faveur ou une disgrâce.</p>\n<p>Le <em>Grand Lever</em> commençait à <strong>8h30 précises</strong>. D'abord entrait le premier valet de chambre pour réveiller le roi. Puis, en vagues successives selon leur rang, les membres de la famille royale, les grands officiers, les seigneurs. Le privilège suprême ? Tenir la chemise royale au moment où Sa Majesté l'enfilait. Ce geste durait <strong>trois secondes</strong>. Pour l'accomplir, des ducs et des princes se battaient.</p>\n<p>Louis XIV avait compris quelque chose de fondamental : en obligeant la noblesse à vivre à Versailles, à mendier des honneurs symboliques plutôt que de gouverner leurs terres, il la rendait <strong>inoffensive</strong>. Un duc qui passe ses journées à calculer comment décrocher le privilège d'assister au coucher royal n'a pas le temps de comploter des révoltes — et il n'a plus non plus les réseaux locaux qui auraient rendu ces révoltes possibles.</p>\n<p>La mécanique était diaboliquement efficace. Environ <strong>10 000 personnes</strong> vivaient à Versailles ou dans ses dépendances. La noblesse y dépensait des fortunes en vêtements, en jeu, en cadeaux, s'endettant massivement. Un noble endetté dépendait de la pension royale — et donc de la faveur du roi.</p>\n<p>Louis XIV pouvait ruiner un homme simplement en cessant de le regarder. <em>« Le roi ne m'a pas parlé aujourd'hui »</em> était une phrase qui pouvait déclencher une crise de nerfs. Le pouvoir absolu n'avait pas besoin de prisons : il lui suffisait de boutons de manchette et d'un regard détourné.</p>\n<blockquote>« Toute la France, c'est moi. »<small>— Attribué à Louis XIV (possiblement apocryphe, mais parfaitement dans l'esprit du règne)</small></blockquote>"},{"id":21014,"cat":"Histoire","thn":"Révolution française","ths":"🔴","ti":"La Terreur : Robespierre finit sous la même guillotine qu'il avait nourrie","s":"Maximilien Robespierre envoya des milliers de personnes à la guillotine au nom de la Vertu. Le 27 juillet 1794, ses propres alliés le firent arrêter. Le lendemain, il monta sur l'échafaud qu'il avait lui-même dressé.","img":"⚖️","body":"<p>Entre septembre 1793 et juillet 1794, la Révolution française se dévora elle-même. Cette période que l'histoire appelle la <strong>Terreur</strong> fit entre 16 000 et 40 000 morts officiels — guillotinés, fusillés, noyés dans les bateaux coulés à Nantes. À Paris, les charrettes de condamnés traversaient la ville chaque jour sous les regards d'une foule qui commençait à se lasser.</p>\n<p>L'homme au centre de ce système était <strong>Maximilien Robespierre</strong>, député d'Arras, avocat de formation, surnommé \"l'Incorruptible\". Il croyait sincèrement que la Vertu républicaine justifiait l'élimination de ses ennemis — réels ou imaginaires. La liste des ennemis s'allongeait sans cesse : aristocrates, prêtres réfractaires, Girondins, puis Hébertistes, puis Dantonistes, puis quiconque semblait trop modéré ou trop extrémiste.</p>\n<p>Le <strong>8 thermidor an II</strong> (26 juillet 1794), Robespierre prononça un discours alarmant à la Convention. Il parla d'une nouvelle liste de traîtres à éliminer sans préciser les noms. Tous les députés se regardèrent, terrifiés d'être sur cette liste. Le lendemain, le <strong>9 thermidor</strong>, ils se coalisèrent et l'arrêtèrent avant qu'il puisse parler.</p>\n<p>Dans la confusion, Robespierre tenta de se suicider avec un pistolet. Il ne réussit qu'à se fracasser la mâchoire. Blessé, ensanglanté, incapable de parler, il fut traîné devant le Tribunal révolutionnaire — le même qu'il avait utilisé contre tant d'autres. Le procès dura moins d'une heure. <strong>Le 28 juillet 1794</strong>, il monta sur l'échafaud. La foule hurla quand le bourreau arracha le bandage de sa mâchoire avant de basculer la bascule.</p>\n<p>La machine qu'il avait alimentée l'avala à son tour.</p>\n<blockquote>« La Révolution, comme Saturne, dévore successivement ses propres enfants. »<small>— Pierre Vergniaud, girondin guillotiné en 1793</small></blockquote>"},{"id":21015,"cat":"Histoire","thn":"Napoléon Bonaparte","ths":"🎖️","ti":"Napoléon lisait un roman par nuit — même en campagne militaire","s":"Napoléon dévorait la littérature à vitesse phénoménale. Il lut <em>Werther</em> sept fois, annotait Voltaire en marge, et emportait une bibliothèque portative de 600 volumes dans ses campagnes d'Italie et d'Égypte.","img":"📚","body":"<p>L'image du conquérant brutal masque un intellectuel boulimique. Napoléon Bonaparte lisait à une vitesse estimée par ses contemporains à <strong>deux mille mots à la minute</strong> — un chiffre qu'on prendrait pour une légende si ses carnets et la bibliothèque de Sainte-Hélène n'en témoignaient.</p>\n<p>Dès son adolescence à l'École militaire de Brienne, le jeune Corse passionné de mathématiques dévorait aussi <strong>Rousseau, Voltaire, Plutarque et Homère</strong>. Il annotait les marges avec une écriture serrée et sibylline. Ses commentaires de Polybe sur les guerres puniques révèlent un stratège qui lisait l'histoire ancienne comme un manuel tactique.</p>\n<p>En 1798, quand il embarqua pour l'expédition d'Égypte, il emportait dans ses fourgons une <em>bibliothèque portative</em> de <strong>600 volumes</strong> soigneusement sélectionnés, couvrant les sciences, la géographie, la philosophie, la littérature et l'histoire — dont l'Ancien et le Nouveau Testament, le Coran, et les Mille et Une Nuits. Il organisait à bord du navire amiral des discussions littéraires avec ses généraux.</p>\n<p>Sa passion pour <em>Les Souffrances du jeune Werther</em> de Goethe était célèbre : il déclara l'avoir lu <strong>sept fois</strong> et en connaissait des passages par cœur. Quand il rencontra Goethe à Erfurt en 1808, l'entretien dura une heure. Napoléon analysa le roman avec une précision qui laissa l'écrivain stupéfait.</p>\n<p>À Sainte-Hélène, prisonnier sans guerre à mener, il dicta ses <em>Mémoires</em> et lut en six ans des milliers d'ouvrages. Sa bibliothèque finale d'exil comptait encore <strong>3 000 volumes</strong>. L'homme qui avait reconfiguré l'Europe gérait le seul empire qu'on ne pouvait pas lui confisquer : celui de l'esprit.</p>\n<blockquote>« Un chef d'État est le premier historien de son pays. »<small>— Napoléon Bonaparte, <em>Mémorial de Sainte-Hélène</em></small></blockquote>"},{"id":21016,"cat":"Histoire","thn":"Première Guerre mondiale","ths":"🪖","ti":"La trêve de Noël 1914 : quand les ennemis jouèrent au foot dans no man's land","s":"Le 25 décembre 1914, soldats allemands et britanniques sortirent des tranchées et échangèrent des cigarettes, des chansons et une partie de football dans no man's land. Leurs officiers supérieurs furent furieux.","img":"⚽","body":"<p>Le front occidental, décembre 1914. Cinq mois de guerre ont déjà tué des centaines de milliers d'hommes. Les tranchées sont des boyaux de boue, de rats et de corps non récupérés. Et pourtant, la nuit du <strong>24 au 25 décembre</strong>, quelque chose d'improbable se produit sur plusieurs secteurs du front belge et français.</p>\n<p>Du côté allemand, des soldats commencent à décorer les parapets de leurs tranchées avec des petits sapins de Noël allumés — les <em>Tannenbaum</em> — et chantent des cantiques. Les Britanniques en face, interloqués, répondent par des applaudissements. Des voix allemandes crient en anglais : <em>\"Happy Christmas, Tommy !\"</em>. Des Britanniques répondent en allemand.</p>\n<p>Puis des hommes commencent à grimper hors des tranché
