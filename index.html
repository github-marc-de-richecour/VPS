const T={socrates:{n:"Socrate",e:"classical",s:"?"},plato:{n:"Platon",e:"classical",s:"◈"},epicurus:{n:"Épicure",e:"hellenistic",s:"🌿"},seneca:{n:"Sénèque",e:"hellenistic",s:"S"},marcus_aurelius:{n:"Marc Aurèle",e:"hellenistic",s:"👑"},epictetus:{n:"Épictète",e:"hellenistic",s:"⛓"},sun_tzu:{n:"Sun Tzu",e:"eastern",s:"⚔"},descartes:{n:"Descartes",e:"rationalism",s:"∴"},spinoza:{n:"Spinoza",e:"rationalism",s:"◇"},kant:{n:"Kant",e:"rationalism",s:"⬡"},nietzsche:{n:"Nietzsche",e:"existentialism",s:"⚡"},sartre:{n:"Sartre",e:"existentialism",s:"∅"},camus:{n:"Camus",e:"existentialism",s:"☀"},adler:{n:"Adler",e:"applied",s:"🧩"},james_allen:{n:"James Allen",e:"applied",s:"🌱"},peterson:{n:"Peterson",e:"contemporary",s:"🦞"},rumelt:{n:"Rumelt",e:"contemporary",s:"🎯"},joule_beauvois:{n:"Joule & Beauvois",e:"applied",s:"🪤"},greene:{n:"Robert Greene",e:"contemporary",s:"🗡"},carnegie:{n:"Carnegie",e:"applied",s:"🤝"},montaigne:{n:"Montaigne",e:"renaissance",s:"📖"},rousseau:{n:"Rousseau",e:"enlightenment",s:"🌳"},marx:{n:"Marx",e:"critical",s:"⚒"},foucault:{n:"Foucault",e:"postmodern",s:"🔍"},schopenhauer:{n:"Schopenhauer",e:"existentialism",s:"🌑"},hegel:{n:"Hegel",e:"rationalism",s:"↻"},montesquieu:{n:"Montesquieu",e:"enlightenment",s:"⚖"},machiavel:{n:"Machiavel",e:"renaissance",s:"♟"},pascal:{n:"Pascal",e:"rationalism",s:"∞"},hobbes:{n:"Hobbes",e:"rationalism",s:"🐉"},diogenes:{n:"Diogène",e:"classical",s:"🏺"},beauvoir:{n:"S. de Beauvoir",e:"existentialism",s:"♀"},wittgenstein:{n:"Wittgenstein",e:"contemporary",s:"⊢"},rawls:{n:"Rawls",e:"contemporary",s:"⚖"},cialdini:{n:"Cialdini",e:"applied",s:"🧲"},newport:{n:"Cal Newport",e:"contemporary",s:"🧠"},napoleon_hill:{n:"Napoleon Hill",e:"applied",s:"💰"},napoleon:{n:"Napoléon",e:"history",s:"🦅"},de_gaulle:{n:"De Gaulle",e:"history",s:"🇫🇷"},voltaire:{n:"Voltaire",e:"enlightenment",s:"⚡"},diderot:{n:"Diderot",e:"enlightenment",s:"📚"},richelieu:{n:"Richelieu",e:"history",s:"⛪"},jeanne_darc:{n:"Jeanne d'Arc",e:"history",s:"⚔"},hannibal:{n:"Hannibal",e:"history",s:"🐘"},cesar:{n:"Jules César",e:"history",s:"🏛"},spartacus:{n:"Spartacus",e:"history",s:"⛓"},history:{n:"Histoire",e:"history",s:"📜"},science:{n:"Science",e:"contemporary",s:"🔬"},geo:{n:"Géographie",e:"contemporary",s:"🌍"},sport:{n:"Sport",e:"contemporary",s:"⚽"},ai_tech:{n:"IA & Tech",e:"contemporary",s:"🤖"},fun:{n:"Fun Facts",e:"contemporary",s:"🎲"},dalio:{n:"Ray Dalio",e:"contemporary",s:"📊"},thiel:{n:"Peter Thiel",e:"contemporary",s:"🚀"},ferriss:{n:"Tim Ferriss",e:"contemporary",s:"⏱"},holiday:{n:"Ryan Holiday",e:"contemporary",s:"📰"},stratagemes:{n:"36 Stratagèmes",e:"eastern",s:"🐉"}};
const C=[
{id:1,th:"adler",ti:"Tu n'es pas le produit de ton passé",s:"Une mère hurle sur son enfant. Le téléphone sonne. Elle décroche poliment. Raccroche. Recommence à crier. Adler explique pourquoi.",img:"🪞",body:`<p>La psychologie adlérienne opère un renversement radical. Là où Freud creuse dans l'enfance, Adler pointe vers l'avenir : <strong>ce ne sont pas les causes passées qui vous gouvernent, mais les buts que vous poursuivez maintenant.</strong></p><p>Quelqu'un qui ne sort plus de chez lui. Freud dirait : "Maltraité enfant → peur." Adler dirait l'inverse : "Il ne VEUT pas sortir → il fabrique de l'anxiété." Dans le premier cas, prisonnier du passé. Dans le second, architecte — maladroit peut-être — de sa situation.</p><p>Cette idée terrifie. Si je suis responsable de mon anxiété, je ne peux plus me réfugier derrière l'excuse du trauma. Mais Adler y voit une libération : <em>si votre vie se décide ici et maintenant, il n'est jamais trop tard pour changer.</em></p><p>La preuve : une mère hurle sur son enfant. Le téléphone sonne. Elle décroche poliment. Raccroche. Recommence à crier. La colère n'était pas incontrôlable — c'était un outil choisi.</p><blockquote>"Aucune expérience n'est en soi la cause d'un succès ou d'un échec. Nous en faisons ce qui sert notre but."<small>— Alfred Adler</small></blockquote>`},
{id:2,th:"adler",ti:"L'audit de tes excuses",s:"Écris 5 choses que tu 'ne peux pas' faire. Remplace par 'je ne veux pas'. Lis à voix haute. Tu vas comprendre.",img:"🔍",body:`<h3>🧠 L'exercice qui change tout</h3><p>Adler appelle <strong>"style de vie"</strong> ta façon habituelle de penser et d'agir. Tu l'as adopté inconsciemment vers 10 ans — en réponse à ton environnement, ta fratrie, tes premières expériences. La bonne nouvelle : tu peux en choisir un nouveau. À tout moment.</p><p><strong>Étape 1.</strong> Prends un papier. Note 5 choses que tu te dis "ne pas pouvoir" faire. Ex : "Je ne peux pas parler en public", "Je ne peux pas quitter ce job", "Je ne peux pas dire non à ma mère", "Je ne peux pas me lever tôt", "Je ne peux pas épargner."</p><p><strong>Étape 2.</strong> Remplace chaque "je ne peux pas" par "je ne veux pas" (ou "je choisis de ne pas"). Lis chaque phrase à voix haute. Sens la différence ? Le pouvoir revient entre tes mains — mais avec lui, la responsabilité. Et c'est exactement pour ça que tu dis "je ne peux pas" plutôt que "je ne veux pas" : pour éviter cette responsabilité.</p><p><strong>Étape 3.</strong> Pour chaque item, demande-toi : "Quel BUT sert mon inaction ?" Tu trouveras souvent un bénéfice caché : protection de l'ego ("si j'essayais, je réussirais — mais je n'essaie pas"), confort ("c'est plus simple ainsi"), évitement d'un conflit ("si je dis oui, la paix est préservée").</p><p><strong>Étape 4.</strong> Choisis UN item. Un seul. Décide d'un premier micro-pas cette semaine. Pas un grand saut héroïque — un pas. Le courage, pour Adler, c'est exactement ça : l'action malgré la peur, à petite échelle, aujourd'hui.</p><blockquote>"Ce n'est pas la situation qui détermine les gens. Ce sont les gens qui se déterminent eux-mêmes."<small>— Adler, via Kishimi, Le courage de ne pas être aimé</small></blockquote>`},
{id:10,th:"sun_tzu",ti:"Toute guerre est tromperie",s:"Quand tu es capable d'attaquer, fais semblant d'être incapable. Quand tu es proche, fais croire que tu es loin. Bienvenue chez Sun Tzu.",img:"🌫️",body:`<p>Sun Tzu ouvre son traité par un avertissement solennel : la guerre est une affaire de vie ou de mort pour l'État. Pas un jeu, pas un sport — la survie même de la civilisation est en jeu. Puis il livre son premier principe, celui dont tout le reste découle :</p><p style="font-size:18px;text-align:center" class="sf"><em>"Toute guerre repose sur la tromperie."</em></p><p>Quand tu es capable d'attaquer, fais semblant d'être incapable. Quand tu es actif, feins l'inactivité. Quand tu es proche, fais croire que tu es loin. Quand tu es loin, fais croire que tu es proche. Offre un appât pour attirer l'ennemi. Feins le désordre, puis écrase-le.</p><p><strong>Les 5 facteurs constants</strong> qui déterminent l'issue de tout conflit avant même qu'il commence :</p><p>1. <strong>La Loi morale</strong> — Le peuple te suit-il ? Es-tu aligné avec tes troupes ?<br>2. <strong>Le Ciel</strong> — Le timing. La saison. Le momentum.<br>3. <strong>La Terre</strong> — Le terrain. L'avantage géographique. Le positionnement.<br>4. <strong>Le Commandant</strong> — Ta capacité de décision. Vision + courage + discipline.<br>5. <strong>La Méthode</strong> — Ton organisation, ta logistique, tes ressources.</p><p>Si un seul de ces 5 facteurs est défaillant, Sun Tzu recommande de <strong>NE PAS engager le combat</strong>. Le général qui gagne fait ses calculs AVANT la bataille. Celui qui perd calcule peu — ou pas du tout. La victoire se prépare dans le temple, pas sur le champ de bataille.</p><p>En business : le pitch que tu prépares, la négociation que tu anticipes, le marché que tu étudies AVANT d'y entrer — c'est le temple. La plupart des gens entrent sur le champ de bataille sans y avoir mis les pieds.</p><blockquote>"Le général qui gagne une bataille fait beaucoup de calculs avant que la bataille ne soit livrée."<small>— Sun Tzu, L'Art de la guerre, Ch. I</small></blockquote>`},
{id:11,th:"sun_tzu",ti:"Vaincre sans combattre",s:"L'armée la plus puissante n'est pas celle qui gagne 100 batailles — c'est celle qui n'a jamais besoin de se battre.",img:"🕊️",body:`<p><strong>L'excellence suprême n'est pas de gagner cent batailles sur cent.</strong> C'est de soumettre l'ennemi sans combattre. Cette idée, vieille de 2 500 ans, reste la plus radicale de toute la pensée stratégique.</p><p>Sun Tzu établit une hiérarchie claire :</p><p>1. <strong>Détruire la stratégie de l'ennemi</strong> — le mieux. Si tu neutralises son plan avant qu'il ne l'exécute, tu as gagné sans verser une goutte de sang.<br>2. <strong>Briser ses alliances</strong> — isole-le, coupe ses soutiens, retourne ses amis contre lui.<br>3. <strong>Attaquer son armée</strong> — le combat direct, coûteux mais parfois nécessaire.<br>4. <strong>Assiéger ses villes</strong> — le pire. Un aveu d'échec stratégique. Le siège consume ressources, temps et moral.</p><p>En business : le meilleur deal n'est pas celui où tu écrases l'autre partie. C'est celui où l'autre renonce à ses exigences parce que ta position est devenue inattaquable — sans confrontation directe.</p><p>En management : l'idéal est que ton équipe fasse ce qu'il faut sans que tu aies besoin d'ordonner quoi que ce soit. Le leader invisible est le leader suprême.</p><p>Cialdini dirait la même chose avec d'autres mots : la persuasion la plus puissante est celle qui n'est pas perçue comme telle.</p><blockquote>"L'art suprême de la guerre est de soumettre l'ennemi sans combattre."<small>— Sun Tzu, L'Art de la guerre, Ch. III</small></blockquote>`},
{id:20,th:"rumelt",ti:"Pourquoi 90% des 'stratégies' n'en sont pas",s:"Steve Jobs revient chez Apple en 1997. 15 modèles d'ordinateurs. Plus de cash. En 6 mois, il n'en garde que 4. Rumelt explique pourquoi c'est du génie.",img:"🎯",body:`<p>Richard Rumelt, professeur à UCLA pendant 40 ans, a vu défiler des milliers de "stratégies" d'entreprises. Son constat est accablant : <strong>la plupart ne sont pas des stratégies. Ce sont des listes de souhaits déguisées en plans.</strong></p><p>Le <strong>kernel</strong> — le noyau — de toute vraie stratégie contient exactement 3 éléments :</p><p><strong>1. Le DIAGNOSTIC</strong> — Quel est le vrai problème ? Pas "nous voulons grandir" mais "notre problème est que nos clients nous quittent parce que notre support est désastreux." Un médecin qui ne diagnostique pas ne peut pas soigner. Et pourtant, la plupart des "stratégies" sautent cette étape.</p><p><strong>2. La POLITIQUE DIRECTRICE</strong> — L'approche globale. Un panneau indicateur : il montre la direction sans détailler le trajet. "Nous allons nous concentrer exclusivement sur la rétention client." C'est le COMMENT global, pas le détail opérationnel.</p><p><strong>3. Les ACTIONS COHÉRENTES</strong> — Des actes concrets qui se renforcent mutuellement. Pas une liste au Père Noël avec 47 initiatives déconnectées, mais des mouvements coordonnés où chaque action amplifie les autres.</p><p><strong>Steve Jobs, Apple 1997</strong> — le kernel parfait. Diagnostic : trop de produits, pas de cash, perte de focus. Politique : simplifier radicalement. Actions : couper 15 modèles à 4, fermer les imprimantes, externaliser en Asie, ouvrir un web store direct. Chaque action renforce les autres. C'est du "Business 101" — et pourtant personne ne l'a vu venir.</p><p>La bonne stratégie est presque toujours une surprise. Pas parce qu'elle est secrète — mais parce que la plupart des organisations ne font jamais le travail de focus et de sacrifice nécessaire.</p><blockquote>"La stratégie concerne autant ce qu'on NE FAIT PAS que ce qu'on fait."<small>— Richard Rumelt, Good Strategy/Bad Strategy</small></blockquote>`},
{id:30,th:"greene",ti:"Brûle tes vaisseaux",s:"1519. 500 hommes face à un empire. Cortés coule ses propres navires. Plus de retraite possible. Deux ans plus tard, les Aztèques ont perdu.",img:"🔥",body:`<p>1519. Hernán Cortés débarque au Mexique avec 500 hommes face à l'Empire aztèque et ses centaines de milliers de guerriers. Objectivement, c'est un suicide.</p><p>Mais le vrai problème de Cortés n'est pas les Aztèques. C'est <strong>ses propres hommes</strong>. Divisés, indisciplinés, pensant à Cuba, à leurs femmes, à la retraite facile. Dans le port, les navires représentent la possibilité de fuir — et tant que cette option existe, personne ne se battra à mort.</p><p><strong>Cortés fait couler ses propres navires.</strong></p><p>L'effet est immédiat et spectaculaire. Plus de retraite possible. Plus de plans B. Plus de rêveries sur le retour. Chaque homme comprend dans ses tripes : c'est vaincre ou mourir ici, sur cette terre inconnue, loin de tout. L'énergie, la créativité, la détermination explosent. Deux ans plus tard, l'Empire aztèque — vieux de plusieurs siècles, comptant des millions de sujets — est tombé.</p><p>Robert Greene appelle ça le <strong>"death ground"</strong> — concept directement tiré de Sun Tzu (chapitre XI). Un lieu sans issue, dos au mur, où la seule option est d'avancer. Sur le terrain de mort, un homme vaut dix.</p><p>Dostoïevski a vécu une version différente : un simulacre d'exécution. Debout devant le peloton, attendant les balles. Puis gracié à la dernière seconde. À partir de ce jour, chaque minute comptait. Il a écrit Les Frères Karamazov, Crime et Châtiment, L'Idiot — la plus grande production littéraire du XIXe siècle.</p><p><em>Et toi ? Quels sont tes "navires dans le port" — les options de repli qui te rendent mou ? Le CDI confortable, l'héritage potentiel, le plan B flou, l'excuse "si ça ne marche pas, je pourrai toujours..." ? Tant que tu as une sortie de secours, tu ne te battras jamais vraiment.</em></p><blockquote>"Place tes soldats dans une position sans issue, et ils préféreront la mort à la fuite."<small>— Sun Tzu, via Robert Greene, Les 33 Stratégies de la guerre</small></blockquote>`},
{id:31,th:"greene",ti:"Ne combats jamais la dernière guerre",s:"1806. La meilleure armée d'Europe se fait écraser en 3 jours. Leur erreur : ils rejouaient les tactiques d'il y a 50 ans.",img:"♟️",body:`<p>1806. Les généraux prussiens ont 60-70 ans. Ils adorent Frédéric le Grand, mort depuis 20 ans. Leurs formations militaires datent de 50 ans. L'armée prussienne est considérée comme la meilleure d'Europe — par ceux qui vivent dans le passé.</p><p><strong>Napoléon les anéantit en quelques jours.</strong></p><p>À Iéna, le prince Hohenlohe fait défiler ses troupes en ordre de parade parfait — exactement comme Frédéric l'aurait fait. Les Français, eux, sont derrière des murs de jardin, embusqués, mobiles. Les soldats prussiens tombent comme des quilles. Hohenlohe ordonne de se reformer. Ils se reforment. Ils meurent. L'absurdité de rejouer la dernière guerre devant un ennemi qui a inventé la suivante.</p><p>Robert Greene en tire la Stratégie 2, peut-être la plus importante pour la vie quotidienne : <strong>votre esprit est comme une rivière. Plus il coule vite, plus il reste en contact avec le présent. Les pensées obsessionnelles, les formules qui ont marché hier, les habitudes confortables sont comme des rochers qui bloquent le courant.</strong></p><p>Miyamoto Musashi, le plus grand sabreur du Japon, incarnait ce principe : il ne répétait JAMAIS la même tactique. Deux sabres au lieu d'un. Une rame en bois au lieu d'un sabre. Un retard calculé de 3 heures. Un bandeau sale en guise de provocation. Chaque adversaire recevait une surprise unique — et mourait surpris.</p><p>Le général vietnamien Giap se convainquait après chaque victoire que c'était un ÉCHEC. Ainsi, il ne répétait jamais la même stratégie et restait alerte. Le succès est l'ennemi de l'innovation.</p><blockquote>"Votre esprit est comme une rivière. Les pensées obsessionnelles sont des rochers qui bloquent le courant."<small>— Robert Greene, Stratégie n°2</small></blockquote>`},
{id:40,th:"carnegie",ti:"L'arme la plus puissante au monde",s:"Al Capone se considérait comme un bienfaiteur public. Si même lui ne répond pas à la critique, imaginez votre collègue.",img:"💛",body:`<p>Carnegie ouvre son livre par une révélation : <strong>la critique ne fonctionne pas.</strong> Jamais. Sur personne. Al Capone — responsable de centaines de meurtres — se considérait comme un bienfaiteur public. "J'ai passé les meilleures années de ma vie à donner du plaisir aux gens."</p><p>Si même les pires criminels ne répondent pas à la critique, imaginez vos collègues, votre conjoint, vos enfants. La critique blesse l'amour-propre, déclenche le mécanisme de défense, et pousse à la justification. Elle ne change JAMAIS le comportement — elle le renforce.</p><p>Carnegie cite William James : <em>"Le besoin le plus profond de la nature humaine est le désir d'être apprécié."</em> Pas flatté — il distingue nettement la flatterie (fausse, intéressée) de l'appréciation sincère (authentique, spécifique).</p><p><strong>Les 6 lois pour gagner la sympathie :</strong></p><p>1. <strong>Intéressez-vous RÉELLEMENT aux autres</strong> — un chien est le meilleur exemple : il ne vend rien, il est juste content de te voir.<br>2. <strong>Souriez</strong> — un sourire sincère change l'énergie d'une pièce entière.<br>3. <strong>Rappelez-vous du nom des gens</strong> — Napoléon III mémorisait le nom de chaque personne. Le mot préféré de chaque humain est son propre prénom.<br>4. <strong>Écoutez</strong> — soyez un auditeur passionné. La personne la plus intéressante dans une conversation est celle qui écoute le plus.<br>5. <strong>Parlez de ce qui intéresse L'AUTRE</strong> — Roosevelt passait la soirée avant chaque rendez-vous à étudier les passions de son visiteur.<br>6. <strong>Faites sentir à l'autre qu'il est important</strong> — et soyez sincère. Schwab : "Je n'ai jamais critiqué personne."</p><blockquote>"Toute critique est vaine parce qu'elle met l'individu sur la défensive et le pousse à se justifier."<small>— Dale Carnegie, Comment se faire des amis</small></blockquote>`},
{id:50,th:"joule_beauvois",ti:"Le piège du premier oui",s:"Sur une plage, un inconnu vous demande de surveiller ses affaires. Vous dites oui. Un voleur arrive. 95% des gens interviennent. Sans le 'oui' ? 20%.",img:"🪤",body:`<p>Une plage de New York. Un expérimentateur s'installe à côté d'un baigneur. Avant de s'éloigner, il dit : <em>"Excusez-moi, pourriez-vous surveiller mes affaires ?"</em> Tout le monde dit oui. Comment refuser une demande aussi anodine ?</p><p>Quelques minutes plus tard, un complice vient voler le transistor. <strong>95% des baigneurs qui avaient dit "oui" interviennent pour arrêter le voleur.</strong> Parmi ceux à qui on n'a rien demandé ? <strong>20%.</strong></p><p>Ce simple "oui" — extorqué par les conventions sociales, quasi-automatique, impossible à refuser — a transformé des passants en justiciers. Joule et Beauvois appellent ça <strong>l'effet de gel</strong> : une fois qu'une décision est prise, même minuscule, les gens y adhèrent et agissent en conséquence. La décision "gèle" le comportement.</p><p>Le mécanisme est redoutable. En management : faites "choisir" à vos équipes ce que vous vouliez déjà. Elles l'exécuteront avec bien plus de conviction que si vous l'aviez ordonné. En vente : obtenez un premier engagement insignifiant — un bulletin rempli, un "oui" au téléphone, un essai gratuit — et le reste suivra.</p><p>Le paradoxe central du livre : <strong>les gens les plus manipulés sont ceux qu'on laisse les plus "libres".</strong> Car ils ne peuvent attribuer leur comportement à aucune pression externe. "C'est MOI qui ai décidé." Et cette attribution les piège — parce qu'elle crée une cohérence qu'ils se sentent obligés de maintenir.</p><p>Le lien avec Carnegie est direct : faire que l'autre pense avoir décidé lui-même. Le lien avec Cialdini aussi : la preuve sociale et l'engagement fonctionnent sur le même mécanisme d'auto-attribution.</p><blockquote>"Sauf à être perçue comme telle, la manipulation satisfait tout le monde."<small>— Joule & Beauvois, Petit traité de manipulation</small></blockquote>`},
{id:60,th:"socrates",ti:"L'homme qui ne savait rien",s:"L'oracle de Delphes le déclare le plus sage. Stupéfait, il interroge politiciens, poètes, experts. Tous croient savoir. Aucun ne sait. Lui seul sait qu'il ne sait pas.",img:"🏺",body:`<p>L'oracle de Delphes, le temple le plus sacré de la Grèce, déclare Socrate "le plus sage des hommes". Socrate est stupéfait. Lui, sage ? Il ne sait rien du tout.</p><p>Alors il enquête. Il interroge les politiciens — ils croient savoir gouverner, mais s'effondrent à la première question sérieuse. Les poètes — ils créent de belles choses, mais ne comprennent pas ce qu'ils créent. Les artisans — ils maîtrisent leur métier, mais s'imaginent tout savoir parce qu'ils savent une chose.</p><p><strong>Socrate comprend enfin l'oracle :</strong> il est le plus sage parce qu'il est le seul à savoir qu'il ne sait pas. Tous les autres sont doublement ignorants — ils ne savent pas ET ils ne savent pas qu'ils ne savent pas. L'ignorance consciente est supérieure à l'ignorance inconsciente.</p><p>Sa méthode — la <strong>maïeutique</strong> (art d'accoucher les esprits) — consiste à poser des questions. Jamais donner de réponses. Il vous amène à découvrir par vous-même que vos certitudes sont des châteaux de sable. C'est inconfortable. C'est humiliant. Et c'est exactement pour ça qu'Athènes finira par le tuer.</p><p>399 av. J.-C. Condamné à mort pour "corruption de la jeunesse". Ses amis organisent son évasion. <strong>Il refuse.</strong> Fuir serait trahir tout ce qu'il a enseigné. Il boit la ciguë entouré de ses disciples, en discutant sereinement de l'immortalité de l'âme. Ses derniers mots : "Nous devons un coq à Asclépios" — un détail domestique. Un dernier acte de sérénité absolue face à la mort.</p><blockquote>"Une vie sans examen ne vaut pas d'être vécue."<small>— Socrate, in Platon, Apologie, 38a</small></blockquote>`},
{id:61,th:"marcus_aurelius",ti:"Le journal d'un empereur en guerre",s:"L'homme le plus puissant du monde écrit un journal intime chaque soir dans sa tente, sur le front du Danube. Pour ne pas devenir un monstre.",img:"📜",body:`<p>Imagine : tu es l'homme le plus puissant du monde. L'Empire romain s'étend de la Bretagne à la Mésopotamie. Tu commandes des légions. Des millions de personnes dépendent de tes décisions. Tu pourrais avoir tout ce que tu veux — richesse, femmes, pouvoir absolu.</p><p>Et chaque soir, dans ta tente, sur le front du Danube où tu combats les Germains, tu écris un journal. Pas pour la postérité — pour toi-même. Pour garder la tête froide. Pour ne pas devenir le monstre que le pouvoir absolu fabrique inévitablement.</p><p><strong>"Quand tu te lèves le matin, dis-toi : je vais rencontrer un importun, un ingrat, un insolent, un envieux. Ils sont ainsi parce qu'ils ignorent le bien et le mal."</strong></p><p>Les Pensées de Marc Aurèle ne sont pas un traité philosophique. Ce sont des <strong>exercices spirituels quotidiens</strong>. Un rappel constant : le temps presse, la mort approche à chaque instant, contrôle ce que tu peux contrôler (tes jugements), accepte ce que tu ne peux pas (tout le reste).</p><p>Le plus frappant : cet empereur tout-puissant se rappelle sans cesse sa propre insignifiance. <em>"Bientôt tu auras tout oublié, et bientôt tous t'auront oublié."</em> Alexandre le Grand est mort. Son muletier aussi. Où est la différence aujourd'hui ?</p><p>Marc Aurèle ne prêche pas — il se bat contre lui-même. C'est ce qui rend les Pensées si poignantes : ce n'est pas un sage serein qui donne des leçons, c'est un homme qui souffre, qui doute, qui se bat pour rester droit. Et qui gagne — jour après jour, page après page.</p><blockquote>"Tu as le pouvoir sur ton esprit — pas sur les événements extérieurs. Réalise-le, et tu trouveras la force."<small>— Marc Aurèle, Pensées, VI.8</small></blockquote>`},
{id:62,th:"nietzsche",ti:"Vivrais-tu cette vie à l'infini ?",s:"Un démon te dit : tu vas revivre cette vie exactement à l'identique. Chaque honte, chaque joie. Pour l'éternité. Tu dis oui ou non ?",img:"♾️",body:`<p>Un démon te rend visite une nuit. Il te dit : <strong>"Tu vas revivre cette vie exactement à l'identique, pour l'éternité. Chaque douleur, chaque joie, chaque moment de honte, chaque seconde de bonheur. Dans le même ordre. Pour toujours."</strong></p><p>Est-ce que tu te jettes à ses pieds en le suppliant d'arrêter ? Ou est-ce que tu lui réponds : <em>"Tu es un dieu, et jamais je n'ai entendu rien de plus divin"</em> ?</p><p>C'est le test suprême de l'<strong>amor fati</strong> — l'amour du destin. Si tu peux dire oui à l'éternel retour de ta vie telle qu'elle est, tu as atteint l'affirmation maximale de l'existence. Tu ne voudrais rien changer — pas même les pires moments.</p><p>Nietzsche ne dit pas que l'éternel retour est physiquement vrai. C'est un <strong>critère existentiel</strong> — un outil pour évaluer chacune de tes décisions. Vis chaque instant comme si tu devais le revivre éternellement. Chaque lâcheté, chaque compromis, chaque heure gaspillée sur ton téléphone — pour toujours.</p><p>Cette pensée devrait transformer chacune de tes décisions. Si tu ne supportes pas l'idée de revivre éternellement ta journée d'aujourd'hui, c'est que tu vis mal. Change quelque chose. Maintenant.</p><p>Le lien avec Marc Aurèle est direct : memento mori (souviens-toi que tu vas mourir) et amor fati (aime ton destin) sont les deux faces de la même médaille. La mort donne de l'urgence. L'éternel retour donne de la profondeur.</p><blockquote>"Il faut encore avoir du chaos en soi pour enfanter une étoile qui danse."<small>— Nietzsche, Zarathoustra, Prologue §5</small></blockquote>`},
{id:63,th:"camus",ti:"Sisyphe, le héros absurde",s:"Un rocher. Une montagne. L'éternité. Il sait que le rocher va retomber. Et pourtant il redescend le chercher. Camus dit : il est heureux.",img:"🪨",body:`<p>Le monde n'a pas de sens. L'homme en cherche un. Cette confrontation entre l'appel humain au sens et le silence déraisonnable du monde, Camus l'appelle <strong>l'absurde</strong>.</p><p>Face à l'absurde, trois options :<br><strong>1. Le suicide</strong> — Camus le refuse. Supprimer le problème en supprimant le questionneur, c'est capituler. Le problème reste entier.<br><strong>2. Le saut de foi</strong> — Se réfugier dans la religion ou l'idéologie. Camus le refuse aussi. C'est tricher — inventer un sens là où il n'y en a pas pour se rassurer.<br><strong>3. La révolte</strong> — Accepter l'absurde ET continuer à vivre pleinement. C'est le seul choix cohérent.</p><p>Sisyphe est condamné par les dieux à rouler un rocher au sommet d'une montagne. Le rocher retombe. Il recommence. Pour l'éternité.</p><p><strong>L'instant crucial, pour Camus, c'est la redescente.</strong> Sisyphe vient de voir son rocher dévaler la pente. Il sait qu'il va tout recommencer. Il est pleinement conscient de l'absurdité de sa tâche. Et pourtant il redescend. C'est dans cette conscience lucide que réside sa victoire sur les dieux.</p><p>Sisyphe n'est pas résigné — il est <strong>révolté</strong>. Il refuse de se soumettre mentalement même si son corps est enchaîné. La lutte vers les sommets suffit à remplir un cœur d'homme. Le bonheur n'a pas besoin de sens — il a besoin de conscience et de liberté.</p><blockquote>"Il faut imaginer Sisyphe heureux."<small>— Camus, Le Mythe de Sisyphe</small></blockquote>`},
{id:64,th:"epictetus",ti:"La seule liberté qui compte",s:"Son maître lui tord la jambe. Il dit calmement : 'Tu vas la casser.' La jambe casse. 'Je te l'avais dit.' Il deviendra le plus grand stoïcien de Rome.",img:"⛓️",body:`<p>Épictète naît esclave vers 50 après J.-C. Son maître, Épaphrodite (lui-même affranchi de Néron), lui tord la jambe un jour. Épictète dit calmement : <em>"Tu vas la casser."</em> La jambe casse. Il dit : <em>"Je te l'avais dit."</em> Il boitera toute sa vie.</p><p>Libéré, il devient le philosophe le plus influent de l'Empire romain. Son enseignement tient en une seule distinction — la plus puissante de toute l'histoire de la philosophie pratique :</p><p><strong>Ce qui dépend de toi :</strong> tes jugements, tes désirs, tes impulsions, tes réactions. En un mot : ta vie intérieure. C'est tout. Mais c'est TOUT ce dont tu as besoin.</p><p><strong>Ce qui ne dépend PAS de toi :</strong> ton corps, ta réputation, ta richesse, tes possessions, les opinions des autres, la météo, le trafic, la politique. En un mot : tout le reste.</p><p>La plupart des gens souffrent parce qu'ils tentent de contrôler ce qui ne dépend pas d'eux (l'opinion des autres, le résultat d'un entretien, le comportement de leur conjoint) et négligent ce qui en dépend (leur propre attitude, leur préparation, leur réponse émotionnelle).</p><p><strong>L'esclave qui maîtrise ses jugements est plus libre que le maître qui ne maîtrise pas ses passions.</strong> Épictète l'a prouvé dans sa propre chair — esclave de corps, libre d'esprit.</p><p>Cette idée fonde directement la thérapie cognitive-comportementale (TCC) moderne. Aaron Beck et Albert Ellis ont explicitement reconnu leur dette envers les stoïciens. Quand ton thérapeute te demande "quelle est la pensée derrière cette émotion ?", c'est du pur Épictète.</p><blockquote>"Ce ne sont pas les choses qui nous troublent, mais nos opinions sur les choses."<small>— Épictète, Manuel, V</small></blockquote>`},
{id:70,th:"peterson",ti:"Les homards et la sérotonine",s:"Le Prozac fonctionne sur les homards. Ils se redressent, déploient leurs pinces, attirent les femelles. Ça dit quelque chose sur toi.",img:"🦞",body:`<p>Le homard a un système nerveux à sérotonine <strong>identique au nôtre</strong>. Quand un homard gagne un combat, son taux de sérotonine monte. Il se tient droit, déploie ses pinces, occupe l'espace. Les femelles le préfèrent. Il obtient les meilleurs abris.</p><p>Le homard vaincu se recroqueville. Son taux de sérotonine chute. Il fuit les confrontations. Il occupe les pires abris. Si tu lui injectes du Prozac, il se redresse et retrouve confiance. <strong>Le Prozac fonctionne sur les homards.</strong></p><p>Le point de Peterson : la hiérarchie n'est pas un "construit social" inventé par le patriarcat occidental. <strong>Elle est câblée dans notre biologie depuis 350 millions d'années</strong> — bien avant les arbres, avant les dinosaures, avant les mammifères. Le système limbique qui régit le statut social chez les humains est une version mise à jour du même circuit que chez le homard.</p><p>D'où la Règle 1 : <em>"Tiens-toi droit, les épaules en arrière."</em> Ce n'est pas un conseil de posture de coach en développement personnel. C'est un <strong>signal neurochimique</strong>. Ta posture influence ta chimie → ta chimie influence ta confiance → ta confiance influence ta position dans la hiérarchie → ta position influence tes opportunités.</p><p>Le principe de Matthieu s'applique brutalement : "À celui qui a, on donnera encore. À celui qui n'a pas, on ôtera même ce qu'il a." Les homards dominants deviennent de plus en plus dominants. Les vaincus s'enfoncent. Le cercle vertueux — ou vicieux — commence par la posture.</p><p>Ce n'est pas du déterminisme : Peterson dit justement que tu peux CHOISIR de te redresser. Le premier pas est physique — et le reste suit.</p><blockquote>"Les hiérarchies de dominance sont plus anciennes que les arbres."<small>— Jordan Peterson, 12 Règles pour une vie</small></blockquote>`},
{id:80,th:"james_allen",ti:"Ton esprit est un jardin",s:"1903. Un ouvrier anglais autodidacte écrit un livre de 50 pages. 120 ans plus tard, il a changé des millions de vies. Sa thèse tient en 8 mots.",img:"🌱",body:`<p>1903. James Allen, un ouvrier anglais autodidacte, publie un livre de 50 pages qui changera des millions de vies. Sa thèse est d'une simplicité absolue :</p><p style="font-size:20px;text-align:center" class="sf"><em>"L'homme est littéralement ce qu'il pense."</em></p><p>L'esprit est un jardin. Tu peux le cultiver intelligemment — ou le négliger. Mais dans les deux cas, il produira quelque chose. Si tu ne plantes pas délibérément de bonnes pensées, les mauvaises herbes (peur, anxiété, ressentiment, doute) pousseront toutes seules. Et elles donneront des fruits : stagnation, échec, amertume.</p><p><strong>Les pensées sont des graines. Le caractère est la plante. Les circonstances sont le fruit.</strong></p><p>Allen ne fait pas de la "pensée positive" à la Disney. C'est de la <strong>discipline mentale profonde</strong> : surveiller chaque pensée qui entre dans ton esprit, arracher celles qui sont nuisibles, cultiver celles qui sont justes. Du jardinage patient, quotidien, sans glamour.</p><p>Le parallèle avec Marc Aurèle est frappant. 1 800 ans plus tôt, l'empereur écrivait : <em>"Ta vie est ce qu'en font tes pensées."</em> Avec Adler aussi : nos circonstances ne nous déterminent pas — c'est le SENS que nous leur donnons qui nous détermine.</p><p>Et avec Napoleon Hill : l'autosuggestion — programmer consciemment son subconscient — est exactement la technique que Allen décrit avec la métaphore du jardin. Plante consciemment, ou les mauvaises herbes pousseront.</p><blockquote>"Le calme de l'esprit est l'un des plus beaux joyaux de la sagesse. C'est le résultat d'un long et patient effort de maîtrise de soi."<small>— James Allen, As a Man Thinketh</small></blockquote>`},
{id:90,th:"spinoza",ti:"L'homme excommunié pour avoir trop pensé",s:"23 ans. Excommunié. Banni. Interdit de contact avec sa propre famille. Son crime ? Avoir pensé que Dieu et la Nature sont la même chose.",img:"◇",body:`<p>1656. Baruch Spinoza a 23 ans. La synagogue d'Amsterdam prononce contre lui le <em>herem</em> — la plus terrible des excommunications. Interdit de contact avec quiconque, y compris sa propre famille. Banni de la communauté juive pour toujours.</p><p>Son crime : penser que Dieu et la Nature sont une seule et même chose. <em>Deus sive Natura.</em> Il n'y a pas un Dieu créateur séparé du monde — il n'y a qu'une seule substance infinie dont tout ce qui existe est une expression.</p><p>L'Éthique (publiée après sa mort en 1677) est rédigée <em>more geometrico</em> — avec des axiomes, des définitions et des démonstrations, exactement comme un traité de géométrie. L'idée est folle : <strong>prouver les vérités sur Dieu, l'âme et la liberté avec la même rigueur qu'un théorème de maths.</strong></p><p>Sa thèse la plus radicale : <strong>le libre arbitre est une illusion complète.</strong> "Les hommes se croient libres parce qu'ils ont conscience de leurs volontés et ne pensent pas aux causes qui les disposent à désirer." Tu crois choisir — mais tes choix sont déterminés par des causes que tu ignores.</p><p>Mais Spinoza n'est pas un fataliste. La vraie liberté n'est pas de choisir sans contrainte — c'est de <strong>comprendre sa propre nécessité</strong>. Plus tu comprends les causes qui te déterminent, plus tu es libre. La connaissance est la seule vraie libération. L'ignorance est la seule vraie prison.</p><p>Le parallèle avec Adler est saisissant : Adler aussi dit que comprendre tes mécanismes (ton "style de vie") est le premier pas vers le changement. Et comme Spinoza, il dit que l'ignorance de ces mécanismes est ce qui te maintient prisonnier.</p><blockquote>"Les hommes se croient libres parce qu'ils ignorent les causes qui les déterminent."<small>— Spinoza, Éthique, I, Appendice</small></blockquote>`},
{id:100,th:"joule_beauvois",ti:"Le pied-dans-la-porte",s:"Des ménagères signent une petite pétition. Quelques jours plus tard, on leur demande de planter un ÉNORME panneau dans leur jardin. 55% acceptent. Sans la pétition ? 17%.",img:"🚪",body:`<p>Freedman et Fraser (1966) demandent à des ménagères de poser un <strong>énorme panneau "CONDUISEZ PRUDEMMENT"</strong> dans leur jardin. 17% acceptent normalement.</p><p>Mais si, quelques jours avant, on leur avait fait signer une petite pétition pour la sécurité routière (un acte minuscule, impossible à refuser), <strong>55% acceptent le panneau géant</strong>. Triple.</p><p>Le mécanisme : en signant la pétition, la ménagère s'est identifiée comme "quelqu'un qui se mobilise pour les bonnes causes". Cette identité persiste. Quand la grosse demande arrive, elle est cohérente avec cette image de soi.</p><p>Joule & Beauvois montrent que l'acte préparatoire n'a même pas besoin d'être lié à la demande finale. Signer pour l'environnement prédispose à accepter un panneau de sécurité routière — parce que les deux relèvent du "militantisme".</p><p><strong>Application :</strong> ne demande jamais un gros service en premier. Commence par un micro-engagement. "Tu aurais deux minutes ?" mène à "Tu pourrais m'aider samedi ?" bien plus sûrement qu'une demande directe.</p><blockquote>"Obtenir un petit acte libre prédispose à en obtenir un bien plus grand qui s'inscrit dans sa continuité."<small>— Joule & Beauvois, Petit traité de manipulation, Ch. IV</small></blockquote>`},
{id:101,th:"joule_beauvois",ti:"La porte-au-nez",s:"'Consacrez 2 heures par semaine pendant 2 ANS à un délinquant.' Tout le monde refuse. 'Et juste l'accompagner au zoo 2 heures ?' 50% acceptent. Sans la première demande ? 16%.",img:"🚪",body:`<p>Cialdini (1975) demande à des étudiants d'accompagner de jeunes délinquants au zoo pendant 2 heures. <strong>16% acceptent.</strong></p><p>Mais s'il commence par une demande absurde — "Accepteriez-vous de consacrer 2 heures par semaine pendant 2 ANS à un jeune délinquant ?" (tout le monde refuse) — puis enchaîne avec le zoo, <strong>50% acceptent</strong>. Triple.</p><p>C'est l'exact inverse du pied-dans-la-porte. Au lieu d'un petit oui qui mène à un grand, c'est un grand NON qui mène à un oui modéré.</p><p>Pourquoi ? Cialdini invoque la <strong>norme de réciprocité</strong> : l'expérimentateur a "fait une concession" en passant de la grosse demande à la petite. La personne se sent obligée de faire une concession en retour — en disant oui.</p><p>Condition essentielle : les deux demandes doivent venir de la <strong>même personne</strong> et être formulées <strong>dans la foulée</strong>. Si 24h passent, l'effet disparaît complètement.</p><blockquote>"Demandez d'abord quelque chose qu'on ne peut accepter — puis, comme si vous faisiez une concession, formulez votre vraie demande."<small>— Cialdini, via Joule & Beauvois, Ch. V</small></blockquote>`},
{id:102,th:"joule_beauvois",ti:"Le toucher qui change tout",s:"Un chercheur touche l'avant-bras de passants en leur demandant de rendre des pièces trouvées. Sans toucher : 63% rendent. Avec toucher : 93%.",img:"🤝",body:`<p>Kleinke (1977) laisse délibérément des pièces de monnaie dans des cabines téléphoniques. Quand les gens sortent avec l'argent trouvé et qu'il leur demande : <em>"N'auriez-vous pas trouvé mes pièces ?"</em>, <strong>63% les rendent.</strong></p><p>Même expérience. Mais cette fois, en posant la question, il touche légèrement l'avant-bras de son interlocuteur pendant 1 à 2 secondes. <strong>93% rendent l'argent.</strong></p><p>Un contact physique de 2 secondes — un geste si léger que la plupart des gens ne le remarquent même pas consciemment — fait passer le taux de restitution de 63 à 93%. C'est stupéfiant.</p><p>Depuis les années 70, plus de <strong>300 études scientifiques</strong> ont confirmé le phénomène. Le toucher augmente les pourboires au restaurant (+15%), la compliance en classe, la confiance envers un thérapeute, le temps passé dans un magasin.</p><p>Le plus troublant : dans l'expérience de Smith, Gier et Willis (1982) au supermarché de Kansas City, un démonstrateur fait goûter de la pizza. Les personnes touchées au bras ne trouvent PAS la pizza meilleure. Mais elles l'achètent <strong>DEUX FOIS plus souvent.</strong></p><blockquote>"Si vous voulez rester maître de vous-même en toutes circonstances, n'acceptez pas qu'on vous touche."<small>— Joule & Beauvois, Ch. VI</small></blockquote>`},
{id:103,th:"joule_beauvois",ti:"'Vous êtes libre de…'",s:"'Mais vous êtes libre d'accepter ou de refuser.' Cette phrase fait passer l'acceptation de 10% à 47%. Presque cinq fois plus.",img:"🗝️",body:`<p>Guéguen et Pascual (2000) réalisent une expérience dans les rues de Vannes. Un jeune homme aborde des passants : <em>"Excusez-moi, auriez-vous un peu de monnaie pour prendre le bus ?"</em></p><p>Résultat : <strong>10% des passants donnent.</strong></p><p>Même demande. Mais cette fois, il ajoute sept mots : <em>"Mais vous êtes libre d'accepter ou de refuser."</em></p><p>Résultat : <strong>47,5% donnent.</strong> Presque cinq fois plus. Et les donneurs sont plus généreux.</p><p>Le paradoxe est total : <strong>en rappelant explicitement à la personne qu'elle est libre de refuser, on augmente massivement la probabilité qu'elle accepte.</strong></p><p>Pourquoi ? Parce que le sentiment de liberté est le CARBURANT de l'engagement. Si je sens qu'on me force → je résiste (réactance). Si je sens que JE décide librement → j'assume mon choix et je ne peux plus me défiler.</p><blockquote>"On gagne toujours à déclarer libre la personne dont on souhaite infléchir le comportement."<small>— Guéguen & Pascual, 2000</small></blockquote>`},
{id:110,th:"sun_tzu",ti:"Les 5 facteurs appliqués à ta vie",s:"Avant ta prochaine décision importante, passe-la au crible des 5 facteurs de Sun Tzu. Si un seul manque : n'engage pas le combat.",img:"📐",body:`<h3>🧠 Exercice stratégique</h3><p>Pense à ton prochain défi (projet, négociation, décision de carrière). Évalue-le sur les 5 facteurs de Sun Tzu :</p><p><strong>1. LOI MORALE</strong> — Ton entourage te soutient-il ?</p><p><strong>2. CIEL</strong> — Le timing est-il bon ?</p><p><strong>3. TERRE</strong> — Le terrain t'avantage-t-il ?</p><p><strong>4. COMMANDANT</strong> — Es-tu prêt ? Vision + courage + discipline ?</p><p><strong>5. MÉTHODE</strong> — Organisation, ressources — tout est-il en place ?</p><p>Si un seul facteur est défaillant : <strong>n'engage pas le combat.</strong> Attends d'avoir les 5.</p><blockquote>"Ces cinq facteurs doivent être familiers à tout général."<small>— Sun Tzu, I.11</small></blockquote>`},
{id:111,th:"sun_tzu",ti:"La rapidité est l'essence de la guerre",s:"Il n'y a pas d'exemple d'un pays ayant bénéficié d'une guerre prolongée. Les armes s'émoussent, l'ardeur retombe. En business aussi.",img:"⚡",body:`<p><strong>"Il n'y a pas d'exemple d'un pays ayant bénéficié d'une guerre prolongée."</strong> Sun Tzu est catégorique. Les armes s'émoussent, l'ardeur retombe, les ressources s'épuisent.</p><p>Le Japon en 1941 l'a appris à ses dépens. Pearl Harbor était brillant tactiquement — mais la guerre prolongée contre l'industrie américaine était perdue d'avance. Yamamoto le savait : <em>"J'ai peur que nous n'ayons fait que réveiller un géant endormi."</em></p><p>Sun Tzu recommande de <strong>"fourrager sur l'ennemi"</strong> — utiliser les ressources du terrain plutôt que de tout transporter depuis chez soi. En business : bootstrap, lean, utiliser les outils existants.</p><p>Le parallèle avec Cal Newport est direct : un travail de 4h concentrées bat un travail de 12h dispersées. La rapidité n'est pas la vitesse — c'est l'efficience.</p><blockquote>"Dans la guerre, que votre grand objectif soit la victoire, pas les longues campagnes."<small>— Sun Tzu, L'Art de la guerre, Ch. II</small></blockquote>`},
{id:120,th:"rumelt",ti:"David, Goliath et le pouvoir caché",s:"Sam Walton ouvre des magasins discount dans des villes trop petites. Tout le monde le prend pour un fou. Il devient l'homme le plus riche du monde.",img:"🪨",body:`<p>Rumelt réinterprète David et Goliath. La force de David n'était PAS le courage — c'était un <strong>changement de perspective</strong>.</p><p>Goliath avait : taille, armure, expérience, force. David avait : une fronde. Mais la fronde délivre de la force à distance avec précision — rendant tous les avantages de Goliath <strong>inutiles</strong>.</p><p>Wal-Mart a fait pareil. La sagesse conventionnelle disait : "Un magasin discount a besoin de 100 000 habitants minimum." Sam Walton a mis de gros magasins dans de petites villes.</p><p>Absurde ? Non. Parce que Walton ne pensait pas en termes de "magasin" mais de <strong>RÉSEAU</strong>. Un réseau de 150 magasins, relié par une logistique informatisée, sert des millions de personnes.</p><p>Kmart, qui pensait en "magasins individuels décentralisés", n'a jamais compris le jeu et a fait faillite.</p><blockquote>"Les meilleures stratégies viennent d'un changement de perspective qui révèle des avantages cachés."<small>— Richard Rumelt</small></blockquote>`},
{id:121,th:"rumelt",ti:"Desert Storm : pourquoi le Plan A surprend toujours",s:"1991. La presse s'attend à un bain de sang. 250 000 soldats se déplacent secrètement à l'ouest. La guerre terrestre dure 100 heures.",img:"🗺️",body:`<p>1991. La presse s'attend à un bain de sang au Koweït : tranchées, guerre de position, Vietnam 2.0.</p><p>Schwarzkopf exécute un "crochet gauche" : pendant que le monde regarde les Marines au sud, <strong>250 000 soldats</strong> se déplacent secrètement à l'ouest et frappent le flanc irakien. La guerre terrestre dure <strong>100 heures</strong>.</p><p>Le plus remarquable : cette manœuvre est décrite dans le manuel de l'armée américaine, accessible pour 25 dollars. C'est le "Plan A" officiel — l'enveloppement.</p><p><strong>Alors pourquoi était-ce une surprise ?</strong></p><p>Rumelt : parce que personne ne s'attend à ce qu'une organisation aussi complexe fasse RÉELLEMENT un choix focalisé et s'y tienne. Schwarzkopf a dû dire non à l'armée de l'air, aux Marines, à chaque partenaire de coalition.</p><blockquote>"La vraie surprise est qu'une stratégie pure et focalisée ait réellement été mise en œuvre."<small>— Rumelt, Ch. 1</small></blockquote>`},
{id:130,th:"greene",ti:"Présence d'esprit : deux tactiques opposées",s:"Nelson met son télescope devant son œil aveugle pour ignorer l'ordre de retraite. Hitchcock dort sur le plateau. Deux chemins vers le même calme.",img:"🧘",body:`<p><strong>Tactique 1 : L'hyperagressivité (Nelson à Copenhague, 1801)</strong></p><p>Parker ordonne la retraite. Nelson met son télescope devant son œil aveugle : "Je ne vois vraiment pas le signal." Il continue le bombardement. Les Danois se rendent une heure plus tard.</p><p>Quand la peur menace, <strong>doublez la mise</strong>. L'hésitation est plus dangereuse que l'erreur.</p><p><strong>Tactique 2 : Le Bouddha détaché (Hitchcock)</strong></p><p>Sur le plateau, Hitchcock dormait. En réalité, il avait tout planifié dans les moindres détails. Rien ne pouvait le surprendre.</p><p>La présence d'esprit n'est pas innée. Elle vient soit de la <strong>préparation absolue</strong> (Hitchcock), soit du <strong>courage brut</strong> (Nelson). L'idéal est de combiner les deux.</p><blockquote>"La présence d'esprit est la capacité de se détacher du chaos du champ de bataille."<small>— Robert Greene, Stratégie n°3</small></blockquote>`},
{id:131,th:"greene",ti:"Déclare la guerre : la stratégie de polarité",s:"10 000 mercenaires grecs perdus en Perse. Leurs chefs assassinés. Panique totale. Un homme déclare la guerre ouverte — et sauve tout le monde.",img:"⚔️",body:`<p>Xénophon, 401 av. J.-C. 10 000 mercenaires grecs perdus en Perse. Leurs chefs ont été assassinés par les Perses. Les soldats paniquent, se saoulent, s'effondrent.</p><p>Xénophon comprend : le problème n'est pas les Perses — c'est l'état mental des Grecs. Divisés, confus, sans direction. Sa solution : <strong>déclarer la guerre ouverte.</strong> Plus de négociation. Eux ou nous.</p><p>L'effet est immédiat : avec un ennemi clairement identifié, les Grecs retrouvent cohésion, énergie et créativité. Ils finissent par rentrer chez eux.</p><p><strong>Thatcher</strong> a fait pareil : elle se créait systématiquement des ennemis. Chaque ennemi la rendait plus nette, plus déterminée.</p><p>Le danger : devenir paranoïaque. Roosevelt polarisait puis réconciliait — c'est la maîtrise.</p><blockquote>"Tout ce qui est nécessaire, c'est que votre adversaire vous remplisse de direction et d'énergie."<small>— Robert Greene, Stratégie n°1</small></blockquote>`},
{id:140,th:"carnegie",ti:"Le secret de Socrate",s:"Carnegie appelle ça 'le secret de Socrate'. Chaque oui que tu obtiens rapproche l'autre de ta conclusion — et il pense y être arrivé tout seul.",img:"💬",body:`<p>Carnegie appelle ça "le secret de Socrate" — peut-être la technique de persuasion la plus élégante jamais documentée.</p><p>Le principe : <strong>quand quelqu'un dit "oui", tout son organisme est en disposition d'acceptation.</strong> Quand il dit "non", tout se raidit. Le "non" est un état physiologique autant qu'intellectuel.</p><p>Donc : ne commence JAMAIS une discussion par les points de désaccord. Pose des questions auxquelles l'autre ne peut répondre que "oui".</p><p><em>"Vous voulez que vos enfants réussissent, n'est-ce pas ?"</em> — Oui. <em>"Vous pensez que l'éducation est importante ?"</em> — Oui. <em>"Alors voici ce que je propose..."</em></p><p>Chaque "oui" rapproche l'autre de ta conclusion — et il pense y être arrivé <strong>TOUT SEUL</strong>.</p><p>C'est exactement le mécanisme du pied-dans-la-porte de Joule & Beauvois — un petit engagement prédispose au suivant.</p><blockquote>"Quand vous discutez, ne commencez jamais par les points de désaccord. Commencez par ce sur quoi vous êtes d'accord."<small>— Dale Carnegie, Ch. 14</small></blockquote>`},
{id:141,th:"carnegie",ti:"Comment corriger sans se faire détester",s:"Commencez par un compliment. Parlez d'abord de VOS erreurs. Posez des questions au lieu de donner des ordres. Les 9 règles du management humain.",img:"👑",body:`<p>Quatrième partie du livre — la plus utile pour un manager :</p><p><strong>1.</strong> Commencez par un compliment sincère avant toute critique.</p><p><strong>2.</strong> Attirez l'attention sur les erreurs de manière <em>indirecte</em>.</p><p><strong>3.</strong> Parlez d'abord de VOS propres erreurs.</p><p><strong>4.</strong> Posez des questions au lieu de donner des ordres.</p><p><strong>5.</strong> Ménagez l'amour-propre. Toujours.</p><p><strong>6.</strong> Louez le moindre progrès.</p><p><strong>7.</strong> Attribuez à l'autre une réputation à défendre.</p><p><strong>8.</strong> Encouragez. Rendez les erreurs faciles à corriger.</p><p><strong>9.</strong> Faites en sorte que l'autre soit heureux de faire ce que vous voulez.</p><blockquote>"Les principes de ce livre ne fonctionnent que s'ils viennent du cœur."<small>— Dale Carnegie</small></blockquote>`},
{id:150,th:"adler",ti:"Tous les problèmes sont relationnels",s:"La personne la plus forte dans notre culture est le bébé. Il obtient tout — par sa vulnérabilité. Adler explique.",img:"🪞",body:`<p>Adler est catégorique : <strong>TOUS nos problèmes sont des problèmes de relations interpersonnelles.</strong></p><p>Le mot allemand <em>Minderwertigkeitsgefühl</em> — sentiment d'avoir moins de valeur. Mais la valeur est toujours relative.</p><p>Adler distingue trois niveaux :</p><p>• Le <strong>SENTIMENT</strong> d'infériorité — normal, moteur de progrès<br>• Le <strong>COMPLEXE</strong> d'infériorité — une excuse : "A, donc pas B"<br>• Le <strong>COMPLEXE de supériorité</strong> — une compensation : se vanter</p><p>La faiblesse peut être très puissante. Adler observe : <em>"La personne la plus forte dans notre culture est le bébé."</em> Il obtient tout par sa vulnérabilité.</p><p>La "séparation des tâches" est la solution : distingue ce qui est TA tâche de ce qui est la tâche de l'AUTRE.</p><blockquote>"Pour se débarrasser de ses problèmes, tout ce qu'on peut faire, c'est vivre seul dans l'univers."<small>— Alfred Adler</small></blockquote>`},
{id:160,th:"peterson",ti:"Compare-toi à qui tu étais hier",s:"Le réseau social te compare horizontalement — aux autres. La seule comparaison qui compte est verticale : toi hier vs toi aujourd'hui.",img:"📈",body:`<p>Peterson, Règle 4 : <em>"Compare-toi à qui tu étais hier, pas à quelqu'un d'autre aujourd'hui."</em></p><p>Le réseau social est une machine à comparaison horizontale. Tu vois le highlight reel de tout le monde — les vacances à Bali, la promotion, le corps sculpté. Et tu compares avec ton mardi matin pluvieux.</p><p>Mais la comparaison horizontale est <strong>toujours perdante</strong>. Il y aura toujours quelqu'un de plus riche, plus beau, plus avancé. Ce jeu n'a pas de fin.</p><p>La seule comparaison qui a du sens est <strong>verticale</strong> : toi hier vs toi aujourd'hui. As-tu progressé — même d'un millimètre ?</p><p>Le cercle vertueux : progrès → confiance → posture → sérotonine → progrès. C'est le mécanisme des homards. Le premier pas est microscopique — mais il enclenche la spirale.</p><blockquote>"Poursuis ce qui a du sens, pas ce qui est expédient."<small>— Jordan Peterson, 12 Règles, Règle 7</small></blockquote>`},
{id:170,th:"seneca",ti:"La brièveté de la vie",s:"'Tu vis comme si tu allais vivre éternellement. Tu ne remarques pas combien de temps a déjà passé.' Sénèque a écrit ça il y a 2 000 ans. C'est pire aujourd'hui.",img:"⏳",body:`<p>Sénèque écrit au premier siècle. Son traité <em>De brevitate vitae</em> pourrait avoir été écrit ce matin :</p><p><strong>"Ce n'est pas que nous disposions de très peu de temps, c'est plutôt que nous en perdons beaucoup."</strong></p><p>Des gens se plaignent de manquer de temps — et passent 4 heures par jour sur leur téléphone. Le problème n'est jamais le temps. Le problème est toujours la priorité.</p><p>Le plus brutal : <strong>nous sommes radins avec notre argent mais prodigues avec notre temps.</strong> L'argent perdu se regagne. Le temps perdu est perdu — à jamais.</p><p>Seul le sage vit réellement, car il vit dans le présent. Les autres préparent toujours un avenir qui ne vient jamais — "quand j'aurai le job, quand les enfants seront grands". Ce moment n'arrivera pas. Commence maintenant.</p><blockquote>"C'est quand on ne sait pas vers quel port on navigue qu'aucun vent n'est favorable."<small>— Sénèque, Lettres à Lucilius, LXXI</small></blockquote>`},
{id:180,th:"plato",ti:"L'allégorie de la Caverne",s:"Des prisonniers enchaînés ne voient que des ombres sur un mur. L'un se libère. Dehors : le soleil. Il revient prévenir les autres. Ils le prennent pour un fou.",img:"🕯️",body:`<p>L'image la plus puissante de toute l'histoire de la philosophie — et elle a 2 400 ans :</p><p>Des prisonniers sont enchaînés dans une caverne depuis leur naissance. Derrière eux, un feu. Des hommes passent en portant des objets. <strong>Les prisonniers ne voient que les ombres projetées sur le mur. Pour eux, les ombres SONT la réalité.</strong></p><p>L'un d'eux se libère. Il se retourne. Le feu l'aveugle. Puis il sort de la caverne. Le soleil l'aveugle encore plus. Progressivement, il distingue les objets, puis les étoiles, et finalement — le soleil.</p><p><strong>Le soleil = le Bien suprême.</strong> Source de toute lumière, de toute vérité.</p><p>Le philosophe libéré redescend pour aider les autres. <strong>Ils le prennent pour un fou.</strong> Si quelqu'un essayait de les détacher, ils le tueraient.</p><p>Platon écrit ça en pensant à Socrate : l'homme qui a vu la vérité, et qu'on tue pour ça. Les "ombres" modernes : réseaux sociaux, opinions reçues, biais cognitifs. Sortir de la caverne, c'est penser par soi-même — douloureux, impopulaire.</p><blockquote>"La vérité est le flambeau qui éclaire sans aveugler."<small>— Platon, République VII, 514a-520a</small></blockquote>`},
{id:190,th:"kant",ti:"L'impératif catégorique",s:"Tu mens ? Imagine que TOUT LE MONDE mente. Le monde s'effondre. Donc tu ne dois pas mentir. Kant résume toute la morale en un test.",img:"⬡",body:`<p>Kant pose LA question morale universelle : <strong>"Est-ce que je pourrais vouloir que tout le monde fasse la même chose ?"</strong></p><p>Trois formulations du même principe :</p><p><strong>1. UNIVERSALISATION</strong> — Agis uniquement selon la maxime que tu pourrais vouloir comme loi universelle. Si tu mens, tu veux que tout le monde mente ? Non — le mensonge universel détruit la confiance.</p><p><strong>2. HUMANITÉ</strong> — Traite l'humanité, en toi et en autrui, toujours comme une fin, jamais seulement comme un moyen.</p><p><strong>3. AUTONOMIE</strong> — La volonté morale se donne sa propre loi.</p><p>La morale kantienne ne dépend ni du bonheur ni des conséquences. Elle dépend du <strong>devoir</strong>.</p><blockquote>"Le ciel étoilé au-dessus de moi et la loi morale en moi."<small>— Kant, Critique de la raison pratique</small></blockquote>`},
{id:200,th:"descartes",ti:"Le morceau de cire",s:"Descartes prend un morceau de cire. Il a une couleur, une odeur, un son. Il le chauffe : tout change. Pourtant tu SAIS que c'est la même cire. Comment ?",img:"🕯️",body:`<p>Descartes tient un morceau de cire fraîchement retiré de la ruche : couleur miel, odeur de fleurs, forme ferme. Tous ses sens confirment : c'est de la cire.</p><p>Puis il l'approche du feu. <strong>Tout change.</strong> La couleur, l'odeur, le son, la forme, la texture. Si tu ne te fiais qu'à tes sens, tu dirais que c'est un AUTRE objet.</p><p>Pourtant — tu SAIS que c'est la même cire. Comment ? C'est ton <strong>entendement</strong> — ta raison — qui saisit l'identité de la cire à travers ses transformations.</p><p>Conclusion : <strong>l'esprit connaît mieux que les sens.</strong> Les sens donnent des impressions changeantes. L'esprit saisit l'essence.</p><p>Application : la prochaine fois que ton "instinct" te dit quelque chose — est-ce mes sens (émotion, biais) ou mon entendement (analyse, logique) ?</p><blockquote>"Ce n'est point par la vision des yeux mais par la seule inspection de l'esprit que je conçois la cire."<small>— Descartes, Méditations, II</small></blockquote>`},
{id:210,th:"epicurus",ti:"Le tétrapharmakos : quatre pilules contre l'angoisse",s:"4 pilules contre l'angoisse existentielle. Les dieux ne sont pas à craindre. La mort n'est rien. Le bonheur est accessible. La douleur est supportable.",img:"🌿",body:`<p>Épicure résume sa philosophie en quatre remèdes — le <strong>tétrapharmakos</strong> :</p><p><strong>1. Les dieux ne sont pas à craindre</strong> — ils ne s'occupent pas de nous.</p><p><strong>2. La mort n'est rien pour nous</strong> — "Quand nous sommes, la mort n'est pas. Quand la mort est, nous ne sommes plus."</p><p><strong>3. Le bonheur est accessible</strong> — il réside dans l'absence de trouble (ataraxie).</p><p><strong>4. La douleur est supportable</strong> — si intense, elle est brève. Si longue, supportable.</p><p>Épicure distingue trois types de plaisirs : naturels et nécessaires (manger), naturels et non nécessaires (bien manger), et vains (la gloire). Seuls les premiers sont vrais.</p><blockquote>"La mort n'est rien pour nous : quand nous sommes, elle n'est pas ; quand elle est, nous ne sommes plus."<small>— Épicure, Lettre à Ménécée</small></blockquote>`},
{id:220,th:"marcus_aurelius",ti:"L'exercice du matin de Marc Aurèle",s:"'Je vais rencontrer un importun, un ingrat, un insolent.' Marc Aurèle se disait ça chaque matin. Pas par pessimisme — par préparation.",img:"🌅",body:`<h3>🧠 L'exercice quotidien de l'empereur</h3><p>Chaque matin, Marc Aurèle se répétait : <strong>"Je vais rencontrer un importun, un ingrat, un insolent, un envieux. Tous ces défauts leur sont venus parce qu'ils ignorent le bien et le mal."</strong></p><p>Ce n'est PAS du pessimisme. C'est de la <strong>praemeditatio malorum</strong> — la préméditation des maux. En anticipant les difficultés, tu ne seras pas surpris.</p><p>La colère naît toujours d'un écart entre l'attente et la réalité.</p><p><strong>Version moderne :</strong> 1. Chaque matin, identifie la difficulté probable du jour. 2. Les gens agissent par ignorance, pas par malice. 3. "Que puis-je contrôler ?" 4. Chaque soir, l'examen : "Qu'ai-je fait de bien ? de mal ?"</p><blockquote>"Bientôt tu auras tout oublié, et bientôt tous t'auront oublié."<small>— Marc Aurèle, Pensées, VII.21</small></blockquote>`},
{id:300,th:"sartre",ti:"L'existentialisme en 60 secondes",s:"Sartre en 60 secondes : pourquoi tu es 'condamné à être libre'. L'existentialisme avec des exemples concrets qui parlent à ta vie.",img:"🎬",t:"video",vid:"mIYdx6lDDhg"},

{id:400,th:"nietzsche",ti:"L'abîme qui regarde en toi",s:"'Celui qui combat des monstres doit veiller à ne pas devenir monstre lui-même.' Deux phrases de Nietzsche qui contiennent une vie de sagesse.",img:"🌑",body:`<p>Nietzsche, Par-delà bien et mal, §146 :</p><p style="font-size:20px;text-align:center" class="sf"><em>"Celui qui combat des monstres doit veiller à ne pas devenir monstre lui-même. Et quand tu regardes longtemps dans un abîme, l'abîme aussi regarde en toi."</em></p><p>Première partie : <strong>la contagion du mal.</strong> Pour combattre un ennemi, tu dois penser comme lui. Peu à peu, la frontière s'estompe. Les meilleurs policiers finissent par ressembler aux criminels qu'ils pourchassent.</p><p>Deuxième partie : <strong>l'abîme intérieur.</strong> Quand tu explores tes propres profondeurs, ce que tu découvres te transforme.</p><p>Ce n'est pas un appel à l'ignorance. C'est un avertissement : la connaissance du mal a un prix.</p><blockquote>"Quand tu regardes longtemps dans un abîme, l'abîme aussi regarde en toi."<small>— Nietzsche, Par-delà bien et mal, §146</small></blockquote>`},
{id:401,th:"seneca",ti:"Le temps volé",s:"Sénèque observe ses contemporains romains. Il décrit nos vies à nous, 2 000 ans plus tard. Avec une précision terrifiante.",img:"⌛",body:`<p>Sénèque observe ses contemporains romains — et décrit nos vies à nous :</p><p><strong>"Tu vis comme si tu allais vivre éternellement. Tu ne remarques pas combien de temps a déjà passé. Tu le gaspilles comme s'il coulait d'une source intarissable."</strong></p><p>Le pire : nous sommes radins avec notre argent mais prodigues avec notre temps. L'argent perdu se regagne. Le temps perdu est perdu à jamais.</p><p><strong>"Il ne faut pas dire 'je n'ai pas le temps'. La vérité est : 'ce n'est pas ma priorité'."</strong></p><blockquote>"Ce n'est pas que nous disposions de très peu de temps, c'est plutôt que nous en perdons beaucoup."<small>— Sénèque, De la brièveté de la vie, I</small></blockquote>`},
{id:402,th:"camus",ti:"La première phrase de L'Étranger",s:"'Aujourd'hui, maman est morte. Ou peut-être hier.' La société condamnera Meursault moins pour avoir tué que pour ne pas avoir pleuré.",img:"☀️",body:`<p>L'ouverture la plus célèbre de la littérature française :</p><p style="font-size:20px;text-align:center" class="sf"><em>"Aujourd'hui, maman est morte. Ou peut-être hier, je ne sais pas."</em></p><p>L'indifférence de Meursault n'est pas de l'insensibilité — c'est un <strong>refus radical du théâtre social</strong>. Il ne joue pas la comédie du deuil.</p><p>Le twist : Meursault tue un homme "à cause du soleil". Et la société le condamnera <strong>moins pour avoir tué que pour ne pas avoir pleuré à l'enterrement de sa mère</strong>.</p><p>Nous vivons dans un monde où montrer qu'on souffre est plus important que souffrir réellement. Dans un monde bâti sur le mensonge social, la sincérité est un crime capital.</p><blockquote>"Aujourd'hui, maman est morte. Ou peut-être hier, je ne sais pas."<small>— Camus, L'Étranger, incipit</small></blockquote>`},
{id:403,th:"sartre",ti:"L'enfer, c'est les autres",s:"3 morts enfermés dans une pièce. Pas de bourreau. Pas de flammes. Ils se torturent mutuellement par le regard. Pour l'éternité.",img:"🚪",body:`<p>1944. Huis clos. Trois personnes sont enfermées dans un salon pour l'éternité. Pas de bourreau. Pas de flammes. <strong>Ils se torturent mutuellement par le regard.</strong></p><p>Garcin veut qu'Inès le juge courageux → elle SAIT qu'il est lâche. Estelle veut que Garcin la désire → il s'en fiche. Un triangle infernal où chacun est le bourreau des deux autres.</p><p>À la fin, la porte s'ouvre. Ils pourraient partir. <strong>Ils restent.</strong> Parce que dehors, il n'y a personne pour les regarder — et c'est pire.</p><p>Les réseaux sociaux sont un Huis clos à grande échelle. 8 milliards de regards qui te jugent, te figent dans une image. L'enfer n'a jamais eu autant de spectateurs.</p><blockquote>"L'enfer, c'est les autres."<small>— Sartre, Huis clos, scène 5</small></blockquote>`},
{id:404,th:"epictetus",ti:"La tasse cassée",s:"'Quand tu embrasses ton enfant, murmure : j'embrasse un mortel.' Ça semble cruel. C'est le contraire — et la psychologie moderne le confirme.",img:"🏺",body:`<p>Épictète propose un exercice qui semble cruel mais d'une efficacité redoutable :</p><p><strong>"Quand tu tiens ta tasse préférée, dis-toi : 'je tiens un objet fragile.' Quand tu embrasses ton enfant le soir, murmure : 'j'embrasse un mortel.'"</strong></p><p>Ce n'est PAS du pessimisme. C'est de la <strong>praemeditatio malorum</strong>. En anticipant la perte, cette conscience de la fragilité rend le moment présent <em>plus</em> intense, pas moins.</p><p>La psychologie moderne l'appelle "visualisation négative". Imagine que tu as perdu ton job, ta santé, un proche. Puis ouvre les yeux. Tout ce que tu as est un cadeau.</p><blockquote>"Ne dis jamais de rien 'je l'ai perdu', mais 'je l'ai rendu'."<small>— Épictète, Manuel, XI</small></blockquote>`},
{id:500,th:"socrates",ti:"Le procès qui a changé l'histoire",s:"399 av. J.-C. Ses amis organisent sa fuite. Il refuse. Fuir serait trahir tout ce qu'il a enseigné. Il boit la ciguë en philosophant.",img:"⚖️",body:`<p>399 av. J.-C. Athènes. L'accusation : <strong>"Corruption de la jeunesse et introduction de divinités nouvelles."</strong> En réalité, Socrate dérange.</p><p>Devant ses 501 juges, il ne supplie pas. Il ne pleure pas. <strong>Il philosophe.</strong></p><p>"Si vous me tuez, vous ne trouverez pas facilement un autre homme comme moi, attaché à la cité comme un taon à un grand cheval noble mais un peu lent."</p><p>Condamné à mort. Ses amis organisent sa fuite. Il refuse. <em>"Ce serait trahir tout ce que j'ai enseigné."</em></p><p>Il boit la ciguë en philosophant. Ses derniers mots : <strong>"Nous devons un coq à Asclépios."</strong></p><blockquote>"L'heure du départ est arrivée. Qui de nous a le meilleur partage, nul ne le sait, excepté Dieu."<small>— Socrate, in Platon, Apologie, 42a</small></blockquote>`},
{id:501,th:"spinoza",ti:"L'Éthique : un traité de géométrie sur la liberté",s:"Il passe sa vie à polir des lentilles. Le soir, il écrit un livre avec des axiomes et des théorèmes — comme en géométrie. Mais sur Dieu et la liberté.",img:"💎",body:`<p>Spinoza passe sa vie à polir des lentilles. Mais le soir, il écrit un livre qui ne sera publié qu'après sa mort — parce que de son vivant, il serait trop dangereux.</p><p>L'Éthique (1677) est rédigée <em>more geometrico</em> — axiomes, définitions, démonstrations, comme un traité de géométrie. L'idée : <strong>prouver les vérités sur Dieu, l'âme et la liberté avec la rigueur d'un théorème.</strong></p><p>La thèse centrale : nous ne sommes pas libres au sens courant. Mais plus nous comprenons les causes qui nous déterminent, plus nous nous en libérons. <strong>La connaissance est la seule vraie libération.</strong></p><blockquote>"La béatitude n'est pas la récompense de la vertu, c'est la vertu elle-même."<small>— Spinoza, Éthique, V, prop. 42</small></blockquote>`},
{id:502,th:"kant",ti:"Qu'est-ce que les Lumières ?",s:"1784. Kant publie un texte de 4 pages. Il contient la phrase la plus importante des Lumières. Et elle n'a jamais été aussi urgente qu'aujourd'hui.",img:"💡",body:`<p>1784. Kant publie le manifeste des Lumières :</p><p style="font-size:18px;text-align:center" class="sf"><em>"Les Lumières, c'est la sortie de l'homme hors de la minorité dont il est lui-même responsable."</em></p><p>La "minorité" : l'incapacité de se servir de son propre entendement sans la direction d'un autre.</p><p><strong>SAPERE AUDE — Ose penser par toi-même.</strong></p><p>La paresse et la lâcheté sont les causes de cette minorité. "J'ai un livre qui pense pour moi, un directeur de conscience, un médecin qui juge de mon régime..."</p><p>Ce texte décrit exactement notre rapport aux algorithmes, aux influenceurs, aux "experts" médiatiques.</p><blockquote>"Sapere aude ! Aie le courage de te servir de ton propre entendement."<small>— Kant, Qu'est-ce que les Lumières ?, 1784</small></blockquote>`},
{id:510,th:"greene",ti:"Grand strategy : perdre des batailles pour gagner la guerre",s:"Napoléon gagnait presque toutes ses batailles. Mais il a perdu la guerre. Churchill perdait souvent. Il a gagné la guerre. La différence s'appelle la grand strategy.",img:"🗺️",body:`<p>La plupart des gens sont des <strong>tacticiens</strong>. Très peu sont des <strong>stratèges</strong> — capables de voir au-delà de la bataille vers la guerre entière.</p><p>Churchill a perdu de nombreuses batailles mais gardait toujours en vue l'objectif final. Chaque revers était un sacrifice calculé.</p><p>À l'inverse, Napoléon gagnait presque toutes ses batailles — mais il a perdu la guerre. Chaque victoire l'entraînait plus loin, créait plus d'ennemis.</p><p><strong>Application :</strong> Avant de te battre, demande-toi : "Est-ce que gagner CE combat me rapproche de MON objectif final ?" Si non, recule.</p><blockquote>"La grand strategy est l'art de regarder au-delà de la bataille et de calculer en avance."<small>— Robert Greene, Stratégie 12</small></blockquote>`},
{id:511,th:"greene",ti:"Connaître l'ennemi : la stratégie de l'intelligence",s:"Mao a détecté la trahison de Lin Biao par ses compliments excessifs. Un ami soudainement trop chaleureux ? Méfiance.",img:"🧠",body:`<p>Stratégie 13 de Greene : <strong>la cible de ta stratégie n'est pas l'armée adverse — c'est l'ESPRIT de celui qui la dirige.</strong></p><p>Greene enseigne à lire les gens par leurs <strong>signaux involontaires</strong> :</p><p>• Un ami soudainement trop chaleureux ? Méfiance.</p><p>• Quelqu'un qui évite votre regard quand il parle de vous ? Il cache quelque chose.</p><p>• Une générosité soudaine — des signaux que le conscient cache mais que le corps révèle.</p><blockquote>"Entraînez-vous à lire les gens, en captant les signaux qu'ils envoient inconsciemment."<small>— Robert Greene, Stratégie 13</small></blockquote>`},
{id:520,th:"carnegie",ti:"Les 30 jours qui changeront tes relations",s:"30 jours pour transformer tes relations. Semaine 1 : ne critique personne. Semaine 2 : un compliment sincère par jour. Semaine 3 : écoute plus que tu ne parles.",img:"📅",body:`<h3>🧠 Le défi Carnegie — 4 semaines</h3><p><strong>SEMAINE 1 — ARRÊTE DE CRITIQUER</strong><br>Pendant 7 jours, ne critique PERSONNE. Quand l'envie te prend : "Pourquoi agit-il ainsi ?"</p><p><strong>SEMAINE 2 — APPRÉCIE SINCÈREMENT</strong><br>Chaque jour, un compliment SINCÈRE et SPÉCIFIQUE.</p><p><strong>SEMAINE 3 — ÉCOUTE</strong><br>Parle MOINS que l'autre. Pose des questions ouvertes. Mémorise les prénoms.</p><p><strong>SEMAINE 4 — LE SECRET DE SOCRATE</strong><br>Quand tu veux convaincre, commence par des "oui".</p><blockquote>"Les principes de ce livre ne fonctionnent que s'ils viennent du cœur."<small>— Dale Carnegie</small></blockquote>`},
{id:530,th:"joule_beauvois",ti:"La dépense gâchée : pourquoi tu finis le mauvais film",s:"Tu as payé 100$ pour le week-end au Michigan et 50$ pour le Wisconsin. Le Wisconsin est mieux. Lequel choisis-tu ? 54% choisissent le mauvais.",img:"🎬",body:`<p>Arkes et Blumer (1985). Tu as dépensé 100$ pour un week-end au Michigan et 50$ pour le Wisconsin. Le Wisconsin est plus prometteur. Mais les deux tombent le même week-end.</p><p>Un consommateur rationnel choisirait le Wisconsin. <strong>54% choisissent le Michigan</strong> — le plus cher, pas le meilleur.</p><p>C'est la <strong>dépense gâchée</strong> (sunk cost) : rester sur une stratégie dans laquelle tu as investi, même quand une alternative est meilleure.</p><p>La solution : "Si je repartais de zéro, est-ce que je ferais le même choix ?" Si non, change.</p><blockquote>"L'individu reste sur une stratégie dans laquelle il a investi, au détriment d'alternatives plus avantageuses."<small>— Joule & Beauvois</small></blockquote>`},
{id:540,th:"adler",ti:"La séparation des tâches",s:"Tu peux mener un cheval à la rivière. Tu ne peux pas le forcer à boire. L'amener : ta tâche. Boire : la sienne. Le concept le plus libérateur d'Adler.",img:"✂️",body:`<p>Le concept le plus libérateur d'Adler : la <strong>séparation des tâches</strong>.</p><p>Quand tu souffres d'une relation : "À qui appartient cette tâche ?"</p><p>• Tu peux présenter ton travail du mieux possible. Comment le boss l'évalue ? <strong>Sa tâche.</strong><br>• Tu peux aimer quelqu'un de tout ton cœur. Qu'il t'aime en retour ? <strong>Sa tâche.</strong></p><p>Ne pas séparer les tâches, c'est entrer dans le territoire de l'autre — source infinie de conflit.</p><p><strong>Tu ne contrôles que ta moitié de l'équation.</strong></p><blockquote>"Le courage de ne pas être aimé commence par la séparation des tâches."<small>— Kishimi</small></blockquote>`},
{id:550,th:"peterson",ti:"Dis la vérité — ou au moins ne mens pas",s:"'Chaque mensonge que tu dis déforme ta perception de la réalité.' Pas pour les autres — pour toi-même. Peterson sur la dette invisible du mensonge.",img:"🗣️",body:`<p><strong>"Chaque mensonge que tu dis déforme ta perception de la réalité."</strong> Chaque mensonge t'oblige à construire un faux monde dans ta tête, qui consomme de l'énergie cognitive.</p><p>Le mensonge crée de la dette : tu devras d'autres mensonges pour soutenir le premier.</p><p>Peterson ne dit pas "dis toujours toute la vérité" — il dit "au minimum, ne mens pas".</p><p>Soljenitsyne : <em>"Un mot de vérité pèse plus que le monde entier."</em></p><blockquote>"Dis la vérité — ou au moins ne mens pas. Le mensonge corrompt le monde."<small>— Jordan Peterson, Règle 8</small></blockquote>`},
{id:560,th:"sun_tzu",ti:"L'eau et la stratégie : fluidité absolue",s:"'Les tactiques sont comme l'eau. L'eau fuit les hauteurs et dévale vers le bas.' Ne répète jamais la même tactique. Musashi ne l'a jamais fait.",img:"💧",body:`<p>La métaphore centrale de Sun Tzu :</p><p style="font-size:18px;text-align:center" class="sf"><em>"Les tactiques militaires sont comme l'eau : l'eau fuit les hauteurs et dévale vers le bas."</em></p><p>L'eau ne s'oppose jamais frontalement. Elle contourne, s'infiltre, érode. Et pourtant <strong>rien ne lui résiste à long terme</strong>.</p><p>Le stratège fait pareil : il ne répète jamais la même tactique. Il s'adapte à l'ennemi comme l'eau s'adapte au terrain.</p><blockquote>"L'eau prend la forme du terrain ; le soldat forge sa victoire selon l'ennemi qu'il affronte."<small>— Sun Tzu, VI.31</small></blockquote>`},
{id:570,th:"rumelt",ti:"Les 4 signes que ta 'stratégie' n'en est pas une",s:"'Notre stratégie est l'intermédiation centrée sur le client.' Traduction : nous sommes une banque. Rumelt décortique le fluff stratégique.",img:"🚨",body:`<p>Rumelt identifie <strong>4 hallmarks</strong> de la mauvaise stratégie :</p><p><strong>1. FLUFF</strong> — Du jargon masquant le vide. "Notre stratégie est l'intermédiation centrée sur le client." Traduction : "Nous sommes une banque."</p><p><strong>2. IGNORER LE PROBLÈME</strong> — Produire un plan qui ignore l'éléphant dans la pièce.</p><p><strong>3. CONFONDRE BUTS ET STRATÉGIE</strong> — "Augmenter notre part de marché de 20%." Ce n'est pas une stratégie — c'est un souhait.</p><p><strong>4. MAUVAIS OBJECTIFS</strong> — Contradictoires, irréalistes.</p><blockquote>"La mauvaise stratégie n'est pas l'absence de bonne stratégie — c'est un édifice bâti sur des fondations fausses."<small>— Rumelt, Ch. 3</small></blockquote>`},
{id:580,th:"james_allen",ti:"Les circonstances ne font pas l'homme",s:"'Ce n'est pas ma faute, c'est la situation.' Allen : c'est exactement l'excuse que tes pensées ont créée pour te protéger.",img:"🔮",body:`<p>Allen attaque notre excuse favorite : <em>"Ce n'est pas ma faute, c'est la situation."</em></p><p><strong>"Les circonstances ne font pas l'homme — elles le révèlent à lui-même."</strong></p><p>C'est brutal ? Oui. Mais Allen ne culpabilise pas — il responsabilise. Si tes pensées ont créé ta situation, alors tes pensées peuvent en créer une autre.</p><blockquote>"L'homme ne peut pas directement choisir ses circonstances, mais il peut choisir ses pensées, et ainsi façonner ses circonstances."<small>— James Allen, As a Man Thinketh</small></blockquote>`},
{id:308,th:"marcus_aurelius",ti:"Marc Aurèle — Sagesse stoïcienne",s:"L'homme le plus puissant du monde écrivait un journal chaque soir dans sa tente de guerre — pour ne pas devenir un monstre. Ses Pensées décryptées.",img:"🎬",t:"video",vid:"Auuk1y4DRgk"},
{id:309,th:"kant",ti:"L'impératif catégorique en 8 minutes",s:"Un seul test pour savoir si un acte est moral : imagine que TOUT LE MONDE fasse la même chose. Le monde tient ? C'est moral. Kant en 8 minutes.",img:"🎬",t:"video",vid:"yMPjTE0G7P8"},
{id:310,th:"spinoza",ti:"Spinoza — liberté et déterminisme",s:"Spinoza dit que tu n'es PAS libre. Tes choix sont déterminés par des causes invisibles. Et pourtant — la liberté est quand même possible. Le paradoxe expliqué.",img:"🎬",t:"video",vid:"pVEeXjPiw54"},
{id:311,th:"carnegie",ti:"Comment se faire des amis — résumé animé",s:"Les 6 principes de Carnegie résumés et animés. Pourquoi ce livre de 1936 est ENCORE le n°1 mondial en relations humaines, 90 ans après.",img:"🎬",t:"video",vid:"B4GAnEsMJkI"},
{id:600,th:"greene",ti:"Le test des 5 ennemis",s:"Identifie les 5 forces qui te bloquent. Personnifie-les. Déclare la guerre à UNE seule. 30 jours. Chaque soir : ai-je gagné ou perdu ?",img:"🎯",body:`<h3>🧠 Exercice : la stratégie de polarité appliquée</h3><p><strong>Étape 1.</strong> Écris les 5 forces qui bloquent ta progression : procrastination, collègue toxique, peur du jugement, confort, indécision.</p><p><strong>Étape 2.</strong> Donne un visage à chaque force. Personnifie-la.</p><p><strong>Étape 3.</strong> Déclare la guerre à UNE de ces forces. Pas les 5 — une seule. 30 jours.</p><p><strong>Étape 4.</strong> Chaque soir : "Ai-je gagné ou perdu la bataille du jour ?"</p><blockquote>"Vos ennemis — vos opposés — peuvent vous remplir de but et de direction."<small>— Robert Greene, Stratégie 1</small></blockquote>`},
{id:601,th:"rumelt",ti:"Exerce-toi : le diagnostic brutal",s:"Un bon diagnostic est une phrase qui fait mal. Si tu la lis et que tu n'es pas gêné, tu n'as pas trouvé le vrai problème.",img:"🔬",body:`<h3>🧠 Exercice : le diagnostic de Rumelt</h3><p><strong>Règle :</strong> Un bon diagnostic est une phrase qui fait mal.</p><p><strong>Mauvais :</strong> "Je veux gagner plus d'argent." (souhait.)<br><strong>Bon :</strong> "Je sous-facture parce que j'ai peur que mes clients partent si j'augmente mes prix."</p><p><strong>Essaie :</strong> 1. Domaine où tu stagnes ? 2. LE problème en une phrase brutale. 3. Lis-le à voix haute. Ça fait mal ? Bien. 4. Cherche la politique et les actions.</p><blockquote>"Si le diagnostic ne te met pas mal à l'aise, tu n'as pas trouvé le vrai problème."<small>— Inspiré de Rumelt</small></blockquote>`},
{id:602,th:"joule_beauvois",ti:"Crée ton propre engagement",s:"Les gens qui écrivent leurs objectifs et les partagent ont 42% plus de chances de les atteindre. Ce n'est pas de la magie — c'est de l'engagement.",img:"🔗",body:`<h3>🧠 Exercice : l'auto-engagement</h3><p><strong>1. RENDS L'ACTE PUBLIC</strong> — Dis à 3 personnes ce que tu vas faire.</p><p><strong>2. RENDS-LE IRRÉVOCABLE</strong> — Paie d'avance. (Cortés et ses navires.)</p><p><strong>3. RENDS-LE COÛTEUX</strong> — Mets de l'argent, du temps en jeu.</p><p><strong>4. RÉPÈTE</strong> — Chaque jour tenu renforce l'engagement.</p><p><strong>5. SENTIMENT DE LIBERTÉ</strong> — "Je suis libre de ne pas le faire."</p><blockquote>"Seuls les actes nous engagent. Pas nos idées — nos actes."<small>— Kiesler, via Joule & Beauvois</small></blockquote>`},
